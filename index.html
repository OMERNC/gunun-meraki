<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Günün Merakı">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f3fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1a29" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="ikon-180.png">
<link rel="icon" type="image/png" href="ikon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Günün Merakı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Literata:opsz,wght@7..72,400;7..72,500&family=Manrope:wght@500;600;700&display=swap">
<style>
/* Layout: tek sütun okuma akışı — manzara başlığı, okuma, "biliyor muydunuz", mini test, akşam sorusu, yarının kartı, geçmiş */
:root{
  --bg:#f6f3fa; --bg2:#eef4f7; --ink:#3a3450; --muted:#7c7491; --card:#ffffff; --line:#e6e0ef;
  --lav:#b7a6e6; --lav-soft:#efe9fb; --peach:#ffd6c4; --peach-soft:#fff1ea; --sage:#b6dcc6; --sage-soft:#e9f6ee;
  --accent:#7d66cf; --ok:#4f9c80; --ok-soft:#e3f3ea; --no:#c9746c; --no-soft:#fbe9e6; --shadow:rgba(80,60,130,.10);
  --display:"Marcellus", "Palatino Linotype", Georgia, serif;
  --read:"Literata", Georgia, "Times New Roman", serif;
  --ui:"Manrope", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1d1a29; --bg2:#1a2128; --ink:#ebe6f6; --muted:#a59cbc; --card:#28243a; --line:#3a3452;
  --lav:#a996e6; --lav-soft:#312a4d; --peach:#f2b9a2; --peach-soft:#3a2b2c; --sage:#8fc2a8; --sage-soft:#22352d;
  --accent:#b9a8f2; --ok:#86cdb0; --ok-soft:#203a31; --no:#f0a39b; --no-soft:#3f2726; --shadow:rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1d1a29; --bg2:#1a2128; --ink:#ebe6f6; --muted:#a59cbc; --card:#28243a; --line:#3a3452;
  --lav:#a996e6; --lav-soft:#312a4d; --peach:#f2b9a2; --peach-soft:#3a2b2c; --sage:#8fc2a8; --sage-soft:#22352d;
  --accent:#b9a8f2; --ok:#86cdb0; --ok-soft:#203a31; --no:#f0a39b; --no-soft:#3f2726; --shadow:rgba(0,0,0,.35); color-scheme:dark }

*{box-sizing:border-box}
body{background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%) fixed;background-color:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.55;min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 56px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}

/* üst bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hello small{display:block;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hello h1{font-size:1.6rem}
.pills{display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font:600 .82rem var(--ui);font-variant-numeric:tabular-nums}
button.pill{cursor:pointer}
button.pill[aria-pressed="true"]{background:var(--lav-soft);border-color:var(--lav)}
button.pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.bars i{width:3px;background:var(--accent);border-radius:2px;height:4px}
[aria-pressed="true"] .bars i{animation:eq 1.2s ease-in-out infinite}
[aria-pressed="true"] .bars i:nth-child(2){animation-delay:.3s}
[aria-pressed="true"] .bars i:nth-child(3){animation-delay:.6s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}

/* manzara başlığı */
.hero{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:4/3;max-width:100%;box-shadow:0 18px 40px -18px var(--shadow);background:var(--lav-soft)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 60%;animation:drift 48s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1.02) translateX(0)}to{transform:scale(1.12) translateX(-2.5%)}}
.motes{position:absolute;inset:0;pointer-events:none}
.motes i{position:absolute;bottom:-10px;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.85);filter:blur(1px);animation:rise linear infinite;opacity:0}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-110%) translateX(20px);opacity:0}}
.hero .veil{position:absolute;inset:auto 0 0 0;height:62%;background:linear-gradient(180deg,rgba(40,30,70,0) 0%,rgba(40,30,70,.55) 100%)}
.hero .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 20px 20px;color:#fff;display:flex;flex-direction:column;gap:6px}
.hero .cap .meta{font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;opacity:.92}
.hero .cap h2{font-size:clamp(1.55rem,6vw,2.15rem);text-shadow:0 2px 14px rgba(30,20,60,.35)}

/* okuma */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 20px}
.read{display:flex;flex-direction:column;gap:14px;font-family:var(--read);font-size:1.07rem;line-height:1.75}
.read p{max-width:62ch}
.read p:first-child::first-letter{font-family:var(--display);float:left;font-size:3.1em;line-height:.9;padding:6px 8px 0 0;color:var(--accent)}
.know{border-radius:18px;background:var(--peach-soft);border:1px solid var(--peach);padding:16px 18px;display:flex;gap:12px;align-items:flex-start}
.know svg{flex:0 0 26px;margin-top:2px}
.know b{display:block;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
.know p{font-family:var(--read);font-size:.98rem;line-height:1.6}

/* test */
.quiz h3{font-size:1.35rem;margin-bottom:4px}
.quiz .sub{color:var(--muted);font-size:.9rem;margin-bottom:14px}
.q{display:flex;flex-direction:column;gap:9px;padding:16px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0;padding-top:4px}
.q .qs{font-weight:600;line-height:1.45}
.q .qs span{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:6px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:420px){.opts{grid-template-columns:1fr}}
.opt{appearance:none;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:11px 13px;font:500 .95rem var(--ui);cursor:pointer;transition:background .2s,border-color .2s,transform .1s}
.opt:hover{border-color:var(--lav)}
.opt:active{transform:scale(.99)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt[disabled]{cursor:default}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.opt.wrong{background:var(--no-soft);border-color:var(--no)}
.opt.dim{opacity:.55}
.expl{font-family:var(--read);font-size:.95rem;line-height:1.6;color:var(--ink);padding:10px 13px;border-radius:12px;background:var(--lav-soft)}
.expl b{font-family:var(--ui)}
.result{margin-top:6px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.score{font-family:var(--display);font-size:1.6rem}
.note{font-size:.85rem;color:var(--muted)}

/* akşam sorusu */
.talk{background:var(--sage-soft);border:1px solid var(--sage);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:8px}
.talk b{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase}
.talk p{font-family:var(--display);font-size:1.3rem;line-height:1.35}

/* yarın */
.tomorrow{display:flex;gap:14px;align-items:center;border:1px dashed var(--lav);border-radius:22px;padding:16px 18px;background:color-mix(in srgb, var(--card) 70%, transparent)}
.tomorrow svg{flex:0 0 44px}
.tomorrow h3{font-size:1.15rem}
.tomorrow p{color:var(--muted);font-size:.9rem}

/* geçmiş */
.past h3{font-size:1.25rem;margin-bottom:10px}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{appearance:none;width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:10px 14px;font:inherit;cursor:pointer}
.prow[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.prow:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.prow .dn{font-family:var(--display);font-size:1.2rem;width:2ch;text-align:center;color:var(--accent);font-variant-numeric:tabular-nums}
.prow .pt{min-width:0}
.prow .pt small{display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.prow .pt span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .ps{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.foot{display:flex;justify-content:center;gap:16px;color:var(--muted);font-size:.82rem}
.link{appearance:none;background:none;border:0;padding:0;color:var(--accent);font:600 .82rem var(--ui);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* isim seçimi */
.who{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));background:rgba(40,30,70,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.who .box{width:min(420px,100%);background:var(--card);border-radius:26px;padding:26px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 60px -20px rgba(40,30,70,.4)}
.who h2{font-size:1.7rem}
.who p{color:var(--muted)}
.who .names{display:flex;gap:10px;flex-wrap:wrap}
.who .names button{flex:1 1 120px}
.btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:var(--card);border-radius:14px;padding:12px 16px;font:700 .95rem var(--ui);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.who input{border:1px solid var(--line);border-radius:14px;padding:12px;font:500 1rem var(--ui);background:var(--bg);color:var(--ink);width:100%}
.who input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.lbl{font-size:.78rem;font-weight:700;letter-spacing:.06em;color:var(--muted);margin-bottom:-8px}
.fam summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.9rem}
.fam[open]{display:flex;flex-direction:column;gap:10px}
.fam .hint{font-size:.8rem}
.err{color:var(--no);font-size:.85rem;min-height:1em}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0}

@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
</style>

<div class="wrap">
  <header class="top">
    <div class="hello"><small id="today-date"></small><h1 id="greet">Günün Merakı</h1></div>
    <div class="pills">
      <span class="pill" id="streak" title="Üst üste gün">0 gün</span>
      <button class="pill" id="music" type="button" aria-pressed="false" aria-label="Sakin müziği aç veya kapat"><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span><span id="musiclbl">Müzik</span></button>
    </div>
  </header>

  <section class="hero" id="hero" aria-label="Günün manzarası">
    <img id="heroimg" alt="" src="">
    <div class="motes" aria-hidden="true"></div>
    <div class="veil"></div>
    <div class="cap"><span class="meta" id="meta"></span><h2 id="title"></h2></div>
  </section>

  <article class="card read" id="read"></article>
  <aside class="know" id="know"></aside>
  <section class="card quiz" id="quiz"></section>
  <section class="talk" id="talk" hidden></section>
  <section id="tomorrow"></section>
  <section class="past" id="past"></section>
  <footer class="foot"><span id="whoami"></span><button class="link" id="rename" type="button">Adı değiştir</button></footer>
</div>

<div class="who" id="who" hidden>
  <form class="box" id="whoform">
    <h2>Hoş geldiniz</h2>
    <p>Her gün iki yeni merak açılır, biri sabah biri akşam. Okuyun, üç soruyu yanıtlayın, akşam üzerine konuşun. Başlamak için adınızı yazın; bu telefonda bu adla devam edersiniz.</p>
    <label class="lbl" for="nameinput">Adınız</label>
    <input id="nameinput" autocomplete="given-name" maxlength="24" placeholder="Örneğin Ayşe" required>
    <p class="err" id="whoerr" aria-live="polite"></p>
    <button class="btn" type="submit">Başla</button>
  </form>
</div>


<script>
const GUNLER = [{"n": 1, "kategori": "Bilim tarihi", "sahne": "vadi", "baslik": "Bir sopa ve bir gölgeyle Dünya'yı ölçmek", "okuma": ["MÖ 3. yüzyılda İskenderiye Kütüphanesi'nin başında Eratosthenes adında bir bilgin vardı. Bir gün, güneydeki Siyene kentinde (bugünkü Asvan) yaz gündönümünün öğle vaktinde güneşin bir kuyunun dibine kadar dik vurduğunu, yani cisimlerin gölge bırakmadığını duydu.", "Aynı gün aynı saatte İskenderiye'de dikilen bir çubuk ise kısa bir gölge bırakıyordu. Eratosthenes gölgenin açısını ölçtü: yaklaşık 7,2 derece. Bu, tam bir çemberin ellide biri demekti.", "Mantık basitti: Güneş ışınları paralel geliyorsa ve iki kent arasındaki açı farkı çemberin ellide biriyse, iki kent arasındaki mesafe de Dünya'nın çevresinin ellide biri olmalıydı. Aradaki uzaklığı yaklaşık 5.000 stadion kabul etti ve Dünya'nın çevresini yaklaşık 250.000 stadion buldu.", "Stadionun bugünkü kaç metreye denk geldiği tartışmalı olsa da, hesabın bugün bilinen yaklaşık 40.000 kilometreye şaşırtıcı derecede yakın olduğu kabul edilir. Üstelik bunu yalnızca gözlem, geometri ve sağlam bir akıl yürütmeyle yaptı."], "biliyor": "Eratosthenes, asal sayıları bulmak için bugün hâlâ okullarda öğretilen \"Eratosthenes Kalburu\" yöntemini de geliştirdi.", "sorular": [{"s": "İskenderiye'deki çubuğun gölge açısı yaklaşık kaç dereceydi?", "c": ["7,2", "15", "23,5", "45"], "d": 0, "a": "Eratosthenes açıyı yaklaşık 7,2 derece ölçtü. Bu küçük açı, hesabın anahtarı oldu."}, {"s": "7,2 derece, tam bir çemberin kaçta biridir?", "c": ["Onda biri", "Yirmide biri", "Ellide biri", "Yüzde biri"], "d": 2, "a": "Tam çember 360 derecedir. 360 ÷ 7,2 = 50, yani ellide biri."}, {"s": "Eratosthenes hangi kurumun başındaydı?", "c": ["Atina Akademisi", "İskenderiye Kütüphanesi", "Bergama Kütüphanesi", "Roma Senatosu"], "d": 1, "a": "Antik dünyanın en büyük bilgi merkezi olan İskenderiye Kütüphanesi'nin yöneticisiydi."}], "sohbet": "Elinizde yalnızca bir sopa ve güneş olsaydı, neyi ölçmeyi denerdiniz?"}, {"n": 2, "kategori": "Sanat", "sahne": "safak", "baslik": "Mona Lisa'yı dünyaca ünlü yapan hırsızlık", "okuma": ["Leonardo da Vinci Mona Lisa'yı 1500'lerin başında yapmaya başladı ve yıllarca üzerinde çalıştı. Tablo sanılandan küçüktür: yaklaşık 77 × 53 santimetre. Kavak ağacından bir panel üzerine yapılmıştır.", "Leonardo, renklerin ve gölgelerin keskin çizgiler olmadan, duman gibi birbirine karıştığı \"sfumato\" tekniğini ustalıkla kullandı. Dudakların köşesindeki belirsizlik, gülümsemenin bakış açısına göre değişiyormuş gibi görünmesini sağlar.", "Ancak tablo 20. yüzyılın başına kadar daha çok sanat çevrelerinde biliniyordu. 21 Ağustos 1911 sabahı, Louvre'da daha önce çalışmış İtalyan Vincenzo Peruggia tabloyu müzeden kaçırdı. Gazeteler günlerce bu olayı yazdı; Louvre'daki boş duvarı görmek için kuyruklar oluştu.", "Tablo, yaklaşık iki yıl dört ay sonra, 12 Aralık 1913'te Floransa'da, Peruggia'nın kaldığı otel odasında bulundu. Bu olaydan sonra Mona Lisa, dünyanın en çok tanınan tablosu hâline geldi."], "biliyor": "Hırsızlık soruşturması sırasında şair Guillaume Apollinaire kısa süre tutuklandı, Pablo Picasso da sorgulandı. İkisi de suçsuz çıktı.", "sorular": [{"s": "Mona Lisa hangi yıl Louvre'dan çalındı?", "c": ["1889", "1911", "1923", "1939"], "d": 1, "a": "21 Ağustos 1911 sabahı çalındı ve iki yıldan uzun süre kayıp kaldı."}, {"s": "Renklerin duman gibi birbirine karıştığı tekniğin adı nedir?", "c": ["Fresk", "Sfumato", "Puantilizm", "Kolaj"], "d": 1, "a": "İtalyanca \"duman\" anlamındaki fumo kelimesinden gelen sfumato, keskin hatlar yerine yumuşak geçişler kullanır."}, {"s": "Çalınan tablo hangi şehirde bulundu?", "c": ["Roma", "Milano", "Floransa", "Venedik"], "d": 2, "a": "12 Aralık 1913'te Floransa'da, hırsızın kaldığı otel odasında bulundu."}], "sohbet": "Bir eseri ünlü yapan sizce eserin kendisi mi, yoksa etrafındaki hikâye mi?"}, {"n": 3, "kategori": "Coğrafya", "sahne": "dag", "baslik": "Van Gölü: Sabunsuz yıkayan su", "okuma": ["Van Gölü, yaklaşık 3.713 km² yüzölçümüyle Türkiye'nin en büyük gölüdür. Deniz seviyesinden yaklaşık 1.646 metre yükseklikte yer alır ve en derin yeri 450 metreyi aşar.", "Gölün suyu hem tuzlu hem de sodalıdır; pH değeri 9,8 civarındadır. Bu yüksek alkalilik, suyu çoğu canlı için yaşanmaz kılar. Bölgede eskiden çamaşırların bu suyla sabunsuz yıkandığı anlatılır.", "Bu zorlu suya uyum sağlamış tek balık türü inci kefalidir. Ama inci kefali bile yumurtalarını gölde bırakamaz: Her ilkbaharda binlerce balık, yumurtlamak için göle dökülen tatlı su derelerine doğru akıntıya karşı yüzer. Yavrular derelerde gelişip sonra göle döner.", "Bu göç sırasında balıklar sığ derelerde neredeyse sırt sırta ilerler. Göç döneminde av yasağı uygulanır ve bu doğa olayı her yıl pek çok kişiyi bölgeye çeker."], "biliyor": "Van Gölü'nün suyu sodalı ve tuzlu olduğu için en soğuk kışlarda bile genellikle donmaz.", "sorular": [{"s": "Van Gölü'nün yaklaşık yüzölçümü nedir?", "c": ["750 km²", "1.650 km²", "3.700 km²", "9.000 km²"], "d": 2, "a": "Yaklaşık 3.713 km² ile Türkiye'nin en büyük gölüdür."}, {"s": "Van Gölü'nün suyuna uyum sağlamış tek balık türü hangisidir?", "c": ["Alabalık", "İnci kefali", "Sazan", "Levrek"], "d": 1, "a": "İnci kefali, gölün sodalı ve tuzlu suyunda yaşayabilen tek balık türüdür."}, {"s": "İnci kefali ilkbaharda neden derelere göç eder?", "c": ["Daha sıcak suya gitmek için", "Avcılardan kaçmak için", "Yumurtlamak için tatlı suya ihtiyaç duyduğu için", "Daha fazla yiyecek bulmak için"], "d": 2, "a": "Yumurtaları ve yavruları gölün sodalı suyunda gelişemez; bu yüzden tatlı su derelerine çıkar."}], "sohbet": "Türkiye'de birlikte görmek istediğiniz ama henüz gitmediğiniz bir doğa harikası hangisi?"}, {"n": 4, "kategori": "Edebiyat", "sahne": "tepeler", "baslik": "Kapısı kilitli, duvarı olmayan türbe", "okuma": ["Nasreddin Hoca'nın 13. yüzyılda yaşadığı kabul edilir. Yaygın görüşe göre Eskişehir'in Sivrihisar ilçesine bağlı Hortu köyünde doğdu, ömrünün önemli bir kısmını geçirdiği Akşehir'de öldü.", "Fıkralarının asıl gücü, güldürürken düşündürmesidir. Göle maya çalarken \"Ya tutarsa?\" diyen Hoca, imkânsız görünen işlere girişmenin umudunu anlatır. Kazan doğurdu diye komşusunu sevindiren Hoca, ölen kazanı da kabul ettirmeyi bilir; mantığın kendi silahıyla oynar.", "Akşehir'deki türbesi de ona yakışır bir şakadır: Türbenin önünde kocaman kilitli bir kapı vardır, ama çevresinde duvar yoktur. İsteyen yanından dolaşıp içeri girebilir.", "Fıkraları Balkanlar'dan Orta Asya'ya kadar geniş bir coğrafyada anlatılır; bazı ülkelerde \"Molla Nasreddin\" adıyla bilinir. UNESCO, 1996'da onun doğumunun 800. yılı dolayısıyla anma etkinlikleri düzenledi."], "biliyor": "Göle maya çalma fıkrasındaki \"Ya tutarsa!\" sözü, bugün girişimcilikten bilime pek çok alanda cesaret örneği olarak anılır.", "sorular": [{"s": "Nasreddin Hoca'nın türbesi hangi ilçededir?", "c": ["Sivrihisar", "Akşehir", "Beypazarı", "Safranbolu"], "d": 1, "a": "Hoca Akşehir'de vefat etti; türbesi de buradadır."}, {"s": "Türbenin ünlü özelliği nedir?", "c": ["Hiç kapısı yoktur", "Kapısı kilitlidir ama çevresinde duvar yoktur", "Tavanı camdandır", "Ters inşa edilmiştir"], "d": 1, "a": "Kilitli bir kapı ama açık bir çevre: Hoca'nın mizahının taşa dönüşmüş hâli."}, {"s": "Nasreddin Hoca'nın yaşadığı kabul edilen yüzyıl hangisidir?", "c": ["11. yüzyıl", "13. yüzyıl", "15. yüzyıl", "17. yüzyıl"], "d": 1, "a": "Anadolu Selçuklu döneminin sonlarına denk gelen 13. yüzyılda yaşadığı kabul edilir."}], "sohbet": "İkinize en çok benzeyen Nasreddin Hoca fıkrası hangisi?"}, {"n": 5, "kategori": "Müzik", "sahne": "deniz", "baslik": "Alkışları göremeyen besteci", "okuma": ["Ludwig van Beethoven, Dokuzuncu Senfoni'sini bestelediğinde neredeyse tamamen sağırdı. Eser 7 Mayıs 1824'te Viyana'daki Kärntnertor Tiyatrosu'nda ilk kez seslendirildi.", "Beethoven sahnede şefin yanında durup tempoları gösterdi. Senfoni bittiğinde salon alkışlarla inliyordu, ama Beethoven hâlâ seyirciye sırtı dönük, partisyonuna bakıyordu. Solistlerden kontralto Caroline Unger onu nazikçe seyirciye doğru çevirdi; Beethoven ancak o zaman alkışları gördü.", "Senfoninin son bölümünde, o güne kadar senfonilerde alışılmadık bir şekilde koro ve solistler yer alır. Sözler, Alman şair Friedrich Schiller'in \"Neşeye Övgü\" (An die Freude) şiirinden alınmıştır.", "Bu bölümün ana melodisi bugün Avrupa'nın marşı olarak kullanılır. Avrupa Konseyi 1972'de, Avrupa Birliği kurumları ise 1985'te bu melodiyi benimsedi."], "biliyor": "Avrupa marşı sözsüz çalınır. Böylece belirli bir dile bağlı kalmadan, müziğin herkesin anlayabildiği diliyle ortak değerleri anlatması amaçlanmıştır.", "sorular": [{"s": "Dokuzuncu Senfoni'deki koro bölümünün sözleri hangi şaire aittir?", "c": ["Goethe", "Schiller", "Heine", "Rilke"], "d": 1, "a": "Friedrich Schiller'in \"Neşeye Övgü\" şiiri kullanılmıştır."}, {"s": "Senfoninin ilk seslendirildiği şehir hangisidir?", "c": ["Berlin", "Bonn", "Viyana", "Paris"], "d": 2, "a": "7 Mayıs 1824'te Viyana'daki Kärntnertor Tiyatrosu'nda seslendirildi."}, {"s": "Beethoven'ın alkışları görmesini kim sağladı?", "c": ["Orkestra şefi", "Kardeşi", "Bir solist şarkıcı", "İmparator"], "d": 2, "a": "Kontralto Caroline Unger onu seyirciye doğru çevirdi."}], "sohbet": "Hayatınızda bir müziğin sizi en çok etkilediği an hangisiydi?"}, {"n": 6, "kategori": "Felsefe", "sahne": "vadi", "baslik": "Sinoplu filozof ve \"Gölge etme\"", "okuma": ["Diyojen (Diogenes), MÖ 5. yüzyılın sonlarında bugünkü Sinop'ta doğdu. Daha sonra Atina'ya giderek Kinik okulun en ünlü temsilcisi oldu. \"Kinik\" adı, Yunanca \"köpek gibi\" anlamına gelen kelimeden gelir; çünkü bu filozoflar toplumun kurallarını umursamadan sade, doğal bir hayat sürdü.", "Diyojen'in tüm mal varlığının bir pelerin, bir değnek ve bir çanaktan ibaret olduğu anlatılır. Bir gün bir çocuğun avucuyla su içtiğini görünce çanağını da atmış: \"Bir çocuk bile beni sadelikte geçti.\"", "En ünlü hikâyesi Büyük İskender'le karşılaşmasıdır. İskender güneşlenen filozofun yanına gelip ne dilerse vereceğini söyler. Diyojen'in cevabı Türkçeye şöyle geçmiştir: \"Gölge etme, başka ihsan istemem.\"", "Gündüz vakti elinde bir fenerle sokaklarda dolaşıp \"Dürüst bir insan arıyorum\" dediği de anlatılır. Rivayete göre İskender'le aynı yıl, MÖ 323'te öldü."], "biliyor": "Sinop'ta, elinde feneri ve yanında köpeğiyle duran bir Diyojen heykeli bulunur.", "sorular": [{"s": "Diyojen bugünkü hangi şehirde doğdu?", "c": ["İzmir", "Sinop", "Bodrum", "Trabzon"], "d": 1, "a": "Antik adıyla Sinope, bugünkü Sinop'ta doğdu."}, {"s": "Diyojen'in temsilcisi olduğu felsefe okulu hangisidir?", "c": ["Stoa", "Epikürcülük", "Kinik", "Septik"], "d": 2, "a": "Adını Yunanca \"köpek gibi\" anlamındaki kelimeden alan Kinik okulun en ünlü temsilcisidir."}, {"s": "Diyojen'in gündüz fenerle aradığı söylenen şey neydi?", "c": ["Kaybolan köpeği", "Dürüst bir insan", "Altın para", "Yeni bir ev"], "d": 1, "a": "Gündüz fenerle \"dürüst bir insan\" aradığı anlatılır; toplumu eleştirmenin alaycı bir yolu."}], "sohbet": "Hayatınızdan çıkarsanız rahatlayacağınız bir \"fazlalık\" var mı?"}, {"n": 7, "kategori": "Haftanın tekrarı", "sahne": "tepeler", "baslik": "İlk haftanın küçük sınavı", "okuma": ["Bir haftada antik İskenderiye'den Louvre'a, Van Gölü'nün derelerinden Viyana'nın konser salonuna ve Sinop'un sokaklarına uzandınız.", "Bugün yeni bir konu yok; bu haftanın bilgilerini tazeleme günü. Aşağıdaki beş soru, her günden bir parça içeriyor. Cevaplamadan önce bir dakika durup o günü hatırlamaya çalışın. Bilgiyi kalıcı yapan, onu yeniden çağırmaktır."], "biliyor": "Öğrenilen bir bilgiyi aralıklarla yeniden hatırlamaya çalışmak, onu tekrar tekrar okumaktan çok daha kalıcı bir öğrenme sağlar. Psikolojide buna \"hatırlama pratiği\" denir.", "sorular": [{"s": "Eratosthenes Dünya'nın çevresini hesaplarken hangi iki kentteki gölgeleri karşılaştırdı?", "c": ["Atina ve Roma", "İskenderiye ve Siyene", "Efes ve Milet", "Kahire ve Gize"], "d": 1, "a": "İskenderiye ve güneydeki Siyene (bugünkü Asvan)."}, {"s": "Mona Lisa'yı çalan kişi kimdi?", "c": ["Pablo Picasso", "Vincenzo Peruggia", "Guillaume Apollinaire", "Alfredo Geri"], "d": 1, "a": "Louvre'da daha önce çalışmış İtalyan Vincenzo Peruggia."}, {"s": "Van Gölü'nün suyunun en belirgin özelliği nedir?", "c": ["Tatlı olması", "Sodalı ve tuzlu olması", "Sıcak olması", "Asitli olması"], "d": 1, "a": "Sodalı ve tuzludur; pH değeri 9,8 civarındadır."}, {"s": "Nasreddin Hoca'nın \"Ya tutarsa!\" dediği fıkrada ne yapıyordu?", "c": ["Göle maya çalıyordu", "Eşeğine ters biniyordu", "Kazan ödünç veriyordu", "Ağaçtan düşüyordu"], "d": 0, "a": "Göle maya çalarken \"Ya tutarsa!\" diyordu."}, {"s": "Diyojen İskender'den ne istedi?", "c": ["Altın", "Bir saray", "Güneşini kesmemesini", "Bir ordu"], "d": 2, "a": "\"Gölge etme, başka ihsan istemem\" dedi."}], "sohbet": "Bu haftanın en çok aklınızda kalan konusu hangisiydi, neden?"}, {"n": 8, "kategori": "Bilim tarihi", "sahne": "safak", "baslik": "Tatilden dönünce bulunan ilaç", "okuma": ["1928 yazında İskoç bakteriyolog Alexander Fleming, Londra'daki St Mary's Hastanesi'nde çalışırken laboratuvarındaki bazı petri kaplarını yıkamadan tatile çıktı. Döndüğünde, kaplardan birinde stafilokok bakterilerinin arasında bir küf üremiş olduğunu fark etti.", "Asıl ilginç olan, küfün çevresinde bakterilerin hiç büyümemiş olmasıydı. Küf, bakterileri öldüren bir madde salgılıyordu. Fleming bu küfün Penicillium cinsinden olduğunu belirledi ve salgıladığı maddeye \"penisilin\" adını verdi.", "Ancak penisilini saf ve bol miktarda üretmek uzun yıllar aldı. 1930'ların sonunda Oxford'da Howard Florey ve Ernst Chain'in ekibi maddeyi saflaştırıp hayvanlar ve insanlar üzerinde denedi. İkinci Dünya Savaşı sırasında seri üretime geçildi ve yaralı askerlerin hayatını kurtarmaya başladı.", "1945'te Fleming, Florey ve Chain, Nobel Fizyoloji veya Tıp Ödülü'nü birlikte aldı. Bir anlık dikkat, ardından gelen sabırlı ekip çalışmasıyla tıbbın en büyük dönüm noktalarından birine dönüştü."], "biliyor": "Fleming, Nobel konuşmasında penisilinin gereksiz ve yetersiz dozlarda kullanılmasının bakterilerde direnç oluşturabileceği konusunda uyarmıştı. Bu uyarı bugün antibiyotik direnci tartışmasının temelinde duruyor.", "sorular": [{"s": "Fleming penisilini hangi yıl fark etti?", "c": ["1898", "1928", "1945", "1953"], "d": 1, "a": "1928 yazında, tatil dönüşü laboratuvarında fark etti."}, {"s": "Penisilin hangi canlıdan elde edilir?", "c": ["Bir bakteriden", "Bir küf mantarından", "Bir bitki kökünden", "Bir deniz yosunundan"], "d": 1, "a": "Penicillium cinsinden bir küf mantarından elde edilir."}, {"s": "1945 Nobel Ödülü'nü Fleming ile kimler paylaştı?", "c": ["Pasteur ve Koch", "Watson ve Crick", "Florey ve Chain", "Curie ve Becquerel"], "d": 2, "a": "Penisilini saflaştırıp tedavide kullanılabilir hale getiren Howard Florey ve Ernst Chain."}], "sohbet": "Hayatınızda bir rastlantının ya da küçük bir dikkatsizliğin güzel bir sonuca dönüştüğü bir an oldu mu?"}, {"n": 9, "kategori": "Mimari", "sahne": "vadi", "baslik": "Sinan'ın \"ustalık eserim\" dediği cami", "okuma": ["Mimar Sinan, yaklaşık elli yıl boyunca Osmanlı'nın baş mimarı olarak görev yaptı ve camiden köprüye, hamamdan medreseye kadar yüzlerce yapıya imza attı. Kendi eserlerini anlatırken İstanbul'daki Şehzade Camii'ni \"çıraklık\", Süleymaniye'yi \"kalfalık\", Edirne'deki Selimiye'yi ise \"ustalık\" eseri olarak nitelendirdiği aktarılır.", "Selimiye Camii, Sultan II. Selim için 1568–1575 yılları arasında inşa edildi. Sinan bu yapıyı yaptığında seksenli yaşlarındaydı.", "Caminin en çarpıcı yanı devasa kubbesidir. Kubbe, sekiz büyük ayak üzerine oturur ve içeride tek, kesintisiz bir boşluk hissi yaratır. Dört ince minare, kubbeyi dört köşeden çerçeveler; her biri yaklaşık 70 metre yüksekliğindedir.", "Selimiye ve çevresindeki külliye, 2011'de UNESCO Dünya Mirası Listesi'ne alındı. Edirne'ye hangi yönden yaklaşılırsa yaklaşılsın, şehrin siluetinde ilk görünen yapı odur."], "biliyor": "Selimiye'nin her minaresinde üç şerefe vardır. Kuzeydeki iki minarede şerefelere çıkan üç merdiven birbirine hiç değmeden iç içe dolanır.", "sorular": [{"s": "Sinan'ın \"ustalık eserim\" dediği cami hangisidir?", "c": ["Şehzade Camii", "Süleymaniye Camii", "Selimiye Camii", "Sultanahmet Camii"], "d": 2, "a": "Edirne'deki Selimiye Camii'ni ustalık eseri olarak nitelendirdiği aktarılır."}, {"s": "Selimiye Camii hangi padişah için yapıldı?", "c": ["Kanuni Sultan Süleyman", "II. Selim", "III. Murat", "I. Ahmet"], "d": 1, "a": "Kanuni'nin oğlu II. Selim için yapıldı."}, {"s": "Selimiye hangi yıl UNESCO Dünya Mirası Listesi'ne girdi?", "c": ["1985", "1998", "2011", "2019"], "d": 2, "a": "Külliyesiyle birlikte 2011'de listeye alındı."}], "sohbet": "Siz bir işinize \"ustalık eserim\" diyecek olsanız hangisini seçerdiniz?"}, {"n": 10, "kategori": "Coğrafya", "sahne": "dag", "baslik": "Volkanların ve rüzgârın yonttuğu peribacaları", "okuma": ["Kapadokya'nın masalsı peribacaları milyonlarca yıl önce başlayan bir hikâyenin ürünüdür. Erciyes, Hasandağı ve Göllüdağ gibi volkanlar patladığında, geniş bir alanı kalın kül ve lav katmanları kapladı. Bu küller zamanla sıkışarak tüf denen yumuşak bir kayaca dönüştü.", "Tüfün üstünde bazen bazalt ya da andezit gibi daha sert kayaç katmanları bulunur. Yağmur, kar suyu ve rüzgâr yumuşak tüfü kolayca aşındırırken sert üst katman bir şapka gibi altını korur. Böylece şapkalı, sivri kuleler ortaya çıkar.", "İnsanlar da bu yumuşak kayadan yararlandı. Yüzyıllar boyunca kayalara evler, güvercinlikler, kiliseler ve yer altı şehirleri oydular. Derinkuyu ve Kaymaklı gibi yer altı şehirleri katlar halinde yerin derinliklerine iner.", "Göreme Milli Parkı ve Kapadokya'nın kayalık alanları 1985'te UNESCO Dünya Mirası Listesi'ne alındı. Bugün sıcak hava balonlarıyla gün doğumunda bu manzarayı izlemek bölgenin en ünlü deneyimlerinden biri."], "biliyor": "Kapadokya'daki güvercinliklerin asıl amacı güvercin gübresi toplamaktı. Bu gübre, bağların ve bahçelerin verimini artırmak için kullanılıyordu.", "sorular": [{"s": "Peribacalarını oluşturan yumuşak kayacın adı nedir?", "c": ["Mermer", "Granit", "Tüf", "Kireçtaşı"], "d": 2, "a": "Volkanik küllerin sıkışmasıyla oluşan tüf, kolay aşınan yumuşak bir kayaçtır."}, {"s": "Peribacalarının tepesindeki \"şapka\" ne işe yarar?", "c": ["Suyu depolar", "Altındaki yumuşak kayayı aşınmaya karşı korur", "Rüzgârı hızlandırır", "Hiçbir işe yaramaz, süstür"], "d": 1, "a": "Sert üst katman, altındaki tüfün yağmur ve rüzgârla aşınmasını yavaşlatır."}, {"s": "Aşağıdakilerden hangisi Kapadokya'daki bir yer altı şehridir?", "c": ["Derinkuyu", "Efes", "Afrodisias", "Hattuşa"], "d": 0, "a": "Derinkuyu ve Kaymaklı, bölgenin en bilinen yer altı şehirleridir."}], "sohbet": "Kapadokya'da bir gece geçirecek olsanız peribacası evi mi, balon turu mu, yer altı şehri mi?"}, {"n": 11, "kategori": "Edebiyat", "sahne": "tepeler", "baslik": "Halkın diliyle yazan derviş: Yunus Emre", "okuma": ["Yunus Emre'nin 13. yüzyılın ikinci yarısı ile 14. yüzyılın başlarında Anadolu'da yaşadığı kabul edilir. Hayatı hakkındaki bilgilerin çoğu menkıbelere dayanır; Taptuk Emre'nin dergâhında yıllarca hizmet ettiği anlatılır.", "Onu döneminin pek çok şairinden ayıran şey dilidir. O yıllarda edebiyatta Farsça ve Arapça ağırlıklıyken Yunus, şiirlerini halkın konuştuğu sade Türkçeyle yazdı. Bu yüzden şiirleri yüzyıllar boyunca dilden dile, ilahiler aracılığıyla kuşaktan kuşağa aktarıldı.", "Şiirlerinin merkezinde sevgi, hoşgörü ve insanın kendini bilmesi vardır. \"Gelin tanış olalım, işi kolay kılalım\" dizesi bu çağrının en bilinen örneklerindendir.", "Anadolu'nun pek çok yerinde Yunus Emre'ye ait olduğu söylenen mezar ya da makam bulunur; bu bile onun ne kadar sahiplenildiğini gösterir. UNESCO 1991 yılını, doğumunun 750. yılı dolayısıyla Yunus Emre Sevgi Yılı ilan etti."], "biliyor": "Yurt dışında Türk dilini ve kültürünü tanıtan kurumun adı Yunus Emre Enstitüsü'dür.", "sorular": [{"s": "Yunus Emre şiirlerini hangi dille yazdı?", "c": ["Ağırlıklı Farsçayla", "Ağırlıklı Arapçayla", "Halkın konuştuğu sade Türkçeyle", "Latinceyle"], "d": 2, "a": "Döneminin aksine halkın anladığı sade Türkçeyi kullandı."}, {"s": "Yunus Emre'nin hizmet ettiği anlatılan dergâhın şeyhi kimdir?", "c": ["Hacı Bektaş-ı Veli", "Taptuk Emre", "Mevlânâ", "Ahi Evran"], "d": 1, "a": "Menkıbelere göre Taptuk Emre'nin dergâhında yıllarca hizmet etti."}, {"s": "UNESCO hangi yılı Yunus Emre Sevgi Yılı ilan etti?", "c": ["1971", "1991", "2001", "2021"], "d": 1, "a": "1991'i, doğumunun 750. yılı dolayısıyla Yunus Emre Sevgi Yılı ilan etti."}], "sohbet": "Sade söylenmiş bir sözün size uzun bir konuşmadan daha çok dokunduğu oldu mu?"}, {"n": 12, "kategori": "Müzik", "sahne": "deniz", "baslik": "Bitmeyen Requiem'in gizemi", "okuma": ["1791 yazında Wolfgang Amadeus Mozart'a, kimliğini gizleyen bir aracı aracılığıyla bir ölüm ayini, yani Requiem siparişi geldi. Sipariş veren kişinin, yıllar sonra ortaya çıktığı üzere, eşinin anısına bu eseri kendi bestesiymiş gibi sunmak isteyen Kont Franz von Walsegg olduğu anlaşıldı.", "Mozart o sonbahar hem Sihirli Flüt operası hem de başka eserler üzerinde çalışırken Requiem'e de başladı. Ancak hastalandı ve 5 Aralık 1791'de, henüz 35 yaşındayken Viyana'da öldü. Requiem yarım kalmıştı.", "Eşi Constanze, ücretin tamamını alabilmek için eserin tamamlanmasını istedi. Bu iş sonunda Mozart'ın öğrencisi Franz Xaver Süssmayr'a kaldı. Süssmayr, Mozart'ın taslaklarını ve notlarını kullanarak eksik bölümleri tamamladı.", "Bugün hangi bölümlerin ne kadarının Mozart'a, ne kadarının Süssmayr'a ait olduğu hâlâ tartışılır. Yine de eser, Mozart'ın en çok seslendirilen yapıtlarından biri olmaya devam ediyor."], "biliyor": "Mozart'ın Requiem'de tamamen kendi eliyle bitirdiği tek bölümün açılış bölümü olan \"Introitus\" olduğu kabul edilir; diğer bölümlerin çoğu taslak halindeydi.", "sorular": [{"s": "Requiem ne tür bir eserdir?", "c": ["Düğün marşı", "Ölüm ayini müziği", "Opera", "Dans süiti"], "d": 1, "a": "Requiem, ölenlerin anısına yapılan ayin için yazılan müziktir."}, {"s": "Mozart'ın yarım kalan Requiem'ini kim tamamladı?", "c": ["Salieri", "Beethoven", "Süssmayr", "Haydn"], "d": 2, "a": "Öğrencisi Franz Xaver Süssmayr, taslaklardan yola çıkarak tamamladı."}, {"s": "Mozart öldüğünde kaç yaşındaydı?", "c": ["35", "42", "50", "61"], "d": 0, "a": "5 Aralık 1791'de, 35 yaşındayken öldü."}], "sohbet": "Yarım bırakıp bir gün mutlaka bitirmek istediğiniz bir işiniz var mı?"}, {"n": 13, "kategori": "Felsefe", "sahne": "safak", "baslik": "Soru sormaktan vazgeçmeyen adam", "okuma": ["Sokrates, MÖ 5. yüzyılda Atina'da yaşadı. Hiç kitap yazmadı; onu bugün daha çok öğrencisi Platon'un yazdığı diyaloglardan tanıyoruz.", "Sokrates'in yöntemi basitti ama rahatsız ediciydi: Pazar yerinde insanlarla konuşur, \"Adalet nedir?\", \"Cesaret nedir?\" gibi sorular sorar, verilen cevapları yeni sorularla sınardı. Karşısındaki kişi çoğu zaman bildiğini sandığı şeyi aslında bilmediğini fark ederdi. Bu yönteme bugün \"Sokratik yöntem\" denir.", "Kendisi de bilgeliğini, bilmediğinin farkında olmasına bağlardı. Ona atfedilen \"Bildiğim tek şey, hiçbir şey bilmediğimdir\" sözü bu tavrın özeti olarak anılır.", "Ancak sürekli sorgulaması Atina'da pek çok kişiyi kızdırdı. MÖ 399'da gençleri yoldan çıkarmak ve şehrin tanrılarına saygısızlıkla suçlanarak yargılandı, ölüme mahkûm edildi. Kaçma imkânı olduğu halde kaçmadı ve baldıran zehri içerek öldü."], "biliyor": "Platon'un \"Sokrates'in Savunması\" adlı eseri, Sokrates'in mahkemede yaptığı konuşmayı anlatır. Sorgulanmamış bir hayatın yaşanmaya değmeyeceği fikri bu eserde geçer.", "sorular": [{"s": "Sokrates'in düşüncelerini en çok kimin eserlerinden biliyoruz?", "c": ["Aristoteles", "Platon", "Herodot", "Homeros"], "d": 1, "a": "Sokrates hiç yazmadı; düşünceleri öğrencisi Platon'un diyaloglarıyla bize ulaştı."}, {"s": "Sokrates hangi yöntemle tanınır?", "c": ["Deney yapma", "Soru sorarak sorgulama", "Sessiz meditasyon", "Matematiksel ispat"], "d": 1, "a": "Sorularla karşısındakinin düşüncesini sınadığı yönteme Sokratik yöntem denir."}, {"s": "Sokrates nasıl öldü?", "c": ["Savaşta", "Sürgünde", "Baldıran zehri içerek", "Yaşlılıktan"], "d": 2, "a": "MÖ 399'da ölüm cezasına çarptırıldı ve baldıran zehri içti."}], "sohbet": "Son zamanlarda \"bunu bildiğimi sanıyormuşum\" dediğiniz bir şey oldu mu?"}, {"n": 14, "kategori": "Haftanın tekrarı", "sahne": "tepeler", "baslik": "İkinci haftanın küçük sınavı", "okuma": ["Bu hafta Londra'daki bir laboratuvardan Edirne'nin kubbesine, Kapadokya'nın vadilerinden Viyana'nın yarım kalmış bir ayinine ve Atina'nın pazar yerine uzandınız.", "Bugün yeni konu yok. Aşağıdaki beş soru bu haftanın her gününden bir parça içeriyor. Cevaplamadan önce o günü bir an gözünüzün önüne getirin."], "biliyor": "Öğrendiklerinizi başka birine anlatmak, onları en iyi pekiştirme yollarından biridir. Bu akşam bu haftanın bir konusunu birbirinize anlatmayı deneyebilirsiniz.", "sorular": [{"s": "Penisilini saflaştırıp tedavide kullanılır hale getiren ekip nerede çalışıyordu?", "c": ["Cambridge", "Oxford", "Paris", "Berlin"], "d": 1, "a": "Howard Florey ve Ernst Chain'in ekibi Oxford'da çalışıyordu."}, {"s": "Selimiye Camii hangi şehirdedir?", "c": ["Bursa", "Konya", "Edirne", "Manisa"], "d": 2, "a": "Edirne'dedir ve şehrin siluetine hâkimdir."}, {"s": "Kapadokya'daki tüf kayacı neyin sıkışmasıyla oluştu?", "c": ["Deniz kabuklarının", "Volkanik küllerin", "Buzulların", "Kumul tepelerinin"], "d": 1, "a": "Erciyes, Hasandağı ve Göllüdağ gibi volkanlardan çıkan küllerin sıkışmasıyla."}, {"s": "Yunus Emre'yi döneminin pek çok şairinden ayıran özellik nedir?", "c": ["Sade Türkçe kullanması", "Sadece nesir yazması", "Saray şairi olması", "Latin harfleriyle yazması"], "d": 0, "a": "Halkın konuştuğu sade Türkçeyle yazdı."}, {"s": "Sokrates hangi suçlamayla yargılandı?", "c": ["Hırsızlık", "Gençleri yoldan çıkarmak ve tanrılara saygısızlık", "Vergi kaçırmak", "Vatana ihanet"], "d": 1, "a": "Gençleri yoldan çıkarmak ve şehrin tanrılarına saygısızlıkla suçlandı."}], "sohbet": "Bu hafta öğrendiklerinizden birini başka birine anlatacak olsanız hangisini seçerdiniz?"}, {"n": 15, "kategori": "Bilim tarihi", "sahne": "vadi", "baslik": "İki farklı bilimde Nobel alan ilk kişi", "okuma": ["Marie Curie, 1867'de Varşova'da doğdu. O yıllarda Rus yönetimi altındaki Polonya'da kadınların üniversiteye gitmesi mümkün değildi; bu yüzden Paris'e giderek Sorbonne'da fizik ve matematik okudu.", "Eşi Pierre Curie ile birlikte uranyum cevherinden yayılan gizemli ışınımı araştırdı ve bu olaya \"radyoaktivite\" adını verdi. Çalışmaları sırasında iki yeni element keşfettiler. Birine, işgal altındaki vatanının adını yaşatmak için \"polonyum\", diğerine \"radyum\" adını verdiler.", "1903'te Pierre Curie ve Henri Becquerel ile birlikte Nobel Fizik Ödülü'nü aldı; bu ödülü alan ilk kadın oldu. Pierre'in 1906'da bir kazada ölmesinden sonra çalışmalarını sürdürdü ve 1911'de bu kez tek başına Nobel Kimya Ödülü'nü kazandı.", "Böylece iki farklı bilim dalında Nobel alan ilk kişi oldu. Birinci Dünya Savaşı sırasında cephelere giden seyyar röntgen araçlarının kurulmasına da öncülük etti."], "biliyor": "Marie Curie'nin defterleri ve notları hâlâ radyoaktiftir. Bu belgeleri incelemek isteyenler koruyucu önlem almak zorundadır.", "sorular": [{"s": "Marie Curie hangi ülkede doğdu?", "c": ["Fransa", "Polonya", "Avusturya", "Rusya"], "d": 1, "a": "1867'de, o dönem Rus yönetimindeki Polonya'nın başkenti Varşova'da doğdu."}, {"s": "Curie'lerin keşfettiği ve Polonya'nın adını taşıyan element hangisidir?", "c": ["Plütonyum", "Polonyum", "Radon", "Platin"], "d": 1, "a": "Vatanının adını yaşatmak için bu elemente polonyum adını verdiler."}, {"s": "Marie Curie 1911'de hangi alanda Nobel aldı?", "c": ["Fizik", "Tıp", "Kimya", "Barış"], "d": 2, "a": "1903'te fizik, 1911'de kimya alanında Nobel aldı."}], "sohbet": "Engellere rağmen yolunu kendisi açmış, tanıdığınız birini düşünün. Onu ne farklı kılıyordu?"}, {"n": 16, "kategori": "Sanat", "sahne": "safak", "baslik": "Bir pencereden görünen Yıldızlı Gece", "okuma": ["Vincent van Gogh, 1889 baharında Güney Fransa'daki Saint-Rémy-de-Provence kasabasında bulunan bir akıl sağlığı kurumuna kendi isteğiyle yattı. Orada kaldığı yaklaşık bir yıl, sanatının en verimli dönemlerinden biri oldu.", "Haziran 1889'da yaptığı \"Yıldızlı Gece\", odasının doğuya bakan penceresinden gördüğü manzaradan esinlenir. Ancak tablo birebir bir görüntü değildir. Van Gogh resmi gündüz, belleğine ve hayal gücüne dayanarak yaptı; tablodaki köy de odasından görünmüyordu.", "Gökyüzündeki girdaplar, parlayan yıldızlar ve hilal, sakin köyün üzerinde hareket eden bir enerji gibidir. Ön plandaki koyu servi ağacı yerle göğü birbirine bağlar.", "Van Gogh bu tabloyu kendisi pek başarılı bulmadı. Bugün ise New York'taki Modern Sanat Müzesi'nde (MoMA) sergilenen eser, dünyanın en tanınan resimlerinden biri."], "biliyor": "Van Gogh'un hayatını en iyi anlatan kaynak, kardeşi Theo'ya yazdığı yüzlerce mektuptur. Resimlerini, renklerini ve duygularını bu mektuplarda ayrıntılı biçimde anlatır.", "sorular": [{"s": "Yıldızlı Gece hangi yıl yapıldı?", "c": ["1869", "1889", "1909", "1929"], "d": 1, "a": "Haziran 1889'da, Saint-Rémy'de yapıldı."}, {"s": "Tablo bugün hangi şehirdeki bir müzede sergileniyor?", "c": ["Paris", "Amsterdam", "Londra", "New York"], "d": 3, "a": "New York'taki Modern Sanat Müzesi'nde (MoMA)."}, {"s": "Van Gogh'un hayatını en iyi anlatan kaynak nedir?", "c": ["Kendi yazdığı otobiyografi", "Kardeşi Theo'ya yazdığı mektuplar", "Doktorlarının raporları", "Gazete röportajları"], "d": 1, "a": "Kardeşi Theo'ya yazdığı yüzlerce mektup."}], "sohbet": "Bir pencereden her gün gördüğünüz ve resmini yapmak istediğiniz bir manzara var mı?"}, {"n": 17, "kategori": "Coğrafya", "sahne": "tepeler", "baslik": "Pamukkale: Sıcak suyun ördüğü beyaz basamaklar", "okuma": ["Denizli'deki Pamukkale, uzaktan bakınca karla kaplı bir yamaç gibi görünür. Oysa bu beyazlık kardan değil, travertenden gelir.", "Yer altından çıkan sıcak sular, içinde çözünmüş bol miktarda kalsiyum bikarbonat taşır. Su yüzeye çıkıp yamaçtan aşağı akarken içindeki karbondioksit havaya karışır ve kalsiyum karbonat çökelir. Bu çökelti binlerce yıl içinde kat kat birikerek beyaz havuzları ve basamakları oluşturdu.", "Travertenlerin hemen üstünde antik Hierapolis kenti yer alır. Romalılar bu sıcak suların şifalı olduğuna inanıyor, kente sağlık için geliyordu. Kentin büyük nekropolü, yani mezarlığı, Anadolu'nun en geniş antik mezarlıklarından biridir.", "Hierapolis-Pamukkale 1988'de UNESCO Dünya Mirası Listesi'ne alındı. Travertenlerin zarar görmemesi için bugün ziyaretçilerin havuzlarda yalnızca çıplak ayakla, belirlenen yollarda yürümesine izin veriliyor."], "biliyor": "Hierapolis'teki Antik Havuz'da, depremlerle suya düşmüş Roma dönemi sütunlarının arasında yüzmek mümkün.", "sorular": [{"s": "Pamukkale'nin beyaz basamaklarını oluşturan kayaç hangisidir?", "c": ["Mermer", "Traverten", "Bazalt", "Granit"], "d": 1, "a": "Sıcak sulardan çöken kalsiyum karbonatın oluşturduğu traverten."}, {"s": "Travertenlerin üstündeki antik kentin adı nedir?", "c": ["Efes", "Hierapolis", "Laodikya", "Bergama"], "d": 1, "a": "Romalıların şifa için geldiği Hierapolis."}, {"s": "Ziyaretçiler travertenlerde nasıl yürüyebilir?", "c": ["Ayakkabıyla", "Yalnızca çıplak ayakla, belirlenen yollarda", "Bisikletle", "Hiç giremez"], "d": 1, "a": "Travertenlerin zarar görmemesi için yalnızca çıplak ayakla, belirlenen yollarda."}], "sohbet": "Doğada sizi en çok şaşırtan, \"bu gerçek olamaz\" dediğiniz bir yer oldu mu?"}, {"n": 18, "kategori": "Edebiyat", "sahne": "dag", "baslik": "Yel değirmenleriyle savaşan şövalye", "okuma": ["Miguel de Cervantes'in hayatı, yazdığı romanlar kadar maceralıydı. 1571'deki İnebahtı Deniz Savaşı'nda göğsünden ve sol elinden yaralandı; sol elini ömrü boyunca tam kullanamadı.", "Birkaç yıl sonra İspanya'ya dönerken bindiği gemi korsanlarca ele geçirildi ve Cervantes Cezayir'de yaklaşık beş yıl esir kaldı. Bu sürede birkaç kez kaçmayı denedi. Sonunda fidyesi ödenerek serbest bırakıldı.", "1605'te \"Don Kişot\" romanının ilk cildini yayımladı. Şövalye romanlarını okuya okuya kendini gezgin bir şövalye sanan La Mançalı bir soylu, yaşlı atı Rosinante ve sadık yardımcısı Sanço Pança ile yollara düşer. En ünlü sahnede, yel değirmenlerini devler sanarak onlara saldırır.", "İkinci cilt 1615'te çıktı. Don Kişot bugün pek çok kişi tarafından modern romanın ilk örneklerinden biri sayılıyor."], "biliyor": "Türkçede gerçek olmayan düşmanlarla uğraşmak için kullanılan \"yel değirmenleriyle savaşmak\" deyimi doğrudan bu romandan gelir.", "sorular": [{"s": "Cervantes hangi deniz savaşında yaralandı?", "c": ["Preveze", "İnebahtı", "Trafalgar", "Çeşme"], "d": 1, "a": "1571'deki İnebahtı Deniz Savaşı'nda yaralandı."}, {"s": "Don Kişot'un sadık yardımcısının adı nedir?", "c": ["Rosinante", "Dulcinea", "Sanço Pança", "Lazarillo"], "d": 2, "a": "Sanço Pança. Rosinante ise Don Kişot'un atıdır."}, {"s": "Don Kişot'un ilk cildi hangi yıl yayımlandı?", "c": ["1505", "1605", "1705", "1805"], "d": 1, "a": "İlk cilt 1605'te, ikinci cilt 1615'te yayımlandı."}], "sohbet": "Sizin \"yel değirmeniniz\" ne? Boşuna uğraştığınızı bilip de vazgeçemediğiniz bir şey var mı?"}, {"n": 19, "kategori": "Müzik", "sahne": "deniz", "baslik": "Dört Mevsim: Kızıl Rahip'in şiirli konçertoları", "okuma": ["Antonio Vivaldi, 1678'de Venedik'te doğdu. Rahip olarak yetiştirildi; kızıl saçları yüzünden kentte \"il Prete Rosso\", yani \"Kızıl Rahip\" diye anıldı.", "Uzun yıllar Venedik'teki Ospedale della Pietà adlı yetimhanede keman öğretmeni ve besteci olarak çalıştı. Buradaki kız öğrencilerden oluşan orkestra, Avrupa'nın dört bir yanından gelen ziyaretçileri hayran bırakıyordu.", "Dört Mevsim, 1725'te Amsterdam'da yayımlanan bir konçerto derlemesinin ilk dört eseridir. Her konçerto bir mevsimi anlatır ve her birinin başına, müziğin anlattığı sahneleri tarif eden bir sone eklenmiştir: İlkbaharda kuş sesleri, yazın kavurucu sıcakta gelen fırtına, sonbaharda bağ bozumu şenliği, kışın buz üstünde dikkatli adımlar.", "Müzikle somut sahneler anlatan bu yaklaşım, kendi döneminde son derece yenilikçiydi. Bugün Dört Mevsim, klasik müziğin dünyada en çok çalınan eserlerinden biri."], "biliyor": "Vivaldi'nin eserlerinin pek çoğu ölümünden sonra unutuldu ve ancak 20. yüzyılda yeniden keşfedilerek büyük ün kazandı.", "sorular": [{"s": "Vivaldi'ye neden \"Kızıl Rahip\" deniyordu?", "c": ["Kırmızı cübbe giydiği için", "Kızıl saçları olduğu için", "Kızıl Deniz'e gittiği için", "Kızgın bir mizacı olduğu için"], "d": 1, "a": "Rahip olduğu ve kızıl saçları olduğu için \"il Prete Rosso\" diye anıldı."}, {"s": "Dört Mevsim'deki konçertoların başına ne eklenmiştir?", "c": ["Bir dua", "Sahneleri tarif eden soneler", "Dans figürleri", "Bir harita"], "d": 1, "a": "Her konçertonun başında, müziğin anlattığı sahneleri tarif eden bir sone vardır."}, {"s": "Vivaldi hangi şehirde doğdu?", "c": ["Roma", "Floransa", "Venedik", "Napoli"], "d": 2, "a": "1678'de Venedik'te doğdu."}], "sohbet": "Hangi mevsimin müziği olsaydınız ve o müzikte hangi ses mutlaka olurdu?"}, {"n": 20, "kategori": "Felsefe", "sahne": "vadi", "baslik": "Aristoteles'ten sonra \"ikinci öğretmen\"", "okuma": ["Fârâbî, 9. yüzyılın ikinci yarısında Orta Asya'da, Fârâb bölgesinde doğdu ve 950 civarında Şam'da öldü. Hayatının önemli bir kısmını Bağdat'ta geçirdi ve orada Yunan felsefesini derinlemesine inceledi.", "Aristoteles'in eserlerini öyle iyi açıkladı ve yorumladı ki İslam dünyasında Aristoteles'ten sonra \"ikinci öğretmen\" anlamına gelen \"Muallim-i Sânî\" diye anıldı.", "En tanınmış eserlerinden biri, \"Erdemli Şehir\" olarak çevrilebilecek \"el-Medînetü'l-Fâzıla\"dır. Bu eserde Fârâbî, insanların birlikte mutluluğa ulaşmayı amaçladığı ideal bir toplumu ve böyle bir toplumu yönetecek bilge yöneticiyi anlatır. Bu fikirler Platon'un ideal devlet düşüncesiyle de akrabadır.", "Fârâbî yalnızca bir filozof değil, aynı zamanda bir müzik kuramcısıydı. \"Kitâbü'l-Mûsîkî'l-Kebîr\" adlı büyük eseri, sesleri ve makamları bilimsel olarak inceleyen önemli bir kaynaktır."], "biliyor": "Fârâbî'nin, müziğin insan ruhu üzerindeki etkisini incelediği ve müziğin tedavide kullanılabileceğini düşündüğü aktarılır.", "sorular": [{"s": "Fârâbî'ye verilen \"Muallim-i Sânî\" unvanı ne anlama gelir?", "c": ["Büyük hekim", "İkinci öğretmen", "Bilge yönetici", "Yolcu derviş"], "d": 1, "a": "Aristoteles'ten sonra gelen \"ikinci öğretmen\" anlamına gelir."}, {"s": "Fârâbî'nin \"el-Medînetü'l-Fâzıla\" eseri neyi anlatır?", "c": ["Bir yolculuğu", "İdeal, erdemli bir toplumu", "Bir savaşı", "Bir aşk hikâyesini"], "d": 1, "a": "İnsanların birlikte mutluluğa ulaştığı erdemli bir toplumu anlatır."}, {"s": "Fârâbî felsefenin yanı sıra hangi alanda da önemli eserler verdi?", "c": ["Müzik", "Denizcilik", "Mimari", "Tarım"], "d": 0, "a": "Sesleri ve makamları inceleyen büyük bir müzik kitabı yazdı."}], "sohbet": "Sizin için \"erdemli bir şehir\"in olmazsa olmaz üç özelliği ne olurdu?"}, {"n": 21, "kategori": "Haftanın tekrarı", "sahne": "tepeler", "baslik": "Üçüncü haftanın küçük sınavı", "okuma": ["Bu hafta Paris'teki bir laboratuvardan Saint-Rémy'deki bir pencereye, Pamukkale'nin beyaz havuzlarından La Mança'nın yel değirmenlerine, Venedik'in kanallarından Bağdat'ın kütüphanelerine gittiniz.", "Üç hafta geride kaldı. Aşağıdaki beş soruyla bu haftayı tazeleyin."], "biliyor": "Üç hafta boyunca her gün kısa da olsa yeni bir şey öğrenmek, bir alışkanlığın yerleşmesi için iyi bir başlangıç sayılır.", "sorular": [{"s": "Marie Curie'nin eşi Pierre ile birlikte adını verdiği olay hangisidir?", "c": ["Elektrik", "Radyoaktivite", "Fotosentez", "Manyetizma"], "d": 1, "a": "Uranyumdan yayılan ışınımı inceleyip bu olaya radyoaktivite adını verdiler."}, {"s": "Van Gogh Yıldızlı Gece'yi yaparken hangi kasabadaydı?", "c": ["Arles", "Saint-Rémy-de-Provence", "Auvers-sur-Oise", "Nuenen"], "d": 1, "a": "Saint-Rémy-de-Provence'taki bir akıl sağlığı kurumunda kalıyordu."}, {"s": "Pamukkale hangi ildedir?", "c": ["Aydın", "Muğla", "Denizli", "Isparta"], "d": 2, "a": "Denizli'dedir."}, {"s": "Cervantes Cezayir'de yaklaşık kaç yıl esir kaldı?", "c": ["Bir yıl", "Beş yıl", "On yıl", "Yirmi yıl"], "d": 1, "a": "Fidyesi ödenene kadar yaklaşık beş yıl esir kaldı."}, {"s": "Vivaldi'nin uzun yıllar çalıştığı Ospedale della Pietà neydi?", "c": ["Bir saray", "Bir yetimhane", "Bir opera binası", "Bir manastır okulu"], "d": 1, "a": "Venedik'te bir yetimhaneydi; kız öğrencilerden oluşan orkestrası çok ünlüydü."}], "sohbet": "Üç haftadır öğrendikleriniz arasında en çok kimin hikâyesi aklınızda kaldı?"}, {"n": 22, "kategori": "Bilim tarihi", "sahne": "safak", "baslik": "Diyarbakır'da sudan saatler yapan mühendis", "okuma": ["12. yüzyılın sonlarında, o zamanki adıyla Âmid olan Diyarbakır'da yaşayan Bedîüzzaman el-Cezerî, Artuklu hanedanının hizmetinde yaklaşık yirmi beş yıl mühendislik yaptı.", "Artuklu emiri Nâsırüddin Mahmud'un isteğiyle, yaptığı düzenekleri anlatan büyük bir kitap yazdı. Kısaca \"Kitâb fî Ma'rifeti'l-Hiyeli'l-Hendesiyye\" diye anılan bu eser, 13. yüzyılın hemen başında tamamlandı ve altı bölümde elli düzeneği anlatır.", "Kitapta su ve mum saatleri, kendiliğinden su döken kaplar, fıskiyeler, kendi kendine çalan müzik aletleri ve su yükselten makineler yer alır. Cezerî her düzeneğin nasıl yapılacağını çizimlerle adım adım gösterdi.", "En ünlüsü fil saatidir: Filin sırtındaki köşkte belirli aralıklarla bir kuş öter, küçük bir figür bir topu ejderhanın ağzına bırakır ve böylece zamanın geçtiği haber verilir."], "biliyor": "Cezerî'nin kitabının 1315 tarihli bir kopyasından bir sayfa bugün New York'taki Metropolitan Sanat Müzesi'nde korunuyor.", "sorular": [{"s": "Cezerî hangi kentte Artuklu hizmetinde çalıştı?", "c": ["Mardin", "Diyarbakır (Âmid)", "Urfa", "Bitlis"], "d": 1, "a": "O dönemde Âmid denilen Diyarbakır'da, Artuklu sarayında çalıştı."}, {"s": "Cezerî'nin kitabında kaç düzenek anlatılır?", "c": ["12", "25", "50", "100"], "d": 2, "a": "Altı bölümde toplam elli düzenek anlatılır."}, {"s": "Cezerî'nin en ünlü saati hangi hayvan biçimindedir?", "c": ["Aslan", "At", "Fil", "Deve"], "d": 2, "a": "Fil saati, kitabın en tanınan düzeneğidir."}], "sohbet": "Kendi elinizle tamir ettiğiniz ya da yaptığınız bir şey için gurur duyduğunuz bir an hatırlıyor musunuz?"}, {"n": 23, "kategori": "Sanat", "sahne": "deniz", "baslik": "Dalganın içindeki küçük dağ", "okuma": ["Japon sanatçı Katsushika Hokusai, \"Kanagawa Açıklarında Büyük Dalga\" adlı eserini 1830–1832 yılları arasında, yetmiş yaşlarındayken yaptı. Eser, \"Fuji Dağı'nın Otuz Altı Görünümü\" adlı dizinin bir parçasıdır.", "Bu bir tablo değil, ahşap kalıp baskıdır. Desen tahta kalıplara oyulur, her renk ayrı bir kalıpla kâğıda basılır. Böylece aynı resimden çok sayıda kopya çıkarılabilir; bugün dünyanın birçok müzesinde bu eserin bir baskısı bulunmasının nedeni budur.", "Resimde dev bir dalga, içinde kürek çeken balıkçıların bulunduğu tekneleri yutmak üzeredir. Japonya'nın en yüksek dağı Fuji ise uzakta, dalganın kavisinin içinde küçük bir üçgen gibi durur.", "Hokusai, Avrupa'dan gelen \"Prusya mavisi\" boyasını ustalıkla kullandı. Bu derin mavi, eserin en tanınan özelliklerinden biri oldu."], "biliyor": "Bu baskının, Claude Debussy'nin \"Deniz\" (La Mer) adlı orkestra eserine ilham vermiş olabileceği düşünülür.", "sorular": [{"s": "Büyük Dalga hangi teknikle yapılmıştır?", "c": ["Yağlıboya", "Fresk", "Ahşap kalıp baskı", "Mozaik"], "d": 2, "a": "Tahta kalıplarla basılan bir baskıdır; bu yüzden çok sayıda kopyası vardır."}, {"s": "Eserin ait olduğu dizi hangi dağın görünümlerini anlatır?", "c": ["Ağrı", "Fuji", "Everest", "Etna"], "d": 1, "a": "\"Fuji Dağı'nın Otuz Altı Görünümü\" dizisinin parçasıdır."}, {"s": "Hokusai'nin bu eserde kullandığı ünlü ithal boya hangisidir?", "c": ["Prusya mavisi", "Osmanlı kırmızısı", "Hint sarısı", "Mısır yeşili"], "d": 0, "a": "Avrupa'dan gelen Prusya mavisi eserin derin mavisini verir."}], "sohbet": "Denizle ilgili aklınızda kalan en güzel ya da en heyecanlı anı hangisi?"}, {"n": 24, "kategori": "Coğrafya", "sahne": "dag", "baslik": "Baykal: Dünyanın en derin ve en yaşlı gölü", "okuma": ["Rusya'nın Sibirya bölgesindeki Baykal Gölü, en derin yerinde 1.642 metreye ulaşır; bu derinlikle dünyanın en derin gölüdür. Yaklaşık 636 kilometre uzunluğundaki göl, haritada ince uzun bir hilale benzer.", "Baykal'ın 25–30 milyon yaşında olduğu düşünülür; bu da onu dünyanın bilinen en yaşlı gölü yapar. Çoğu göl zamanla tortuyla dolup kaybolurken Baykal, yer kabuğundaki bir yarığın yavaş yavaş açılmasıyla varlığını sürdürmüştür.", "Göl, yeryüzündeki donmamış tatlı suyun yaklaşık beşte birini tutar. İçine yüzlerce akarsu dökülür, ama gölden yalnızca bir nehir çıkar: Angara.", "Kışın yüzeyi genellikle ocak başından mayısa kadar donar ve buzun kalınlığı yer yer bir metreyi aşar. Baykal, eşsiz doğasıyla 1996'da UNESCO Dünya Mirası Listesi'ne alındı."], "biliyor": "Baykal'da yalnızca bu göle özgü bir fok türü yaşar: Yerel adıyla \"nerpa\", yani Baykal foku, tatlı suda yaşayan nadir foklardan biridir.", "sorular": [{"s": "Baykal Gölü'nün en derin yeri yaklaşık kaç metredir?", "c": ["450", "860", "1.642", "3.000"], "d": 2, "a": "En derin yeri 1.642 metredir."}, {"s": "Baykal'dan çıkan tek nehir hangisidir?", "c": ["Yenisey", "Angara", "Lena", "Volga"], "d": 1, "a": "Yüzlerce akarsu göle dökülür, yalnızca Angara gölden çıkar."}, {"s": "Baykal, yeryüzündeki donmamış tatlı suyun yaklaşık ne kadarını tutar?", "c": ["Yüzde biri", "Onda biri", "Beşte biri", "Yarısı"], "d": 2, "a": "Yaklaşık beşte birini tutar."}], "sohbet": "Hiç görmediğiniz ama bir gün birlikte görmek istediğiniz bir doğa harikası hangisi?"}, {"n": 25, "kategori": "Edebiyat", "sahne": "tepeler", "baslik": "Dede Korkut: Oğuzların bilge ozanı", "okuma": ["Dede Korkut Kitabı, Oğuz Türklerinin yüzyıllar boyunca dilden dile anlatılan destansı hikâyelerini bir araya getirir. Hikâyelerin 15. yüzyılın ikinci yarısında yazıya geçirildiği tahmin edilir.", "Kitabın bilinen iki eski nüshası Avrupa kütüphanelerindedir. Almanya'daki Dresden nüshası on iki hikâyenin tamamını içerir; Vatikan'daki nüshada ise altı hikâye bulunur.", "Hikâyelerde Salur Kazan ve Bamsı Beyrek gibi kahramanlar at koşturur, düğün kurar, yurtlarını korur. Dede Korkut ise hikâyelerin sonunda gelip kopuzunu çalan, olanları destana dönüştüren bilge bir ozan ve akıl danışılan bir büyüktür. Hikâyeler kahramanlığın yanında misafirperverliği, aileye bağlılığı ve verilen söze sadakati de anlatır.", "2018'de Dede Korkut mirası, Türkiye, Azerbaycan ve Kazakistan'ın ortak başvurusuyla UNESCO'nun İnsanlığın Somut Olmayan Kültürel Mirası listesine alındı."], "biliyor": "Dresden nüshası 1815'te Alman doğubilimci von Diez tarafından bilim dünyasına tanıtıldı.", "sorular": [{"s": "Dresden nüshasında kaç hikâye vardır?", "c": ["6", "9", "12", "24"], "d": 2, "a": "On iki hikâyenin tamamı Dresden nüshasındadır."}, {"s": "Kitapta Dede Korkut en çok hangi rolde görünür?", "c": ["Hükümdar", "Bilge ozan", "Savaşçı", "Tüccar"], "d": 1, "a": "Hikâyeleri destanlaştıran bilge bir ozandır."}, {"s": "Dede Korkut hikâyelerin sonunda hangi sazı çalar?", "c": ["Ney", "Kopuz", "Kanun", "Ud"], "d": 1, "a": "Kopuz, eski Türklerin telli sazıdır."}], "sohbet": "Çocukken büyüklerinizden dinlediğiniz ve hâlâ aklınızda olan bir hikâye var mı?"}, {"n": 26, "kategori": "Müzik", "sahne": "vadi", "baslik": "Bayram sabahlarının bestecisi: Itrî", "okuma": ["Buhûrîzâde Mustafa Itrî, 17. yüzyılda İstanbul'da yaşadı. Doğum yılı kesin bilinmez; 1630 ile 1640 arasında doğduğu kabul edilir. 1711 ya da 1712'de öldüğü aktarılır.", "IV. Mehmed döneminde sarayda hânende ve musiki hocası olarak bulundu, Enderun'da ders verdi. Çiçeklere ve bahçe işlerine olan merakı yüzünden, güzel koku anlamındaki \"ıtır\" kelimesinden gelen Itrî mahlasını aldığı kabul edilir.", "Bin kadar eser bestelediği yazılır, ancak bugüne yalnızca kırk-elli kadarı ulaşmıştır. En tanınmışı, bayram sabahları camilerde okunan segâh makamındaki tekbirdir. Segâh Salât-ı Ümmiye de cami musikisinin şaheserleri arasında sayılır.", "Itrî aynı zamanda şairdi; ancak divanı bugüne kadar bulunamadı. Ölümünün 300. yılı olan 2012, UNESCO tarafından Itrî'yi anma yılı olarak kutlandı."], "biliyor": "Itrî'nin, şiirin içine bir ismi gizleyen bilmece şiirler olan muammalarda da usta sayıldığı aktarılır.", "sorular": [{"s": "Bayram sabahları okunan Itrî tekbiri hangi makamdadır?", "c": ["Hicaz", "Segâh", "Rast", "Uşşak"], "d": 1, "a": "Segâh makamındadır."}, {"s": "Itrî'nin eserlerinden yaklaşık kaçı günümüze ulaşmıştır?", "c": ["5 kadarı", "40–50 kadarı", "500 kadarı", "Bin kadarı"], "d": 1, "a": "Bin kadar eserinden ancak kırk-elli kadarı bugüne ulaştı."}, {"s": "UNESCO 2012'de Itrî'yi neden andı?", "c": ["Doğumunun 400. yılı", "Ölümünün 300. yılı", "Divanının bulunması", "İlk konserinin yıldönümü"], "d": 1, "a": "2012, ölümünün 300. yılıydı."}], "sohbet": "Size bayram sabahlarını hatırlatan bir ses, koku ya da tat var mı?"}, {"n": 27, "kategori": "Felsefe", "sahne": "safak", "baslik": "Çadırında kendine not yazan imparator", "okuma": ["Marcus Aurelius, 161'den 180'e kadar Roma İmparatoru'ydu. Hükümdarlığının önemli bir bölümü, Tuna Nehri boyunca süren uzun seferlerde geçti.", "Bu yıllarda, büyük olasılıkla 170'lerde, kendi kendine notlar yazdı. Romalı olmasına rağmen bu notları Latince değil Eski Yunanca yazdı. Bugün \"Kendime Düşünceler\" ya da kısaca \"Düşünceler\" adıyla okunan bu notların başkaları okusun diye yazılıp yazılmadığı bilinmez.", "Marcus, Stoacı felsefeden, özellikle Epiktetos'un öğretilerinden etkilendi. Stoacılara göre insan olayları her zaman değiştiremez, ama olaylara nasıl bakacağını seçebilir.", "Notlarında sabırlı olmayı, öfkeye kapılmamayı ve her günü ölçülü yaşamayı kendine tekrar tekrar hatırlatır. Çağının en güçlü insanlarından birinin kendini böyle sorgulaması, eseri yüzyıllardır ilgi çekici kılar."], "biliyor": "Marcus Aurelius, Epiktetos'un düşüncelerini büyük ölçüde filozofun öğrencisi Arrianos'un derlediği \"Söylevler\"den öğrenmişti.", "sorular": [{"s": "Marcus Aurelius notlarını hangi dilde yazdı?", "c": ["Latince", "Eski Yunanca", "Aramice", "Mısırca"], "d": 1, "a": "Romalı olmasına rağmen Eski Yunanca yazdı."}, {"s": "Marcus Aurelius hangi felsefe okulundan etkilendi?", "c": ["Kinik", "Stoacı", "Epikürcü", "Septik"], "d": 1, "a": "Stoacı felsefeden, özellikle Epiktetos'tan etkilendi."}, {"s": "Seferleri hangi nehir boyunca sürdü?", "c": ["Nil", "Fırat", "Tuna", "Ren"], "d": 2, "a": "Notlarının çoğunu Tuna boyundaki seferlerde yazdığı düşünülür."}], "sohbet": "Kendinize her sabah hatırlatmak istediğiniz tek bir cümle olsaydı, ne olurdu?"}, {"n": 28, "kategori": "Haftanın tekrarı", "sahne": "tepeler", "baslik": "Dördüncü haftanın küçük sınavı", "okuma": ["Bu hafta Diyarbakır'daki bir saray atölyesinden Japonya kıyılarına, Sibirya'nın buzlu gölünden Oğuz obalarına, İstanbul'un bayram sabahlarından Tuna boyundaki bir imparator çadırına gittiniz.", "Dört hafta geride kaldı. Aşağıdaki beş soruyla bu haftayı tazeleyin."], "biliyor": "Bir bilgiyi birkaç gün sonra yeniden hatırlamaya çalışmak, onu yalnızca yeniden okumaktan daha kalıcı kılar; buna \"hatırlama pratiği\" denir.", "sorular": [{"s": "Cezerî hangi hanedanın hizmetinde çalıştı?", "c": ["Selçuklu", "Artuklu", "Eyyubi", "Osmanlı"], "d": 1, "a": "Diyarbakır'daki Artuklu sarayında çalıştı."}, {"s": "Hokusai'nin Büyük Dalga'sında uzakta hangi dağ görünür?", "c": ["Etna", "Fuji", "Ağrı", "Olimpos"], "d": 1, "a": "Fuji, dalganın kavisinin içinde küçük bir üçgen gibi durur."}, {"s": "Baykal Gölü hangi ülkededir?", "c": ["Moğolistan", "Kazakistan", "Rusya", "Çin"], "d": 2, "a": "Rusya'nın Sibirya bölgesindedir."}, {"s": "Dede Korkut Kitabı'nın on iki hikâyenin tamamını içeren nüshası nerededir?", "c": ["Vatikan", "Dresden", "Kahire", "Paris"], "d": 1, "a": "Almanya'daki Dresden nüshasıdır."}, {"s": "Marcus Aurelius \"Düşünceler\"i asıl olarak kime yazdı?", "c": ["Senatoya", "Oğluna", "Kendine", "Askerlerine"], "d": 2, "a": "Kendi kendine tuttuğu notlardı."}], "sohbet": "Bu haftanın meraklarından hangisi size en çok bir yolculuk hayali kurdurdu?"}, {"n": 29, "kategori": "Bilim tarihi", "sahne": "dag", "baslik": "Jüpiter'in etrafında dönen dört ışık", "okuma": ["1609'da Hollanda'da yeni icat edilen dürbünü duyan İtalyan bilgin Galileo Galilei, kendi teleskoplarını yapmaya başladı. Kısa sürede nesneleri yaklaşık yirmi kat büyüten aletler geliştirdi.", "7 Ocak 1610 gecesi teleskobunu Jüpiter'e çevirdiğinde gezegenin yanında küçük ışık noktaları gördü. Sonraki gecelerde bu noktaların yer değiştirdiğini ve toplam dört tane olduğunu fark etti: Bunlar Jüpiter'in etrafında dönen uydulardı.", "Bu buluş önemliydi; çünkü her şeyin Dünya'nın etrafında döndüğü fikrine karşı somut bir örnek sunuyordu. Galileo gözlemlerini Mart 1610'da yayımladığı \"Yıldız Habercisi\" (Sidereus Nuncius) adlı kısa kitapta anlattı.", "Uydulara, koruyucusu Medici ailesinin onuruna \"Medici Yıldızları\" adını verdi. Bugün bu dört uydu \"Galileo uyduları\" diye anılır."], "biliyor": "Galileo teleskobuyla Ay'ın yüzeyinin pürüzsüz olmadığını, dağlar ve çukurlarla dolu olduğunu da gösterdi.", "sorular": [{"s": "Galileo Jüpiter'in uydularını ilk ne zaman gördü?", "c": ["1543", "Ocak 1610", "1687", "1492"], "d": 1, "a": "7 Ocak 1610 gecesi gözlemledi."}, {"s": "Galileo uydulara hangi adı verdi?", "c": ["Roma Yıldızları", "Medici Yıldızları", "Venedik Işıkları", "Kuzey Yıldızları"], "d": 1, "a": "Koruyucusu Medici ailesinin onuruna bu adı verdi."}, {"s": "Galileo Jüpiter'in kaç uydusunu keşfetti?", "c": ["İki", "Dört", "Yedi", "On iki"], "d": 1, "a": "Bugün \"Galileo uyduları\" denen dört uyduyu keşfetti."}], "sohbet": "Gökyüzünü en son ne zaman uzun uzun izlediniz; o gece aklınızdan neler geçmişti?"}, {"n": 30, "kategori": "Mimari", "sahne": "vadi", "baslik": "Göbeklitepe: Yazıdan önce dikilen taşlar", "okuma": ["Şanlıurfa'ya yaklaşık 15 kilometre uzaklıktaki Göbeklitepe, yaklaşık 12.000 yıl öncesine tarihlenir. Yani Stonehenge'den ve Mısır piramitlerinden binlerce yıl daha eskidir.", "Alan 1963'te bir yüzey araştırmasında fark edildi; ancak asıl kazılar 1995'te Alman arkeolog Klaus Schmidt'in önderliğinde başladı. Alandaki kazı ve araştırmalar bugün de sürüyor.", "Burada daireler halinde dizilmiş, \"T\" biçimli büyük taş dikmeler bulunur; bazılarının yüksekliği 5,5 metreye ulaşır. Dikmelerin üzerinde tilki, yaban domuzu, yılan ve akbaba gibi hayvanların kabartmaları vardır. Bazı dikmelerin insan bedenini simgelediği düşünülür. Bu ağır taşların nasıl taşınıp dikildiği hâlâ merak konusudur.", "Bu yapıların, insanlar henüz yerleşik tarıma geçmeden önce avcı-toplayıcılar tarafından yapıldığı kabul edilir. Göbeklitepe 2018'de UNESCO Dünya Mirası Listesi'ne alındı."], "biliyor": "Klaus Schmidt, Göbeklitepe'yi bir yerleşim yerinden çok bir buluşma ve tören alanı olarak yorumlamıştı; bu yorum bugün de bilim insanları arasında tartışılıyor.", "sorular": [{"s": "Göbeklitepe hangi ilimizdedir?", "c": ["Mardin", "Şanlıurfa", "Adıyaman", "Gaziantep"], "d": 1, "a": "Şanlıurfa'ya yaklaşık 15 kilometre uzaklıktadır."}, {"s": "Göbeklitepe'deki büyük dikmeler hangi biçimdedir?", "c": ["Yuvarlak", "Kare", "\"T\" biçimli", "Üçgen"], "d": 2, "a": "Daireler halinde dizilmiş \"T\" biçimli dikmelerdir."}, {"s": "Göbeklitepe UNESCO Dünya Mirası Listesi'ne hangi yıl alındı?", "c": ["1985", "2003", "2018", "2023"], "d": 2, "a": "2018'de listeye alındı."}], "sohbet": "12.000 yıl sonra insanlar bizim zamanımızdan kalan bir yapı bulsa, sizce hangisinin ayakta kalmasını isterdiniz?"}, {"n": 31, "kategori": "Coğrafya", "sahne": "deniz", "baslik": "Salda Gölü: Mars'a ayna tutan göl", "okuma": ["Burdur'un Yeşilova ilçesindeki Salda Gölü, turkuaz suyu ve bembeyaz kıyılarıyla tanınır. Yer yer 180 metreyi aşan derinliğiyle Türkiye'nin en derin göllerinden biridir.", "Kıyılardaki beyaz renk büyük ölçüde hidromanyezit adlı bir mineralden gelir. Gölde, mikroskobik canlıların etkisiyle katman katman büyüyen ve stromatolit denen kaya yapıları bulunur.", "NASA, Salda'nın kıyısındaki mineralleri ve tortuları, Mars'taki Jezero Krateri'nin kenarlarındakilerin Dünya'daki en yakın benzeri olarak tanımladı. Jezero, Perseverance keşif aracının 2021'de indiği ve bir zamanlar suyla dolu olduğu düşünülen kraterdir.", "2019'da Amerikalı ve Türk bilim insanları gölün kıyılarında birlikte araştırma yaptı. Böylece Burdur'daki bir göl, Mars'ta eski yaşam izi arayanlara rehberlik etti. Bu yüzden göl, hem doğaseverlerin hem de bilim insanlarının ilgisini çekmeye devam ediyor."], "biliyor": "Salda'ya, beyaz kıyıları ve turkuaz suyu yüzünden zaman zaman \"Türkiye'nin Maldivleri\" denir.", "sorular": [{"s": "Salda Gölü hangi ilimizdedir?", "c": ["Isparta", "Burdur", "Denizli", "Antalya"], "d": 1, "a": "Burdur'un Yeşilova ilçesindedir."}, {"s": "Salda, Mars'ın hangi bölgesiyle karşılaştırıldı?", "c": ["Olympus Dağı", "Jezero Krateri", "Valles Marineris", "Kutup buzulları"], "d": 1, "a": "Perseverance'ın indiği Jezero Krateri ile karşılaştırıldı."}, {"s": "Salda kıyılarının beyaz rengi büyük ölçüde nereden gelir?", "c": ["Kar", "Tuz", "Hidromanyezit", "Mermer"], "d": 2, "a": "Hidromanyezit adlı mineralden gelir."}], "sohbet": "Türkiye'de birlikte keşfetmek istediğiniz, henüz gitmediğiniz bir yer var mı?"}, {"n": 32, "kategori": "Edebiyat", "sahne": "tepeler", "baslik": "Bir rüya yüzünden yola düşen gezgin: Evliya Çelebi", "okuma": ["Evliya Çelebi 25 Mart 1611'de İstanbul'un Unkapanı semtinde doğdu. Babası Derviş Mehmed Zıllî, Topkapı Sarayı'nın başkuyumcusuydu.", "Anlattığına göre gençliğinde bir rüya gördü: Peygamber'den şefaat dileyecekken heyecanla dili sürçtü ve \"seyahat\" dedi. Bu rüyayı yolculuğa çıkmak için bir işaret saydığı aktarılır.", "Kırk yılı aşkın bir süre Osmanlı topraklarını ve komşu ülkeleri dolaştı. Gördüğü şehirleri, yemekleri, dilleri, gelenekleri ve duyduğu ilginç hikâyeleri on ciltlik Seyahatname'de topladı.", "Eser yer yer abartılı anlatımlarıyla da bilinir; ama 17. yüzyıl hayatını bu kadar canlı anlatan başka bir kaynak bulmak zordur. Bugün Seyahatname, Osmanlı dönemini inceleyenlerin en çok başvurduğu kaynaklardan biridir. Evliya'nın ölüm yılı ve mezarı ise kesin olarak bilinmiyor."], "biliyor": "UNESCO, Evliya Çelebi'nin doğumunun 400. yılı olan 2011'i anma yıl dönümleri arasına aldı.", "sorular": [{"s": "Seyahatname kaç ciltten oluşur?", "c": ["Üç", "Beş", "On", "Yirmi"], "d": 2, "a": "On ciltlik büyük bir eserdir."}, {"s": "Evliya Çelebi'nin babası sarayda ne iş yapıyordu?", "c": ["Aşçıbaşı", "Başkuyumcu", "Mimar", "Hattat"], "d": 1, "a": "Topkapı Sarayı'nın başkuyumcusuydu."}, {"s": "Evliya Çelebi hangi şehirde doğdu?", "c": ["Bursa", "Edirne", "Konya", "İstanbul"], "d": 3, "a": "İstanbul'un Unkapanı semtinde doğdu."}], "sohbet": "Bir yıl boyunca istediğiniz yerleri gezip yazabilseydiniz, rotanız nereden başlardı?"}, {"n": 33, "kategori": "Müzik", "sahne": "dag", "baslik": "Bach'ı yeniden duyuran yirmi yaşındaki genç", "okuma": ["Johann Sebastian Bach 1750'de öldüğünde, müziği büyük ölçüde kendi kuşağıyla birlikte unutulmaya yüz tuttu. Eserleri bazı kiliselerde ve meraklı müzisyenler arasında yaşasa da geniş dinleyici onları pek tanımıyordu.", "1824'te on beş yaşındaki Felix Mendelssohn'a büyükannesi, Bach'ın Matta Pasyonu'nun bir kopyasını hediye etti. Genç besteci, koro, solistler ve orkestra için yazılmış bu büyük esere hayran kaldı ve onu yeniden sahnelemeyi kafasına koydu.", "Mendelssohn, 11 Mart 1829'da, henüz yirmi yaşındayken, Berlin'deki Singakademie'de Matta Pasyonu'nu yönetti. Eser ilk kez 1727'de Leipzig'de seslendirilmişti; aradan yaklaşık bir asır geçmişti.", "Konser büyük ilgi gördü ve Avrupa'da Bach'a yönelik yeni bir merakın başlangıcı sayıldı. Bugün Bach'ı en büyük bestecilerden biri olarak anıyorsak, bunda o akşamın payı büyüktür."], "biliyor": "Bach'ın ölümünden sonra da Matta Pasyonu, Leipzig'deki Aziz Thomas Kilisesi'nde zaman zaman seslendirilmeye devam etmişti.", "sorular": [{"s": "Bach hangi yıl öldü?", "c": ["1685", "1750", "1791", "1827"], "d": 1, "a": "Bach 1750'de Leipzig'de öldü."}, {"s": "Mendelssohn Matta Pasyonu'nu 1829'da hangi şehirde yönetti?", "c": ["Viyana", "Leipzig", "Berlin", "Paris"], "d": 2, "a": "Berlin'deki Singakademie'de yönetti."}, {"s": "Mendelssohn'a eserin kopyasını kim hediye etmişti?", "c": ["Öğretmeni", "Büyükannesi", "Kralı", "Bir rahip"], "d": 1, "a": "1824'te büyükannesi hediye etti."}], "sohbet": "Sizin için unutulmaya yüz tutmuş ama yeniden dinlenmeyi hak eden bir şarkı ya da ses var mı?"}, {"n": 34, "kategori": "Felsefe", "sahne": "safak", "baslik": "Öğrencilerinin yazıya geçirdiği öğretmen: Konfüçyüs", "okuma": ["Konfüçyüs'ün geleneksel olarak MÖ 551 ile 479 yılları arasında yaşadığı kabul edilir. Hayatının büyük kısmını bugünkü Çin'in doğusundaki Lu devletinde geçirdi.", "Devlet görevlerinde bulundu, yıllarca komşu devletleri dolaştı; ama en çok öğretmen olarak hatırlanır. Ona göre iyi bir toplum, dürüst ve ölçülü insanlarla, ailede ve devlette karşılıklı saygıyla kurulurdu.", "Konfüçyüs düşüncelerini kendisi kitap hâline getirmedi. Ölümünden sonra öğrencileri onun sözlerini ve sohbetlerini topladı; bu derleme zamanla \"Konuşmalar\" (Lunyu) adıyla bilinen esere dönüştü.", "Kaynaklarda adı bilinen yetmişi aşkın öğrencisinden söz edilir. Öğrencilerinin, öldüğünde onun için bir babaya tutulduğu gibi üç yıl yas tuttuğu aktarılır. Düşünceleri yüzyıllar içinde Çin'den Kore'ye ve Japonya'ya kadar geniş bir coğrafyayı etkiledi."], "biliyor": "\"Konuşmalar\" bir anda yazılmadı; bugünkü biçimini bir asırdan uzun bir sürede, adım adım aldığı düşünülür.", "sorular": [{"s": "Konfüçyüs'ün sözleri hangi eserde toplanmıştır?", "c": ["Konuşmalar", "Devlet", "Düşünceler", "Tao Te Ching"], "d": 0, "a": "Öğrencileri sözlerini \"Konuşmalar\"da (Lunyu) topladı."}, {"s": "Konfüçyüs hayatının büyük kısmını hangi devlette geçirdi?", "c": ["Qin", "Lu", "Han", "Ming"], "d": 1, "a": "Lu devletinde yaşadı."}, {"s": "Konfüçyüs'ün sözlerini kim yazıya geçirdi?", "c": ["Kendisi", "İmparator", "Öğrencileri", "Oğlu"], "d": 2, "a": "Ölümünden sonra öğrencileri derledi."}], "sohbet": "Hayatınızda size en çok şey öğreten öğretmen kimdi ve ondan aklınızda kalan bir söz var mı?"}, {"n": 35, "kategori": "Haftanın tekrarı", "sahne": "tepeler", "baslik": "Beşinci haftanın küçük sınavı", "okuma": ["Bu hafta Jüpiter'in uydularından Göbeklitepe'nin taşlarına, Salda'nın beyaz kıyılarından Evliya Çelebi'nin yollarına, Berlin'deki bir konser salonundan Konfüçyüs'ün derslerine uzandınız.", "Beş hafta geride kaldı. Aşağıdaki beş soruyla bu haftayı tazeleyin."], "biliyor": "Öğrenilen bilgiler, aralıklarla tekrar edildiğinde tek seferde yoğun çalışılanlardan daha uzun süre akılda kalır; buna \"aralıklı tekrar\" denir.", "sorular": [{"s": "Galileo, Jüpiter'in uydularına koruyucusu olan hangi ailenin adını verdi?", "c": ["Borgia", "Medici", "Sforza", "Habsburg"], "d": 1, "a": "Onlara \"Medici Yıldızları\" dedi."}, {"s": "Göbeklitepe yaklaşık kaç yıl öncesine tarihlenir?", "c": ["2.000", "5.000", "12.000", "40.000"], "d": 2, "a": "Yaklaşık 12.000 yıl öncesine tarihlenir."}, {"s": "Salda Gölü, Mars'ta hangi kraterle karşılaştırıldı?", "c": ["Jezero", "Gale", "Hellas", "Olympus"], "d": 0, "a": "Perseverance'ın indiği Jezero Krateri ile."}, {"s": "Evliya Çelebi gezdiği yerleri hangi eserde anlattı?", "c": ["Mukaddime", "Seyahatname", "Kutadgu Bilig", "Divan"], "d": 1, "a": "On ciltlik Seyahatname'de."}, {"s": "Bach'ın Matta Pasyonu'nu 1829'da yeniden seslendiren besteci kimdir?", "c": ["Mozart", "Beethoven", "Mendelssohn", "Vivaldi"], "d": 2, "a": "Felix Mendelssohn, yirmi yaşındayken yönetti."}], "sohbet": "Bu haftanın meraklarından hangisini bir arkadaşınıza anlatmak isterdiniz?"}, {"n": 36, "kategori": "Bilim tarihi", "sahne": "vadi", "baslik": "Tophane sırtlarındaki kısa ömürlü gözlemevi", "okuma": ["Şamlı bilgin Takiyüddin, 1570'lerde İstanbul'a geldi ve saray müneccimbaşısı oldu. Sultan III. Murad'ın desteğiyle Tophane sırtlarında bir gözlemevi kurdu; gözlemevi 1577'de çalışmaya başladı.", "Burada gökyüzündeki konumları ölçmek için büyük aletler kullanıldı. Aynı yıllarda Danimarkalı Tycho Brahe de kendi gözlemevinde benzer ölçümler yapıyordu. Böylece İstanbul, kısa bir süre için dönemin önemli gözlem merkezlerinden biri oldu.", "1577 sonbaharında gökyüzünde parlak bir kuyruklu yıldız göründü ve gözlemevindeki bilginler onu izleme fırsatı buldu.", "Ne var ki gözlemevi uzun yaşamadı; 1580'de kapatıldı ve yıkıldı. Kapatılma nedenleri tartışmalıdır: Kıskançlıklar, salgın hastalık ve gözlemin uğursuzluk getirdiğine dair dedikodular aktarılır. Takiyüddin ise astronomi üzerine yirmi, matematik üzerine beş eser bırakan çok yönlü bir bilgin olarak hatırlanır."], "biliyor": "Takiyüddin yalnızca astronomiyle değil, otomatik makineler üzerine yazdığı, alanında öncü sayılan bir eserle de tanınır.", "sorular": [{"s": "Takiyüddin'in gözlemevi İstanbul'un hangi semtindeydi?", "c": ["Üsküdar", "Tophane", "Fatih", "Beşiktaş"], "d": 1, "a": "Tophane sırtlarında kuruldu."}, {"s": "Gözlemevini destekleyen padişah kimdi?", "c": ["Kanuni Sultan Süleyman", "II. Selim", "III. Murad", "IV. Murad"], "d": 2, "a": "III. Murad döneminde kuruldu."}, {"s": "Gözlemevi hangi yıl kapatıldı?", "c": ["1577", "1580", "1600", "1650"], "d": 1, "a": "Kurulduktan yalnızca birkaç yıl sonra, 1580'de kapatıldı."}], "sohbet": "Gökyüzünde gördüğünüz en etkileyici manzara neydi, hatırlıyor musunuz?"}, {"n": 37, "kategori": "Sanat", "sahne": "deniz", "baslik": "Bir heykeltıraşın boyadığı tavan", "okuma": ["Papa II. Julius, 1508'de Michelangelo'dan Vatikan'daki Sistina Şapeli'nin tavanını boyamasını istedi. Michelangelo kendini her şeyden önce heykeltıraş sayıyordu ve bu işe pek hevesli değildi.", "Yine de görevi kabul etti ve yaklaşık dört yıl çalıştı. Tavan 1512'de tamamlandı. Islak sıvaya boyayla yapılan bu tekniğe fresk denir; boya kurudukça duvarın bir parçası olur.", "Tavanda Yaratılış hikâyesinden dokuz büyük sahne ve toplamda üç yüzü aşkın figür vardır. Bunların en ünlüsü, iki elin birbirine neredeyse dokunduğu \"Âdem'in Yaratılışı\"dır.", "Michelangelo'nun sırtüstü yatarak çalıştığı sık anlatılır; oysa dönemin yazarları onun iskele üzerinde ayakta, başı geriye eğik çalıştığını yazar. Bugün şapel, her yıl milyonlarca kişinin gezdiği Vatikan Müzeleri'nin bir parçasıdır."], "biliyor": "Michelangelo yıllar sonra aynı şapele dönüp sunak duvarına büyük \"Kıyamet Günü\" freskini de yaptı.", "sorular": [{"s": "Sistina Şapeli'nin tavanı hangi yıllarda boyandı?", "c": ["1450–1455", "1508–1512", "1600–1604", "1700–1710"], "d": 1, "a": "1508'de başlandı, 1512'de bitti."}, {"s": "Islak sıvaya boyayla resim yapma tekniğine ne denir?", "c": ["Mozaik", "Fresk", "Gravür", "Vitray"], "d": 1, "a": "Bu tekniğe fresk denir."}, {"s": "Michelangelo kendini öncelikle ne olarak görüyordu?", "c": ["Ressam", "Mimar", "Heykeltıraş", "Şair"], "d": 2, "a": "Kendini her şeyden önce heykeltıraş sayıyordu."}], "sohbet": "İsteyerek başlamadığınız ama sonunda gurur duyduğunuz bir iş oldu mu?"}, {"n": 38, "kategori": "Coğrafya", "sahne": "dag", "baslik": "Atacama: Yağmurun unuttuğu çöl", "okuma": ["Şili'nin kuzeyinde, Pasifik kıyısı boyunca yaklaşık 1.600 kilometre uzanan Atacama, kutup bölgeleri dışındaki en kurak çöl kabul edilir. Bazı yerlerine yılda yalnızca birkaç milimetre yağmur düşer.", "Bölgedeki bazı hava istasyonlarında hiç yağmur kaydedilmemiştir. Toprağı Mars toprağına benzediği için NASA, Mars görevleri için geliştirilen aletleri burada dener.", "Kuru ve açık hava, Atacama'yı gökbilimciler için de eşsiz kılar. Yaklaşık 5.000 metre yükseklikteki Chajnantor platosunda, 66 antenden oluşan ALMA teleskobu evrenin soğuk ve uzak köşelerini inceler. Çölün başka bir köşesindeki Paranal Dağı'nda ise Çok Büyük Teleskop (VLT) bulunur.", "Ama çöl her zaman çıplak değildir: Yağmurun bol olduğu bazı yıllarda, eylül ile kasım arasında kumların arasından rengârenk çiçekler fışkırır. Bu olaya \"çiçekli çöl\" deni
