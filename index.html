const TZ = "Europe/Istanbul";

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let name = store.get("merak.ad", "");
family = store.get("merak.aile", false);
let answers = store.get("merak.cevap", {});   // {"3": [0,2,1]}
let plan = store.get("merak.plan", null);      // {count, last}
let streak = store.get("merak.seri", {n:0, last:""});
let open = [], selected = 1, netOk = true, clockSkew = 0;

/* ---------- bildirim ---------- */
let outbox = store.get("merak.outbox", []);
async function flushOutbox(){
  if(!AUTO_ON() || !outbox.length) return true;
  const rest = [];
  for(const m of outbox){
    try{ const r = await fetch("https://ntfy.sh/", {method:"POST", body:JSON.stringify(Object.assign({topic:NOTIFY_TOPIC}, m))}); if(!r.ok) throw 0; }
    catch(e){ rest.push(m); }
  }
  outbox = rest; store.set("merak.outbox", outbox); return rest.length === 0;
}
function notify(title, message, tags){ if(!AUTO_ON()) return; outbox.push({title, message, tags:tags||[], priority:3}); store.set("merak.outbox", outbox); flushOutbox(); }
addEventListener("online", flushOutbox);

/* ---------- tarih ve günlük açılış ---------- */
const dayStr = d => new Intl.DateTimeFormat("en-CA", {timeZone:TZ, year:"numeric", month:"2-digit", day:"2-digit"}).format(d);
async function serverNow(){
  try{
    const r = await fetch("manifest.webmanifest?zaman=" + Date.now(), {cache:"no-store"});
    const h = r.headers.get("Date");
    if(h){ const d = new Date(h); if(!isNaN(d)){ clockSkew = d - Date.now(); return d; } }
  }catch(e){}
  return null;
}
/* Günde iki merak: sabah 06:00, akşam 18:00 (İstanbul). Bir "dilim" = "YYYY-AA-GG-0" (sabah) ya da "-1" (akşam). */
const istHour = d => +new Intl.DateTimeFormat("en-GB", {timeZone:TZ, hour:"2-digit", hourCycle:"h23"}).format(d);
const slotOf = d => { const x = new Date(d.getTime() - 6*3600e3); return dayStr(x) + (istHour(x) < 12 ? "-0" : "-1"); };
const SLOT_ADI = {"0":"Sabah", "1":"Akşam"};
async function schedule(){
  const now = await serverNow(); netOk = !!now;
  const slot = slotOf(now || new Date());
  let fresh = 0;
  if(plan && plan.last && plan.last.length === 10) plan.last += "-0";   // eski (günde bir) kayıttan geçiş
  if(!plan){ plan = {count:1, last:slot, slots:{1: slot.slice(-1)}}; fresh = 1; }
  else if(now && slot > plan.last && plan.count < GUNLER.length){
    plan.count++; plan.last = slot; plan.slots = plan.slots || {}; plan.slots[plan.count] = slot.slice(-1); fresh = plan.count;
  }
  store.set("merak.plan", plan);
  open = GUNLER.slice(0, plan.count);
  return fresh;
}
function nextSlot(){
  const parts = new Intl.DateTimeFormat("en-GB", {timeZone:TZ, hour:"2-digit", minute:"2-digit", second:"2-digit", hourCycle:"h23"}).formatToParts(new Date(Date.now() + clockSkew));
  const g = t => +parts.find(x => x.type === t).value;
  const sec = g("hour")*3600 + g("minute")*60 + g("second");
  const evening = sec >= 6*3600 && sec < 18*3600;
  const target = sec < 6*3600 ? 6*3600 : sec < 18*3600 ? 18*3600 : 30*3600;
  const left = target - sec;
  return {ad: evening ? "Akşam merakı" : "Sabah merakı", saat: evening ? "18:00" : "06:00", kalan: Math.floor(left/3600) + " sa " + Math.floor((left%3600)/60) + " dk"};
}
function greet(){
  const h = +new Intl.DateTimeFormat("en-GB", {timeZone:TZ, hour:"2-digit", hourCycle:"h23"}).format(new Date(Date.now() + clockSkew));
  const w = h < 5 ? "İyi geceler" : h < 12 ? "Günaydın" : h < 18 ? "İyi günler" : "İyi akşamlar";
  $("greet").textContent = name ? w + ", " + name : "Günün Merakı";
  $("today-date").textContent = new Intl.DateTimeFormat("tr-TR", {timeZone:TZ, weekday:"long", day:"numeric", month:"long"}).format(new Date(Date.now() + clockSkew));
  $("whoami").textContent = name ? name + " olarak okuyorsunuz" : "";
}

/* ---------- görünüm ---------- */
function render(){
  const d = open.find(x => x.n === selected) || open[open.length-1];
  $("heroimg").src = "manzara/" + d.sahne + ".webp";
  $("heroimg").alt = "Pastel tonlarda sakin bir manzara";
  const sl = plan.slots && plan.slots[d.n];
  $("meta").textContent = "Merak " + d.n + (sl ? " · " + SLOT_ADI[sl] : "") + " · " + d.kategori;
  $("title").textContent = d.baslik;
  $("read").innerHTML = d.okuma.map(p => "<p>" + esc(p) + "</p>").join("");
  $("know").innerHTML = '<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="10" r="6.5" fill="none" stroke="var(--no)" stroke-width="1.6"/><path d="M9.5 19h5M10 21.5h4M12 10v3" stroke="var(--no)" stroke-width="1.6" stroke-linecap="round"/></svg><div><b>Biliyor muydunuz?</b><p>' + esc(d.biliyor) + "</p></div>";
  renderQuiz(d);
  renderTomorrow(); renderPast(); greet();
  $("streak").textContent = streak.n + " gün üst üste";
}

function renderQuiz(d){
  const a = answers[d.n] || [];
  const doneAll = a.length === d.sorular.length && a.every(x => x !== null && x !== undefined);
  const right = d.sorular.filter((q, i) => a[i] === q.d).length;
  let html = "<h3>Üç soruda pekiştirin</h3><p class=\"sub\">Bir seçeneğe dokunun; doğru cevap ve kısa açıklaması hemen görünür.</p>";
  d.sorular.forEach((q, i) => {
    const picked = a[i];
    const answered = picked !== undefined && picked !== null;
    html += '<div class="q"><p class="qs"><span>' + (i+1) + ".</span>" + esc(q.s) + '</p><div class="opts">' +
      q.c.map((c, j) => {
        let cls = "opt";
        if(answered){ cls += j === q.d ? " right" : (j === picked ? " wrong" : " dim"); }
        return '<button type="button" class="' + cls + '" data-q="' + i + '" data-c="' + j + '"' + (answered ? " disabled" : "") + ">" + esc(c) + "</button>";
      }).join("") + "</div>" +
      (answered ? '<p class="expl"><b>' + (picked === q.d ? "Doğru. " : "Doğru cevap: " + esc(q.c[q.d]) + ". ") + "</b>" + esc(q.a) + "</p>" : "") +
      "</div>";
  });
  if(doneAll){
    html += '<div class="result"><span class="score">' + right + " / " + d.sorular.length + "</span><span class=\"note\">" +
      (right === d.sorular.length ? "Hepsi doğru. Bu merak tamam." : "Güzel bir okuma. Yanlışlar da öğrenmenin parçası.") + "</span></div>";
  }
  $("quiz").innerHTML = html;
  $("quiz").querySelectorAll(".opt:not([disabled])").forEach(b => b.addEventListener("click", () => pick(d, +b.dataset.q, +b.dataset.c)));
  const talk = $("talk");
  talk.hidden = !doneAll;
  talk.innerHTML = "<b>Bu akşam konuşun</b><p>" + esc(d.sohbet) + "</p>";
}

function pick(d, qi, ci){
  const a = answers[d.n] || new Array(d.sorular.length).fill(null);
  if(a[qi] !== null && a[qi] !== undefined) return;
  a[qi] = ci; answers[d.n] = a; store.set("merak.cevap", answers);
  const doneAll = a.every(x => x !== null && x !== undefined);
  if(doneAll){
    const right = d.sorular.filter((q, i) => a[i] === q.d).length;
    const today = plan.last.slice(0, 10);
    if(streak.last !== today){
      const y = new Date(today + "T12:00:00Z"); y.setUTCDate(y.getUTCDate() - 1);
      streak.n = streak.last === y.toISOString().slice(0,10) ? streak.n + 1 : 1; streak.last = today; store.set("merak.seri", streak);
    }
    notify((name || "Biri") + " Merak " + d.n + "'i bitirdi · " + right + "/" + d.sorular.length, d.baslik + "\n\nBu akşamın sorusu: " + d.sohbet, right === d.sorular.length ? ["sparkles"] : ["books"]);
  }
  render();
  if(doneAll) setTimeout(() => $("talk").scrollIntoView({behavior:"smooth", block:"center"}), 250);
}

function renderTomorrow(){
  const host = $("tomorrow");
  const next = plan.count + 1;
  const ready = next <= GUNLER.length;
  const ns = nextSlot();
  host.innerHTML = '<div class="tomorrow"><svg viewBox="0 0 44 44" width="44" height="44" aria-hidden="true"><circle cx="22" cy="22" r="20" fill="var(--lav-soft)"/><path d="M27 12a11 11 0 1 0 5 17 9 9 0 0 1-5-17z" fill="var(--lav)"/><circle cx="13" cy="14" r="1.4" fill="var(--accent)"/><circle cx="33" cy="33" r="1" fill="var(--accent)"/></svg>' +
    "<div><h3>" + (ready ? "Sıradaki: " + ns.ad.toLocaleLowerCase("tr-TR") : "Yeni meraklar hazırlanıyor") + "</h3><p>" +
    (ready ? "Her gün iki merak açılır: sabah 06:00'da ve akşam 18:00'de. " + ns.ad + " " + ns.saat + "'de kendiliğinden açılacak. Kalan süre: <b id=\"cd\">" + ns.kalan + "</b>" : "Yakında yeni meraklar eklenecek.") +
    (netOk ? "" : "<br>Yeni merakın açılması için internete bağlı olun.") + "</p></div></div>";
}

function renderPast(){
  if(open.length < 2){ $("past").innerHTML = ""; return; }
  $("past").innerHTML = "<h3>Geçmiş meraklar</h3><div class=\"plist\">" + open.slice().reverse().map(d => {
    const a = answers[d.n] || [];
    const done = a.length === d.sorular.length && a.every(x => x !== null && x !== undefined);
    const right = d.sorular.filter((q, i) => a[i] === q.d).length;
    return '<button type="button" class="prow" data-n="' + d.n + '" aria-current="' + (d.n === selected) + '"><span class="dn">' + d.n + '</span><span class="pt"><small>' + esc(d.kategori) + "</small><span>" + esc(d.baslik) + '</span></span><span class="ps">' + (done ? right + "/" + d.sorular.length : "okunmadı") + "</span></button>";
  }).join("") + "</div>";
  $("past").querySelectorAll(".prow").forEach(b => b.addEventListener("click", () => { selected = +b.dataset.n; render(); window.scrollTo({top:0, behavior:"smooth"}); }));
}

/* ---------- uçuşan ışık zerreleri ---------- */
(function motes(){
  const host = document.querySelector(".motes"); let h = "";
  for(let i=0;i<14;i++){ h += '<i style="left:' + (Math.random()*100).toFixed(1) + "%;animation-duration:" + (14 + Math.random()*16).toFixed(1) + "s;animation-delay:-" + (Math.random()*20).toFixed(1) + "s;width:" + (3 + Math.random()*5).toFixed(1) + "px;height:" + (3 + Math.random()*5).toFixed(1) + 'px"></i>'; }
  host.innerHTML = h;
})();

/* ---------- sakin ambiyans müziği (tarayıcıda canlı üretilir) ---------- */
const Ambient = (() => {
  let ctx, master, verb, keepAlive, timers = [], on = false;
  function silentWav(){
    // 1 saniyelik sessiz WAV: iPhone'un sesi "medya" olarak çalmasını sağlar
    const rate = 8000, n = rate, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
    const w = (o, t) => { for(let i=0;i<t.length;i++) v.setUint8(o+i, t.charCodeAt(i)); };
    w(0,"RIFF"); v.setUint32(4, 36 + n, true); w(8,"WAVE"); w(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24, rate, true); v.setUint32(28, rate, true); v.setUint16(32,1,true); v.setUint16(34,8,true); w(36,"data"); v.setUint32(40, n, true);
    for(let i=0;i<n;i++) v.setUint8(44+i, 128);
    return URL.createObjectURL(new Blob([buf], {type:"audio/wav"}));
  }
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const CHORDS = [[48,55,64,71],[45,52,60,67],[41,48,57,64],[43,50,59,62]];
  const BELLS = [72,74,76,79,81,84,86,88];
  function impulse(sec){
    const len = ctx.sampleRate * sec, b = ctx.createBuffer(2, len, ctx.sampleRate);
    for(let c=0;c<2;c++){ const d = b.getChannelData(c); for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.6); }
    return b;
  }
  function pad(notes, t){
    notes.forEach(m => {
      ["sine","triangle"].forEach((type, k) => {
        const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
        o.type = type; o.frequency.value = hz(m); o.detune.value = k ? 5 : -4;
        f.type = "lowpass"; f.frequency.value = 900;
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(k ? .038 : .06, t + 3.5); g.gain.setValueAtTime(k ? .038 : .06, t + 7); g.gain.linearRampToValueAtTime(0, t + 12);
        o.connect(f).connect(g); g.connect(master); g.connect(verb);
        o.start(t); o.stop(t + 12.2);
      });
    });
  }
  function bell(t){
    const m = BELLS[Math.floor(Math.random()*BELLS.length)];
    const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine"; o.frequency.value = hz(m); o2.type = "sine"; o2.frequency.value = hz(m) * 2.01;
    const g2 = ctx.createGain(); g2.gain.value = .25;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.085, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + 4);
    o.connect(g); o2.connect(g2).connect(g); g.connect(verb); g.connect(master);
    o.start(t); o2.start(t); o.stop(t + 4.1); o2.stop(t + 4.1);
  }
  function waves(){
    const len = ctx.sampleRate * 4, b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0);
    let last = 0; for(let i=0;i<len;i++){ last = (last + .02*(Math.random()*2-1)) / 1.02; d[i] = last * 3.5; }
    const s = ctx.createBufferSource(); s.buffer = b; s.loop = true;
    const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 500;
    const g = ctx.createGain(); g.gain.value = .05;
    const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = .08; lg.gain.value = .04;
    lfo.connect(lg).connect(g.gain);
    s.connect(f).connect(g).connect(master); s.start(); lfo.start();
  }
  function loop(){
    let i = 0;
    const chord = () => { if(!on) return; pad(CHORDS[i++ % CHORDS.length], ctx.currentTime + .05); timers.push(setTimeout(chord, 9000)); };
    const ring = () => { if(!on) return; bell(ctx.currentTime + .05); timers.push(setTimeout(ring, 2200 + Math.random()*4200)); };
    chord(); timers.push(setTimeout(ring, 1500));
  }
  return {
    async start(){
      // iPhone sessiz moddayken de çalsın: ses oturumunu "müzik çalma" olarak işaretle
      try{ if(navigator.audioSession) navigator.audioSession.type = "playback"; }catch(e){}
      if(!keepAlive){ keepAlive = new Audio(silentWav()); keepAlive.loop = true; keepAlive.setAttribute("playsinline", ""); }
      try{ await keepAlive.play(); }catch(e){}
      if(!ctx){
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 3; comp.connect(ctx.destination);
        master = ctx.createGain(); master.gain.value = 0; master.connect(comp);
        verb = ctx.createConvolver(); verb.buffer = impulse(5); const vg = ctx.createGain(); vg.gain.value = .55; verb.connect(vg).connect(master);
        waves();
      }
      await ctx.resume(); on = true;
      master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setTargetAtTime(1, ctx.currentTime, 1.5);
      loop();
    },
    stop(){
      on = false; timers.forEach(clearTimeout); timers = [];
      if(keepAlive) keepAlive.pause();
      if(ctx){ master.gain.setTargetAtTime(0, ctx.currentTime, .6); setTimeout(() => { if(!on) ctx.suspend(); }, 2500); }
    },
    get on(){ return on; }
  };
})();
$("music").addEventListener("click", async () => {
  const b = $("music");
  if(Ambient.on){ Ambient.stop(); b.setAttribute("aria-pressed","false"); $("musiclbl").textContent = "Müzik"; store.set("merak.muzik", false); }
  else { try{ await Ambient.start(); b.setAttribute("aria-pressed","true"); $("musiclbl").textContent = "Müzik açık"; store.set("merak.muzik", true); }catch(e){ $("musiclbl").textContent = "Müzik çalmadı"; } }
});
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden" && Ambient.on){ Ambient.stop(); $("music").setAttribute("aria-pressed","false"); $("musiclbl").textContent = "Müzik"; } });

/* ---------- isim ---------- */
const normCode = c => c.toUpperCase().replace(/İ/g,"I").replace(/[^A-Z0-9]/g, "");
async function sha(t){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,"0")).join(""); }
function askName(){
  $("who").hidden = false;
  $("nameinput").value = name; $("whoerr").textContent = "";
  setTimeout(() => $("nameinput").focus(), 50);
  $("whoform").onsubmit = async e => {
    e.preventDefault();
    const n = $("nameinput").value.trim().slice(0, 24);
    if(!n){ $("whoerr").textContent = "Lütfen adınızı yazın."; return; }
    setName(n);
  };
}
function setName(n){
  const first = !name; name = n; store.set("merak.ad", n); $("who").hidden = true; greet();
  if(first) notify(n + " Günün Merakı'na katıldı", "İlk gün: " + open[0].baslik, ["wave"]);
}
$("rename").addEventListener("click", askName);

/* ---------- başlangıç ---------- */
async function check(first){
  const fresh = await schedule();
  if(fresh || first){ selected = open[open.length-1].n; render(); }
  return fresh;
}
(async function start(){
  await check(true);
  if(!name) askName();
  flushOutbox();
  setInterval(() => { const c = $("cd"); if(c) c.textContent = nextSlot().kalan; if(plan && slotOf(new Date(Date.now() + clockSkew)) > plan.last) check(false); }, 30000);
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") check(false); });
})();
</script>
