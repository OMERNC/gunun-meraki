<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="ikon_180.png">
<link rel="icon" type="image/png" href="ikon_192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Mert'in Bilim Görevleri</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bilim Görevleri">
<meta name="theme-color" content="#26357a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: kareli defter zemininde tek sütun — 3B ada sahnesi, bugünün görevi (seviye seçicili), kod kilidi, 30 günlük harita */
:root{
  --paper:#f3f7fb; --grid:rgba(40,70,120,.075); --ink:#17223a; --muted:#5b6880;
  --card:#ffffff; --line:#d9e2ee; --accent:#f26a21; --accent-ink:#ffffff; --accent-soft:#ffe7d8;
  --teal:#13998a; --teal-soft:#d6f2ee; --sun:#ffc23d; --locked:#c9d3e1; --boss:#7b4fd6; --boss-soft:#ece4fb;
  --sky-top:#2f3f86; --sky-mid:#a9bdf0; --sky-low:#ffd9c0; --err:#c43d3d;
  --robot:#2bb3a3; --robot-dark:#16786d; --screen:#14233b; --eye:#7ff7e6;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Lexend", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0e1829; --grid:rgba(140,180,255,.07); --ink:#e7eefb; --muted:#9aa9c2;
  --card:#15233a; --line:#26385a; --accent:#ff8a45; --accent-ink:#1a0e05; --accent-soft:#3a2416;
  --teal:#3ccab8; --teal-soft:#123a37; --sun:#ffcf5c; --locked:#33476a; --boss:#a585f0; --boss-soft:#271f45;
  --sky-top:#0b1233; --sky-mid:#27347a; --sky-low:#6d4a8a; --err:#ff7b7b;
  --robot:#36c2b1; --robot-dark:#1d8a7d; --screen:#0a1322; --eye:#8ffbea; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0e1829; --grid:rgba(140,180,255,.07); --ink:#e7eefb; --muted:#9aa9c2;
  --card:#15233a; --line:#26385a; --accent:#ff8a45; --accent-ink:#1a0e05; --accent-soft:#3a2416;
  --teal:#3ccab8; --teal-soft:#123a37; --sun:#ffcf5c; --locked:#33476a; --boss:#a585f0; --boss-soft:#271f45;
  --sky-top:#0b1233; --sky-mid:#27347a; --sky-low:#6d4a8a; --err:#ff7b7b;
  --robot:#36c2b1; --robot-dark:#1d8a7d; --screen:#0a1322; --eye:#8ffbea; color-scheme:dark }

*{box-sizing:border-box}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.6;
}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column}
.brand small{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand h1{font-size:1.75rem;font-weight:800}
.score{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px;font-weight:600;font-variant-numeric:tabular-nums}
.score .star{width:26px;height:26px}

/* 3B sahne */
.stage{position:relative;border:2px solid var(--ink);border-radius:24px;overflow:hidden;box-shadow:6px 6px 0 var(--ink);
  background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 55%,var(--sky-low) 100%);height:clamp(300px,62vw,400px);touch-action:pan-y}
.stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;cursor:grab}
.stage canvas:active{cursor:grabbing}
.fallback{position:absolute;inset:0;display:grid;place-items:center;padding-bottom:70px;transition:opacity .6s}
.fallback svg{width:150px;height:160px;overflow:visible}
.stage.ready .fallback{opacity:0;pointer-events:none}
.bubble{position:absolute;left:12px;right:12px;bottom:12px;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:10px 14px;font-size:.95rem;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.bubble b{font-family:var(--display);font-size:1.02rem;color:var(--teal)}
.hint3d{position:absolute;top:10px;right:12px;font-size:.72rem;color:#fff;background:rgba(10,18,40,.45);padding:3px 10px;border-radius:999px;letter-spacing:.04em}
@keyframes pop{from{transform:scale(.9)}to{transform:scale(1)}}
.burst{position:absolute;left:50%;top:45%;width:0;height:0;pointer-events:none}
.burst i{position:absolute;width:14px;height:14px;background:var(--sun);clip-path:polygon(50% 0,61% 38%,100% 38%,68% 60%,79% 100%,50% 75%,21% 100%,32% 60%,0 38%,39% 38%);animation:fly 1.2s ease-out forwards}
@keyframes fly{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--x),var(--y)) scale(1.4) rotate(140deg);opacity:0}}
.volt{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

/* görev kartı */
.mission{background:var(--card);border:2px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);overflow:hidden}
.mission.boss{border-color:var(--boss);box-shadow:6px 6px 0 var(--boss)}
.m-head{padding:18px 20px 6px;display:flex;flex-direction:column;gap:8px}
.eyebrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font-size:.72rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--teal-soft);color:var(--teal)}
.chip.day{background:var(--ink);color:var(--card)}
.boss .chip{background:var(--boss-soft);color:var(--boss)}
.boss .chip.day{background:var(--boss);color:var(--card)}
.m-head h2{font-size:1.65rem;font-weight:800}
.m-body{padding:4px 20px 18px;display:flex;flex-direction:column;gap:12px}
.m-body p{margin:0;max-width:62ch}
.formula{border:2px dashed var(--teal);border-radius:14px;padding:12px 14px;background:var(--teal-soft);display:flex;flex-direction:column;gap:8px}
.formula .eq{font-family:var(--mono);font-weight:700;font-size:1.35rem;letter-spacing:.02em;color:var(--ink)}
.formula dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:.92rem}
.formula dt{font-family:var(--mono);font-weight:700;color:var(--teal)}
.formula dd{margin:0;color:var(--ink)}

/* seviye seçici */
.levels{margin:0 20px 12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:5px}
.lv{appearance:none;border:0;border-radius:11px;background:transparent;color:var(--muted);font:600 .9rem var(--body);padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.2}
.lv .st{font-size:.75rem;letter-spacing:.1em;color:var(--sun)}
.lv[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.lv.got::after{content:"✓";font-size:.7rem;color:var(--teal)}
.lv[aria-pressed="true"].got::after{color:var(--eye)}
.lv:focus-visible{outline:3px solid var(--teal);outline-offset:1px}

.task{margin:0 20px 14px;border-radius:16px;background:var(--accent-soft);border:2px solid var(--accent);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.boss .task{background:var(--boss-soft);border-color:var(--boss)}
.task .lbl{font-family:var(--display);font-weight:800;font-size:1.05rem;color:var(--accent);display:flex;align-items:center;gap:8px}
.boss .task .lbl{color:var(--boss)}
.task p{margin:0;font-weight:500}
.harder{align-self:flex-start;appearance:none;background:none;border:0;padding:2px 0;color:var(--accent);font:600 .9rem var(--body);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.boss .harder{color:var(--boss)}

.answer{padding:0 20px 20px;display:flex;flex-direction:column;gap:10px}
.answer label{font-weight:600;font-size:.92rem}
textarea,.code input{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px;font:inherit;background:var(--paper);color:var(--ink)}
textarea{min-height:96px;resize:vertical}
textarea:focus-visible,.code input:focus-visible{outline:3px solid var(--teal);outline-offset:1px;border-color:var(--teal)}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{appearance:none;border:2px solid var(--ink);border-radius:14px;padding:10px 16px;font:600 .95rem var(--body);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;background:var(--card);color:var(--ink);box-shadow:3px 3px 0 var(--ink);transition:transform .12s, box-shadow .12s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.done{background:var(--teal);color:var(--card)}
.btn[aria-disabled="true"]{opacity:.5;pointer-events:none}
.note{font-size:.82rem;color:var(--muted);margin:0}
.linkbtn{appearance:none;background:none;border:0;padding:0;color:var(--teal);font:600 .82rem var(--body);cursor:pointer;text-decoration:underline}

/* kilit kartı */
.locked{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;border:2px dashed var(--locked);border-radius:20px;padding:16px 18px;background:var(--card)}
.locked h3{font-size:1.25rem;font-weight:700}
.locked p{margin:2px 0 0;color:var(--muted);font-size:.93rem}
.sleepy{width:76px;height:82px;position:relative}
.sleepy svg{width:100%;height:100%}
.zz{position:absolute;right:-4px;top:-6px;font-family:var(--display);font-weight:800;color:var(--muted);animation:zz 2.4s ease-in-out infinite}
.zz:nth-child(3){animation-delay:.8s;right:8px;font-size:.8rem}
@keyframes zz{0%{transform:translate(0,6px);opacity:0}30%{opacity:1}100%{transform:translate(10px,-18px);opacity:0}}
.code{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.code input{flex:1 1 160px;min-width:0;font-family:var(--mono);font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:10px 12px}
.msg{grid-column:1/-1;margin:0;font-size:.88rem;min-height:1.2em}
.msg.err{color:var(--err)} .msg.ok{color:var(--teal)}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* harita */
.map h3{font-size:1.3rem;font-weight:800;margin-bottom:10px}
.chapter{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.chapter .cl{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.nodes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.node{aspect-ratio:1;max-width:100%;border-radius:50%;border:2px solid var(--locked);background:var(--card);display:grid;place-items:center;font:700 .95rem var(--display);color:var(--muted);position:relative;font-variant-numeric:tabular-nums;padding:0}
.node.boss{border-radius:14px}
.node.open{border-color:var(--ink);color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.node.open.boss{border-color:var(--boss);color:var(--boss);box-shadow:2px 2px 0 var(--boss)}
.node.done{background:var(--teal);border-color:var(--teal);color:var(--card);box-shadow:none}
.node.current{outline:3px solid var(--accent);outline-offset:2px}
.node.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.node:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.node svg{width:42%;height:42%}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;border:2px solid var(--locked);display:inline-block}
.legend i.o{border-color:var(--ink)} .legend i.d{background:var(--teal);border-color:var(--teal)}

@media (max-width:440px){ .m-head h2{font-size:1.45rem} .lv{font-size:.82rem} }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><small>Her gün bir bilim görevi</small><h1>Mert'in Bilim Görevleri</h1></div>
    <div class="score" aria-live="polite">
      <svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path fill="var(--sun)" stroke="var(--ink)" stroke-width="1.5" stroke-linejoin="round" d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z"/></svg>
      <span id="score">0 yıldız</span>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Volt ve Pi'nin bilim adası">
    <div class="fallback" aria-hidden="true">
      <svg viewBox="0 0 150 160"><g class="volt">
        <line x1="75" y1="34" x2="75" y2="18" stroke="var(--ink)" stroke-width="3"/>
        <circle cx="75" cy="14" r="7" fill="var(--accent)" stroke="var(--ink)" stroke-width="2.5"/>
        <rect x="32" y="34" width="86" height="66" rx="20" fill="var(--robot)" stroke="var(--ink)" stroke-width="3"/>
        <rect x="44" y="46" width="62" height="40" rx="12" fill="var(--screen)"/>
        <rect x="56" y="58" width="10" height="16" rx="5" fill="var(--eye)"/><rect x="84" y="58" width="10" height="16" rx="5" fill="var(--eye)"/>
        <rect x="44" y="102" width="62" height="40" rx="14" fill="var(--robot)" stroke="var(--ink)" stroke-width="3"/>
        <circle cx="75" cy="121" r="8" fill="var(--sun)" stroke="var(--ink)" stroke-width="2.5"/>
        <rect x="54" y="140" width="14" height="10" rx="4" fill="var(--robot-dark)" stroke="var(--ink)" stroke-width="2.5"/>
        <rect x="82" y="140" width="14" height="10" rx="4" fill="var(--robot-dark)" stroke="var(--ink)" stroke-width="2.5"/>
      </g></svg>
    </div>
    <span class="hint3d" id="hint3d" hidden>Sürükle ve adayı çevir</span>
    <div class="burst" id="burst"></div>
    <div class="bubble"><b>Volt:</b> <span id="say"></span></div>
  </section>

  <main id="today"></main>
  <section id="lockedSlot"></section>

  <section class="map" aria-label="Görev haritası">
    <h3>Görev haritası</h3>
    <div id="chapters"></div>
    <div class="legend"><span><i class="d"></i>Tamamlandı</span><span><i class="o"></i>Açık</span><span><i></i>Kilitli</span></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>

/* ---------- şifre çözme (kod = babanın WhatsApp'tan verdiği anahtar) ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const normCode = s => s.toUpperCase().replace(/[^A-Z0-9ÇĞİÖŞÜ]/g, "");
async function decryptDay(entry, code){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(normCode(code)), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(entry.salt), iterations:120000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(entry.iv)}, key, b64(entry.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function restoreUnlocked(){
  for(const e of LOCKED_DAYS){
    if(e.n !== latest() + 1) break;
    const c = codes[e.n]; if(!c) break;
    try{ days.push(await decryptDay(e, c)); }catch(err){ delete codes[e.n]; store.set("mert.codes", codes); break; }
  }
}

  return s;
}

const NOTIFY_TOPIC = "mert-bilim-c657911459e06fadccd4";
const AUTO = NOTIFY_TOPIC.length > 0 && !NOTIFY_TOPIC.startsWith("/*");
let outbox = store.get("mert.outbox", []);
async function flushOutbox(){
  if(!AUTO || !outbox.length) return;
  const rest = [];
  for(const m of outbox){
    try{
      const r = await fetch("https://ntfy.sh/", {method:"POST", body:JSON.stringify(Object.assign({topic:NOTIFY_TOPIC}, m))});
      if(!r.ok) throw new Error(r.status);
    }catch(e){ rest.push(m); }
  }
  outbox = rest; store.set("mert.outbox", outbox);
  return rest.length === 0;
}
function notifyDad(title, message, tags){
  if(!AUTO) return Promise.resolve(false);
  outbox.push({title, message, tags: tags || [], priority: 4}); store.set("mert.outbox", outbox);
  return flushOutbox();
}

      '<path d="M54 68 q6 5 12 0 M84 68 q6 5 12 0" stroke="var(--eye)" stroke-width="3" fill="none" stroke-linecap="round"/>' +
      '<rect x="44" y="102" width="62" height="40" rx="14" fill="var(--locked)" stroke="var(--muted)" stroke-width="3"/></svg>' +
      '<span class="zz">Z</span><span class="zz">z</span></div>' +
      "<div><h3>Gün " + next + " kilitli</h3><p>" + (entry ? "Babandan gelen kilit kodunu yaz, görev açılsın." : "Bu görev henüz hazırlanıyor. Yakında eklenecek.") + "</p></div>" +
      (entry ? '<form class="code" id="codeform"><label for="codein" hidden>Kilit kodu</label><input id="codein" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ÖRNEK: ATOM-12"><button class="btn primary" type="submit">Kilidi aç</button></form><p class="msg" id="codemsg" aria-live="polite"></p>' : "") +
    "</div>";
  const f = document.getElementById("codeform");
  if(f) f.addEventListener("submit", async ev => {
    ev.preventDefault();
    const val = document.getElementById("codein").value.trim(), m = document.getElementById("codemsg");
    if(!val){ m.className = "msg err"; m.textContent = "Önce kodu yaz."; return; }
    m.className = "msg"; m.textContent = "Kod kontrol ediliyor…";
    try{
      const d = await decryptDay(entry, val);
      codes[entry.n] = val; store.set("mert.codes", codes);
      days.push(d); selected = d.n;
      notifyDad("Mert Gün " + d.n + "'i açtı", d.title, ["unlock"]);
      celebrate(); renderToday(); renderLocked(); renderMap();
      document.getElementById("today").scrollIntoView({behavior:"smooth", block:"start"});
    }catch(err){
      m.className = "msg err"; m.textContent = "Bu kod Gün " + entry.n + "'yi açmadı. Harfleri ve rakamları kontrol et.";
      const c = document.getElementById("lockcard"); c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake");
    }
  });
}

/* ---------- harita ---------- */
function renderMap(){
  const host = document.getElementById("chapters");
  const open = new Set(days.map(d => d.n));
  const groups = [[1,7,"Bölüm 1 · Hız ve hareket"],[8,14,"Bölüm 2 · Yerçekimi ve kuvvet"],[15,21,"Bölüm 3 · Enerji, elektrik, ışık"],[22,28,"Bölüm 4 · Ses, olasılık, geometri"],[29,30,"Final"]];
  host.innerHTML = groups.map(([a,b,label]) => {
    let nodes = "";
    for(let n=a;n<=b;n++){
      const isBoss = BOSS.includes(n), isOpen = open.has(n), isDone = dayDone(n);
      const cls = ["node", isBoss?"boss":"", isOpen?"open":"", isDone?"done":"", n===latest()?"current":"", n===selected && isOpen?"sel":""].filter(Boolean).join(" ");
      const inner = isOpen ? (isDone ? "✓" : n) : (isBoss ? crown : lockSvg);
      nodes += isOpen
        ? '<button type="button" class="' + cls + '" data-n="' + n + '" aria-label="Gün ' + n + (isDone?" tamamlandı":"") + '">' + inner + "</button>"
        : '<div class="' + cls + '" aria-label="Gün ' + n + ' kilitli">' + inner + "</div>";
    }
    return '<div class="chapter"><div class="cl">' + label + '</div><div class="nodes">' + nodes + "</div></div>";
  }).join("");
  host.querySelectorAll("button.node").forEach(btn => btn.addEventListener("click", () => {
    selected = +btn.dataset.n; renderToday(); renderMap();
    document.getElementById("today").scrollIntoView({behavior:"smooth", block:"start"});
  }));
}

function say(t){ document.getElementById("say").textContent = t; }

/* ---------- 3B dünya ---------- */
const world = {};
function celebrate(){
  const b = document.getElementById("burst"); b.innerHTML = "";
  for(let i=0;i<14;i++){
    const a = (Math.PI*2*i)/14, r = 90 + Math.random()*50, s = document.createElement("i");
    s.style.setProperty("--x", Math.cos(a)*r + "px"); s.style.setProperty("--y", Math.sin(a)*r + "px"); b.appendChild(s);
  }
  world.jump && world.jump();
}

function init3D(){
  const stage = document.getElementById("stage");
  if(!window.THREE || !THREE.GLTFLoader) return;
  let renderer;
  try{ renderer = new THREE.WebGLRenderer({antialias:true, alpha:true}); }catch(e){ return; }
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.prepend(renderer.domElement);
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(34, 1, 0.1, 100);
  const target = new THREE.Vector3(0, 0.95, 0);
  scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x8a6f9e, 0.9));
  const sun = new THREE.DirectionalLight(0xfff1de, 1.6); sun.position.set(4, 8, 5); sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024); Object.assign(sun.shadow.camera, {left:-4, right:4, top:4, bottom:-4}); sun.shadow.bias = -0.0008;
  scene.add(sun);
  const rim = new THREE.DirectionalLight(0xffb27a, 0.7); rim.position.set(-2, 4, -5); scene.add(rim);

  // yıldızlar (gece temasında belirgin)
  const sg = new THREE.BufferGeometry(), sp = [];
  for(let i=0;i<120;i++){ const a = Math.random()*Math.PI*2, r = 14 + Math.random()*8; sp.push(Math.cos(a)*r, 2 + Math.random()*10, Math.sin(a)*r); }
  sg.setAttribute("position", new THREE.Float32BufferAttribute(sp, 3));
  const starsObj = new THREE.Points(sg, new THREE.PointsMaterial({color:0xfff4c2, size:0.12, transparent:true, opacity:.85}));
  scene.add(starsObj);

  const root = new THREE.Group(); scene.add(root);
  const N = {};
  let t0 = performance.now(), jumpAt = -10, spinAt = -10, yaw = -0.35, yawVel = 0, dragging = false, lastX = 0, autoYaw = true;

  new THREE.GLTFLoader().load("mert_dunyasi.json", gltf => {
    const m = gltf.scene;
    m.traverse(o => {
      if(o.name) N[o.name] = o;
      if(o.isMesh){ o.castShadow = true; o.receiveShadow = true; if(o.material && o.material.emissive && o.material.emissiveIntensity) o.material.emissiveIntensity = Math.min(o.material.emissiveIntensity, 2.5); }
    });
    root.add(m);
    N.base = {}; ["Volt","Pi_Yorunge","Volt_Kafa","Volt_Kol_Sag","Gezegen","Cisim_Ikosahedron","Cisim_Kup","Cisim_Piramit","Cisim_Torus"].forEach(k => {
      if(N[k]) N.base[k] = {p:N[k].position.clone(), r:N[k].rotation.clone()};
    });
    stage.classList.add("ready");
    document.getElementById("hint3d").hidden = false;
    setTimeout(() => { document.getElementById("hint3d").hidden = true; }, 5000);
  }, undefined, () => { renderer.domElement.remove(); });

  function resize(){
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false); cam.aspect = w / h;
    const dist = w < 480 ? 8.6 : 7.4;
    cam.position.set(0, 2.9, dist); cam.lookAt(target); cam.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage); resize();

  const el = renderer.domElement;
  el.addEventListener("pointerdown", e => { dragging = true; autoYaw = false; lastX = e.clientX; el.setPointerCapture(e.pointerId); });
  el.addEventListener("pointermove", e => { if(!dragging) return; const dx = e.clientX - lastX; lastX = e.clientX; yawVel = dx * 0.008; yaw += yawVel; });
  el.addEventListener("pointerup", () => { dragging = false; });
  el.addEventListener("pointercancel", () => { dragging = false; });
  el.addEventListener("click", () => { world.jump(); });

  world.jump = () => { jumpAt = (performance.now() - t0) / 1000; };
  world.spin = () => { spinAt = (performance.now() - t0) / 1000; };

  const dark = () => { const a = document.documentElement.dataset.theme; return a ? a === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; };
  let visible = true;
  new IntersectionObserver(es => { visible = es[0].isIntersecting; }).observe(stage);

  function frame(now){
    requestAnimationFrame(frame);
    if(!visible) return;
    const t = (now - t0) / 1000, B = N.base || {};
    const nightOn = dark();
    starsObj.material.opacity = nightOn ? .9 : .25;
    sun.intensity = nightOn ? 1.0 : 1.6;
    if(!dragging){ yawVel *= 0.92; yaw += yawVel; if(autoYaw && !reduce) yaw = -0.35 + Math.sin(t * 0.25) * 0.35; }
    root.rotation.y = yaw;
    if(N.Volt && B.Volt){
      const jt = t - jumpAt, jump = jt >= 0 && jt < 1 ? Math.sin(jt * Math.PI) * 0.75 : 0;
      const st = t - spinAt, spin = st >= 0 && st < 1.2 ? (1 - Math.cos(st / 1.2 * Math.PI)) * Math.PI : 0;
      N.Volt.position.y = B.Volt.p.y + (reduce ? 0 : Math.sin(t * 2.4) * 0.04) + jump;
      N.Volt.rotation.y = B.Volt.r.y + spin + (jt >= 0 && jt < 1 ? jt * Math.PI * 2 : 0);
    }
    if(N.Volt_Kafa && B.Volt_Kafa && !reduce){ N.Volt_Kafa.rotation.z = B.Volt_Kafa.r.z + Math.sin(t * 1.3) * 0.06; N.Volt_Kafa.rotation.y = B.Volt_Kafa.r.y + Math.sin(t * 0.7) * 0.12; }
    const blink = (t % 4.2) > 4.05 ? 0.12 : 1;
    ["Volt_Goz_Sol","Volt_Goz_Sag"].forEach(k => { if(N[k]) N[k].scale.y = blink; });
    if(N.Volt_Kol_Sag && B.Volt_Kol_Sag && !reduce){ const w = t % 3.2; N.Volt_Kol_Sag.rotation.z = B.Volt_Kol_Sag.r.z + (w < 1.2 ? Math.sin(w * Math.PI * 2.5) * 0.35 : 0); }
    if(N.Volt_Anten_Isik && N.Volt_Anten_Isik.material) N.Volt_Anten_Isik.material.emissiveIntensity = 1.2 + Math.sin(t * 4) * 0.9;
    if(N.Pi_Yorunge && !reduce){ const fast = (t - jumpAt) >= 0 && (t - jumpAt) < 1.5 ? 4 : 1; N.Pi_Yorunge.rotation.y += 0.012 * fast; N.Pi_Yorunge.position.y = B.Pi_Yorunge.p.y + Math.sin(t * 1.8) * 0.06; }
    ["Cisim_Ikosahedron","Cisim_Kup","Cisim_Piramit","Cisim_Torus"].forEach((k, i) => {
      if(!N[k] || !B[k] || reduce) return;
      N[k].position.y = B[k].p.y + Math.sin(t * 1.1 + i * 1.7) * 0.12;
      N[k].rotation.y = B[k].r.y + t * (0.5 + i * 0.15);
    });
    if(N.Gezegen && !reduce) N.Gezegen.rotation.y = t * 0.05;
    renderer.render(scene, cam);
  }
  requestAnimationFrame(frame);
}

(async function start(){
  await restoreUnlocked();
  selected = latest();
  renderScore(); renderToday(); renderLocked(); renderMap();
  try{ init3D(); }catch(e){}
  flushOutbox();
})();
</script>
