r."], "biliyor": "ALMA'nın bulunduğu yükseklikte hava o kadar incedir ki orada çalışanlar zaman zaman oksijen desteği kullanır.", "sorular": [{"s": "Atacama Çölü büyük ölçüde hangi ülkededir?", "c": ["Arjantin", "Peru", "Şili", "Bolivya"], "d": 2, "a": "Şili'nin kuzeyindedir."}, {"s": "NASA Atacama'yı neden kullanır?", "c": ["Roket fırlatmak için", "Mars için alet denemek için", "Uydu kurtarmak için", "Buzul ölçmek için"], "d": 1, "a": "Toprağı Mars'a benzediği için alet denemelerinde kullanılır."}, {"s": "Yağışlı yıllarda Atacama'da görülen olaya ne denir?", "c": ["Kum fırtınası", "Çiçekli çöl", "Tuz gölü", "Kutup ışığı"], "d": 1, "a": "Bu olaya \"çiçekli çöl\" denir."}], "sohbet": "Çok sıcak bir çöl mü, karlı bir dağ mı; bir gece geçirmek için hangisini seçerdiniz?"}, {"n": 39, "kategori": "Edebiyat", "sahne": "safak", "baslik": "Robinson Crusoe'nun gerçek adası", "okuma": ["Daniel Defoe'nun 1719'da yayımlanan Robinson Crusoe romanı, ıssız bir adada yıllarca tek başına yaşayan bir denizcinin hikâyesini anlatır. Roman kısa sürede çok sevildi ve sayısız dile çevrildi.", "Hikâyenin ilham kaynaklarından birinin İskoç denizci Alexander Selkirk olduğu kabul edilir. Selkirk, 1704'te Şili açıklarındaki Juan Fernández Adaları'ndan Más a Tierra'da kendi isteğiyle karaya bırakıldı.", "Adada yaklaşık dört buçuk yıl yalnız yaşadı. 1709'da oradan geçen bir gemi tarafından kurtarıldı; bu gemide ünlü denizci William Dampier de vardı.", "Selkirk'in yaşadığı adanın adı 1966'da Şili tarafından \"Robinson Crusoe Adası\" olarak değiştirildi. Yakındaki başka bir ada da \"Alejandro Selkirk Adası\" adını aldı. Defoe'nun kahramanı ise romanda adada tam yirmi sekiz yıl geçirir."], "biliyor": "Robinson Crusoe Adası, Şili kıyısındaki San Antonio limanının yaklaşık 670 kilometre batısında, Pasifik Okyanusu'nun ortasındadır.", "sorular": [{"s": "Robinson Crusoe romanının yazarı kimdir?", "c": ["Jonathan Swift", "Daniel Defoe", "Jules Verne", "Charles Dickens"], "d": 1, "a": "Daniel Defoe 1719'da yayımladı."}, {"s": "Alexander Selkirk adada yaklaşık ne kadar yaşadı?", "c": ["Altı ay", "Dört buçuk yıl", "On yıl", "Yirmi yıl"], "d": 1, "a": "1704'ten 1709'a, yaklaşık dört buçuk yıl."}, {"s": "Selkirk'in adası bugün hangi ülkeye bağlıdır?", "c": ["Peru", "Arjantin", "Şili", "Ekvador"], "d": 2, "a": "Juan Fernández Adaları Şili'ye bağlıdır."}], "sohbet": "Issız bir adaya yalnızca üç şey götürebilseydiniz, neleri seçerdiniz?"}, {"n": 40, "kategori": "Müzik", "sahne": "vadi", "baslik": "Sazıyla yurdu dolaşan ozan: Âşık Veysel", "okuma": ["Âşık Veysel Şatıroğlu 1894'te Sivas'ın Şarkışla ilçesine bağlı Sivrialan köyünde doğdu. Çocukluğunda geçirdiği çiçek hastalığı ve ardından yaşadığı bir kaza yüzünden gözlerini kaybetti.", "Gözlerini kaybettikten sonra babası onu oyalamak için ona bir saz hediye etti. Veysel zamanla halk ozanlarının deyişlerini öğrendi, sonra kendi türkülerini söylemeye başladı.", "Sözleri sade ama derindi; toprağı, insanı, sevgiyi ve hayatın geçiciliğini anlattı. Bir süre Köy Enstitülerinde saz öğretmenliği yaptı ve yurdu köy köy dolaştı.", "1965'te Türkiye Büyük Millet Meclisi, ana dilimize hizmetleri nedeniyle ona özel bir kanunla aylık bağladı. 21 Mart 1973'te doğduğu köyde öldü ve orada toprağa verildi. Türküleri bugün de pek çok sanatçı tarafından seslendiriliyor."], "biliyor": "Âşık Veysel'in Sivrialan'da hayatını kaybettiği ev bugün müze olarak hizmet veriyor.", "sorular": [{"s": "Âşık Veysel hangi ilimizde doğdu?", "c": ["Erzurum", "Sivas", "Kars", "Kayseri"], "d": 1, "a": "Sivas'ın Şarkışla ilçesine bağlı Sivrialan köyünde doğdu."}, {"s": "Âşık Veysel bir süre nerede saz öğretmenliği yaptı?", "c": ["Konservatuvarda", "Köy Enstitülerinde", "Radyoda", "Üniversitede"], "d": 1, "a": "Köy Enstitülerinde saz öğretti."}, {"s": "TBMM ona hangi yıl özel kanunla aylık bağladı?", "c": ["1938", "1950", "1965", "1973"], "d": 2, "a": "1965'te özel bir kanunla aylık bağlandı."}], "sohbet": "Size çocukluğunuzu ya da memleketinizi hatırlatan bir türkü var mı?"}, {"n": 41, "kategori": "Felsefe", "sahne": "deniz", "baslik": "Toplumların yükselişini ve düşüşünü düşünen bilgin: İbn Haldun", "okuma": ["İbn Haldun 1332'de Tunus'ta doğdu. Gençliğinde Kuzey Afrika ve Endülüs'teki saraylarda devlet görevlerinde bulundu; siyasetin iniş çıkışlarını yakından gördü.", "1375'ten itibaren bugünkü Cezayir'deki Kal'at İbn Selâme kalesinde dört yıl kadar inzivaya çekildi. Burada büyük tarih kitabına giriş olarak \"Mukaddime\"yi yazdı.", "Mukaddime'nin merkezinde \"asabiyye\" kavramı vardır; bu, bir topluluğu bir arada tutan dayanışma ruhudur. İbn Haldun'a göre güçlü dayanışma bir topluluğu iktidara taşır, bu bağ zayıfladığında ise devlet çökmeye başlar.", "Hayatının son yıllarını Kahire'de kadılık yaparak geçirdi ve 1406'da orada öldü. Tarihçi Arnold Toynbee, Mukaddime'yi türünün en büyük eseri olarak niteler. Bu yüzden İbn Haldun kimi zaman sosyolojinin öncülerinden biri olarak anılır."], "biliyor": "İbn Haldun, 1400'de Şam kuşatması sırasında surlardan iplerle sarkıtılarak Timur'la görüşmeye gitmiş ve haftalarca onun ordugâhında kalmıştır.", "sorular": [{"s": "İbn Haldun hangi şehirde doğdu?", "c": ["Kahire", "Bağdat", "Tunus", "Fes"], "d": 2, "a": "1332'de Tunus'ta doğdu."}, {"s": "Mukaddime'nin merkezindeki dayanışma kavramına ne denir?", "c": ["Asabiyye", "Fütüvvet", "Ahilik", "İrfan"], "d": 0, "a": "Bu kavram \"asabiyye\"dir."}, {"s": "İbn Haldun hayatının son yıllarını nerede geçirdi?", "c": ["Şam", "Kahire", "İstanbul", "Endülüs"], "d": 1, "a": "Kahire'de kadılık yaptı ve orada öldü."}], "sohbet": "Sizce bir aileyi ya da arkadaş grubunu yıllarca bir arada tutan şey nedir?"}, {"n": 42, "kategori": "Haftanın tekrarı", "sahne": "tepeler", "baslik": "Altıncı haftanın küçük sınavı", "okuma": ["Bu hafta Tophane sırtlarındaki gözlemevinden Sistina Şapeli'nin tavanına, Atacama'nın kurak kumlarından Selkirk'in ıssız adasına, Âşık Veysel'in sazından İbn Haldun'un Mukaddime'sine uzandınız.", "Altı hafta geride kaldı. Aşağıdaki beş soruyla bu haftayı tazeleyin."], "biliyor": "Bir bilgiyi başkasına anlatmak, onu kendi zihnimizde de pekiştirir; öğretmek, öğrenmenin en etkili yollarından biri sayılır.", "sorular": [{"s": "Takiyüddin'in İstanbul'daki gözlemevi hangi yıl kapatıldı?", "c": ["1577", "1580", "1600", "1650"], "d": 1, "a": "Kurulduktan yalnızca birkaç yıl sonra, 1580'de kapatıldı."}, {"s": "Islak sıvaya boyayla yapılan, Sistina tavanında kullanılan tekniğe ne denir?", "c": ["Mozaik", "Fresk", "Gravür", "Vitray"], "d": 1, "a": "Bu tekniğe fresk denir."}, {"s": "Atacama'da Mars görevleri için alet deneyen kurum hangisidir?", "c": ["NASA", "CERN", "WHO", "UNESCO"], "d": 0, "a": "Toprağı Mars'a benzediği için NASA aletlerini orada dener."}, {"s": "Âşık Veysel bir süre nerede saz öğretmenliği yaptı?", "c": ["Konservatuvarda", "Köy Enstitülerinde", "Radyoda", "Üniversitede"], "d": 1, "a": "Köy Enstitülerinde saz öğretti."}, {"s": "İbn Haldun'un topluluğu bir arada tutan dayanışma ruhuna verdiği ad nedir?", "c": ["Asabiyye", "Fütüvvet", "Ahilik", "İrfan"], "d": 0, "a": "Mukaddime'nin merkezindeki kavram asabiyyedir."}], "sohbet": "Bu haftanın meraklarından hangisi size en çok şaşırttı?"}, {"n": 43, "kategori": "Bilim tarihi", "sahne": "deniz", "baslik": "Ceylan derisine çizilen dünya: Piri Reis haritası", "okuma": ["Osmanlı denizcisi Piri Reis, 1513'te ceylan derisi üzerine bir dünya haritası çizdi ve onu 1517'de Yavuz Sultan Selim'e sundu.", "Haritanın bugüne yaklaşık üçte biri ulaşmıştır. Bu parçada Afrika'nın batı kıyıları, Güney Amerika'nın doğu kıyıları ve Atlas Okyanusu'ndaki adalar görülür. Haritada pusula gülleri, gemi ve hayvan resimleri de yer alır.", "Piri Reis haritanın kenarına düştüğü notlarda, yirmiden fazla eski haritadan yararlandığını yazar. Bunların arasında Kristof Kolomb'a ait bir harita da vardır; bu yüzden harita, kaybolmuş bir Kolomb haritasının izlerini taşıdığı için de değerlidir.", "Harita yüzyıllarca unutuldu. 1929'da Topkapı Sarayı'nın kütüphanesinde, Alman bilgin Gustav Adolf Deissmann tarafından bulundu. Bugün yine Topkapı Sarayı Müzesi'nde korunur."], "biliyor": "Piri Reis'in Akdeniz'in limanlarını ve adalarını anlatan \"Kitab-ı Bahriye\" adlı eserinin gözden geçirilmiş bir nüshası, 1520'lerde Kanuni Sultan Süleyman'a sunulmuştur.", "sorular": [{"s": "Piri Reis haritası hangi malzemenin üzerine çizilmiştir?", "c": ["Papirüs", "Ceylan derisi", "İpek", "Bakır levha"], "d": 1, "a": "Ceylan derisinden yapılmış bir parşömen üzerine çizilmiştir."}, {"s": "Harita hangi yıl Topkapı Sarayı'nda yeniden bulundu?", "c": ["1856", "1908", "1929", "1960"], "d": 2, "a": "1929'da sarayın kütüphanesinde bulundu."}, {"s": "Piri Reis notlarında hangi kâşifin haritasından yararlandığını yazar?", "c": ["Marco Polo", "Kristof Kolomb", "Vasco da Gama", "Macellan"], "d": 1, "a": "Kolomb'a ait bir haritadan yararlandığını belirtir."}], "sohbet": "Hiç eski bir harita ya da aile fotoğrafı bulup saatlerce incelediğiniz oldu mu?"}, {"n": 44, "kategori": "Mimari", "sahne": "safak", "baslik": "Bir imparatorun eşine bıraktığı beyaz mermer: Tac Mahal", "okuma": ["Babür İmparatoru Şah Cihan'ın çok sevdiği eşi Mümtaz Mahal 1631'de öldü. Yasa boğulan imparator, onun için eşi benzeri olmayan bir türbe yaptırmaya karar verdi.", "Hindistan'ın Agra şehrinde, Yamuna Nehri kıyısında yükselen Tac Mahal'in ana türbesi 1648'de tamamlandı; çevresindeki yapılarla birlikte bütün külliye 1650'lerin başında bitti. Kubbesiyle birlikte türbenin yüksekliği yaklaşık 44 metreyi bulur.", "İnşaatta yaklaşık yirmi bin işçinin ve bin kadar filin çalıştığı aktarılır. Türbe beyaz mermerden yapıldı; mermere renkli taşlar işlendi. Çevredeki yapılarda ise kırmızı kum taşı kullanıldı.", "Mimarın kim olduğu kesin bilinmez; tarihçiler Üstad Ahmed Lahorî'nin baş rolü oynadığını düşünür. Şah Cihan da öldükten sonra eşinin yanına gömüldü. Tac Mahal 1983'te UNESCO Dünya Mirası listesine alındı."], "biliyor": "Tac Mahal'in mermeri günün saatine göre renk değiştirir gibidir: Şafakta pembemsi, öğlen bembeyaz, ay ışığında ise gümüşi bir tona büründüğü anlatılır.", "sorular": [{"s": "Tac Mahal hangi ülkededir?", "c": ["Pakistan", "İran", "Hindistan", "Bangladeş"], "d": 2, "a": "Hindistan'ın Agra şehrindedir."}, {"s": "Tac Mahal kimin anısına yaptırıldı?", "c": ["Mümtaz Mahal", "Nur Cihan", "Kraliçe Victoria", "Hürrem Sultan"], "d": 0, "a": "Şah Cihan'ın eşi Mümtaz Mahal için yaptırıldı."}, {"s": "Tac Mahal hangi nehrin kıyısındadır?", "c": ["Ganj", "İndus", "Yamuna", "Brahmaputra"], "d": 2, "a": "Yamuna Nehri kıyısındadır."}], "sohbet": "Sevdiğiniz biri için bir şey yaptırabilseydiniz, bu ne olurdu?"}, {"n": 45, "kategori": "Coğrafya", "sahne": "dag", "baslik": "Türkiye'nin çatısı: Ağrı Dağı", "okuma": ["Türkiye'nin doğu ucunda, İran ve Ermenistan sınırlarına yakın bir yerde yükselen Ağrı Dağı, 5.137 metreyle ülkemizin en yüksek zirvesidir.", "Dağ aslında iki volkanik koniden oluşur: Büyük Ağrı ve 3.896 metrelik Küçük Ağrı. İkisini yaklaşık 2.700 metre yükseklikteki Serdarbulak Beli birbirine bağlar.", "Zirvesinin yakınında Türkiye'nin en büyük buzulu bulunur. Bilinen ilk tırmanış 1829'da, Alman doğa bilimci Friedrich Parrot ve Ermeni yazar Haçatur Abovyan'ın içinde bulunduğu küçük bir ekiple yapıldı.", "Dağ, Nuh'un gemisinin tufandan sonra burada karaya oturduğuna dair anlatılarla da ünlüdür; ancak bunu doğrulayan bilimsel bir bulgu yoktur. Çevresi 2004'te milli park ilan edildi. Kışın zirve yakınında sıcaklık eksi yirmi dereceye kadar düşebilir; parkta yirmiden fazla endemik bitki türü yaşar."], "biliyor": "Ağrı Dağı'na tırmanmak için en uygun aylar temmuz ve ağustostur; tırmanış genellikle rehber eşliğinde dört ila altı gün sürer.", "sorular": [{"s": "Ağrı Dağı'nın yüksekliği yaklaşık kaç metredir?", "c": ["3.896", "4.434", "5.137", "5.642"], "d": 2, "a": "Büyük Ağrı 5.137 metredir."}, {"s": "Büyük ve Küçük Ağrı'yı birbirine bağlayan geçidin adı nedir?", "c": ["Serdarbulak Beli", "Zigana Geçidi", "Gülek Boğazı", "Kop Dağı"], "d": 0, "a": "İki koniyi Serdarbulak Beli bağlar."}, {"s": "Ağrı Dağı'na bilinen ilk tırmanış hangi yıl yapıldı?", "c": ["1729", "1829", "1929", "1953"], "d": 1, "a": "Friedrich Parrot ve ekibi 1829'da zirveye çıktı."}], "sohbet": "Hayatınızda çıktığınız en yüksek yer neresiydi, oradan neler gördünüz?"}, {"n": 46, "kategori": "Edebiyat", "sahne": "vadi", "baslik": "Bir pilotun çizdiği küçük prens", "okuma": ["Fransız pilot ve yazar Antoine de Saint-Exupéry, Küçük Prens'i İkinci Dünya Savaşı yıllarında Amerika'da yazdı. Kitap ilk kez Nisan 1943'te ABD'de, Fransızca ve İngilizce olarak yayımlandı. Fransa'daki baskısı ise ancak savaştan sonra, ülkenin kurtuluşunun ardından yapılabildi.", "Kitaptaki suluboya resimleri de yazarın kendisi yaptı. Hikâye, çölde uçağı arızalanan bir pilotla küçük bir gezegenden gelen bir çocuğun karşılaşmasını anlatır.", "Saint-Exupéry'nin kendisi de 1935'te Libya çölüne zorunlu iniş yapmış ve günlerce susuz kalmıştı; bu deneyimin kitaba ilham verdiği düşünülür. Hikâyedeki gülün ise yazarın eşi Consuelo'dan esinlendiği kabul edilir.", "31 Temmuz 1944'te Korsika'dan bir keşif uçuşuna çıktı ve geri dönmedi. Bugün Küçük Prens, beş yüzü aşkın dile ve lehçeye çevrilmiş, dünyanın en çok çevrilen kitaplarından biridir."], "biliyor": "Saint-Exupéry'nin gümüş künye bileziği, kayboluşundan 54 yıl sonra, 1998'de Marsilya açıklarında bir balıkçının ağına takıldı.", "sorular": [{"s": "Küçük Prens'in yazarının mesleği neydi?", "c": ["Gemici", "Pilot", "Doktor", "Öğretmen"], "d": 1, "a": "Saint-Exupéry aynı zamanda bir pilottu."}, {"s": "Küçük Prens ilk kez hangi yıl yayımlandı?", "c": ["1923", "1937", "1943", "1955"], "d": 2, "a": "Nisan 1943'te ABD'de yayımlandı."}, {"s": "Kitaptaki resimleri kim yaptı?", "c": ["Yazarın eşi", "Bir Disney çizeri", "Yazarın kendisi", "Yayınevi ressamı"], "d": 2, "a": "Suluboya resimleri Saint-Exupéry kendisi yaptı."}], "sohbet": "Çocukken okuduğunuz ve bugün yeniden okusanız farklı anlayacağınızı düşündüğünüz bir kitap var mı?"}, {"n": 47, "kategori": "Müzik", "sahne": "deniz", "baslik": "Hamamcının oğlu, saray bestecisi: Dede Efendi", "okuma": ["İsmail Dede Efendi 1778'de İstanbul'un Şehzadebaşı semtinde doğdu. Babası hamam işlettiği için \"Hammamîzâde\" diye anıldı.", "Gençliğinde Yenikapı Mevlevîhanesi'ne girdi, burada musiki eğitimi aldı ve 1801'de \"dede\" unvanını kazandı. Bestelediği bir eser III. Selim'in dikkatini çekti ve saraya çağrıldı. II. Mahmud döneminde de sarayda önemli görevler üstlendi.", "Beş yüzü aşkın eser bestelediği kabul edilir; bunların yaklaşık üç yüzünün notası günümüze ulaşmıştır. Mevlevî ayinleri, şarkıları ve ilahileriyle Türk musikisinin en büyük bestekârlarından biri sayılır. 1824 ile 1839 arasında yedi Mevlevî ayini besteledi; hüzzam ayini bu türün başyapıtlarından sayılır.", "Yetiştirdiği öğrenciler arasında Hacı Ârif Bey ve Zekâi Dede gibi ünlü isimler vardır. 1846'da hac yolculuğu sırasında hayatını kaybetti ve Mekke'de toprağa verildi."], "biliyor": "Dede Efendi, yalnızca eski makamlarda bestelemekle kalmamış, bazı makamları birleştirerek yeni terkipler de denemiştir.", "sorular": [{"s": "Dede Efendi neden \"Hammamîzâde\" diye anılır?", "c": ["Hamamda doğduğu için", "Babası hamam işlettiği için", "Hamamda beste yaptığı için", "Bir hamam yaptırdığı için"], "d": 1, "a": "Babası Süleyman Ağa hamam işletiyordu."}, {"s": "Dede Efendi musiki eğitimini hangi mevlevîhanede aldı?", "c": ["Galata", "Yenikapı", "Konya", "Bahariye"], "d": 1, "a": "Yenikapı Mevlevîhanesi'nde yetişti."}, {"s": "Onu ilk kez saraya çağıran padişah kimdir?", "c": ["III. Selim", "IV. Murad", "Abdülaziz", "II. Abdülhamid"], "d": 0, "a": "Bir bestesi III. Selim'in dikkatini çekti."}], "sohbet": "Size huzur veren, dinlerken zamanın nasıl geçtiğini unuttuğunuz bir müzik var mı?"}, {"n": 48, "kategori": "Felsefe", "sahne": "safak", "baslik": "Pamukkale'den çıkan köle filozof: Epiktetos", "okuma": ["Epiktetos yaklaşık MS 50'de, bugünkü Pamukkale'nin yanındaki antik Hierapolis kentinde doğdu. Genç yaşta köle olarak Roma'ya götürüldü.", "Efendisi Epaphroditos, onun Stoacı filozof Musonius Rufus'un derslerine katılmasına izin verdi. Epiktetos daha sonra özgürlüğüne kavuştu ve felsefe öğretmeye başladı.", "Yaklaşık MS 89'da İmparator Domitianus filozofları Roma'dan çıkarınca, Yunanistan'daki Nikopolis'e yerleşti ve orada bir okul açtı. Uzak yerlerden insanlar onu dinlemeye geldi.", "Kendisi hiçbir şey yazmadı. Öğrencisi Arrianos, derslerini \"Söylevler\" adıyla, öğretisinin özünü ise \"Enkheiridion\" yani \"El Kitabı\" adıyla kaleme aldı. Temel fikri şudur: İnsan, elinde olanla olmayanı ayırmalı ve yalnızca elinde olanla ilgilenmelidir. Ona göre özgürlük, olayların kendisinde değil, onlara nasıl baktığımızdadır. Yaklaşık MS 135'te öldüğü kabul edilir."], "biliyor": "Epiktetos'un öğretileri, yüzyıllar sonra Marcus Aurelius gibi düşünürleri de etkilemiştir.", "sorular": [{"s": "Epiktetos hangi antik kentte doğdu?", "c": ["Efes", "Hierapolis", "Bergama", "Milet"], "d": 1, "a": "Bugünkü Pamukkale'nin yanındaki Hierapolis'te doğdu."}, {"s": "Epiktetos'un derslerini yazıya geçiren öğrencisi kimdir?", "c": ["Platon", "Arrianos", "Seneca", "Plutarkhos"], "d": 1, "a": "Arrianos, Söylevler'i ve El Kitabı'nı derledi."}, {"s": "Epiktetos Roma'dan çıkarılınca nereye yerleşti?", "c": ["Atina", "İskenderiye", "Nikopolis", "Kartaca"], "d": 2, "a": "Yunanistan'daki Nikopolis'te okul açtı."}], "sohbet": "Elinizde olmayan bir şeye üzülmeyi bırakıp rahatladığınız bir an hatırlıyor musunuz?"}, {"n": 49, "kategori": "Haftanın tekrarı", "sahne": "tepeler", "baslik": "Yedinci haftanın küçük sınavı", "okuma": ["Bu hafta Piri Reis'in ceylan derisine çizdiği haritadan Tac Mahal'in mermerine, Ağrı Dağı'nın buzullarından Küçük Prens'in gezegenine, Dede Efendi'nin bestelerinden Epiktetos'un derslerine uzandınız.", "Yedi hafta geride kaldı. Aşağıdaki beş soruyla bu haftayı tazeleyin."], "biliyor": "Bir soruyu yanlış cevaplayıp ardından doğrusunu öğrenmek, bilginin akılda daha kalıcı olmasını sağlayabilir.", "sorular": [{"s": "Piri Reis haritası 1929'da nerede bulundu?", "c": ["Dolmabahçe Sarayı", "Topkapı Sarayı", "Süleymaniye Kütüphanesi", "Yıldız Sarayı"], "d": 1, "a": "Topkapı Sarayı'nın kütüphanesinde bulundu."}, {"s": "Tac Mahal'i yaptıran imparator kimdir?", "c": ["Ekber Şah", "Şah Cihan", "Babür Şah", "Evrengzib"], "d": 1, "a": "Babür İmparatoru Şah Cihan yaptırdı."}, {"s": "Türkiye'nin en yüksek dağı hangisidir?", "c": ["Erciyes", "Süphan", "Ağrı", "Kaçkar"], "d": 2, "a": "Ağrı Dağı 5.137 metredir."}, {"s": "Saint-Exupéry son uçuşuna nereden havalandı?", "c": ["Korsika", "Sicilya", "Kıbrıs", "Malta"], "d": 0, "a": "31 Temmuz 1944'te Korsika'dan havalandı."}, {"s": "Dede Efendi hangi şehirde toprağa verildi?", "c": ["İstanbul", "Konya", "Mekke", "Kahire"], "d": 2, "a": "Hac sırasında öldü ve Mekke'de toprağa verildi."}], "sohbet": "Bu hafta öğrendiklerinizden hangisini bir gün yerinde görmek isterdiniz?"}, {"n": 50, "kategori": "Bilim tarihi", "sahne": "vadi", "baslik": "Bir kuyumcunun icadı: Gutenberg İncili", "okuma": ["Alman kuyumcu Johannes Gutenberg, 1450'lerde Mainz şehrinde, metal harflerle çalışan bir baskı yöntemi geliştirdi. Harfler tek tek dökülüyor, dizilip mürekkeplenerek kâğıda basılıyordu.", "Bu yöntemle bastığı en ünlü eser Latince bir İncil'dir. Sayfaların çoğunda 42 satır bulunduğu için \"42 satırlı İncil\" diye de anılır. Bu buluş, kitapların elle kopyalanmasına göre çok daha hızlı ve ucuz çoğaltılmasını sağladı. İlk tamamlanmış nüshalar 1454 ya da 1455'te hazırdı.", "Yaklaşık 180 nüsha basıldığı tahmin edilir; bunların çoğu kâğıda, bir kısmı ise hayvan derisinden yapılmış parşömene basıldı. Bugün bunlardan 49'u en azından büyük ölçüde günümüze ulaşmıştır.", "Ne yazık ki Gutenberg icadından zengin olamadı. 1455'te ortağı Johann Fust'la arasındaki bir davayı kaybetti ve baskı araçlarının bir kısmını ona bırakmak zorunda kaldı."], "biliyor": "Hareketli harflerle baskı, Gutenberg'den çok önce Çin ve Kore'de de denenmişti; ancak Avrupa'da bu yöntemi yaygınlaştıran o oldu.", "sorular": [{"s": "Gutenberg baskı yöntemini hangi şehirde geliştirdi?", "c": ["Paris", "Mainz", "Venedik", "Londra"], "d": 1, "a": "Almanya'nın Mainz şehrinde geliştirdi."}, {"s": "Gutenberg İncili hangi dildedir?", "c": ["Almanca", "Yunanca", "Latince", "İbranice"], "d": 2, "a": "Latince bir İncil'dir."}, {"s": "Gutenberg İncili'nin günümüze yaklaşık kaç nüshası ulaşmıştır?", "c": ["7", "49", "180", "500"], "d": 1, "a": "Yaklaşık 49 nüsha günümüze ulaşmıştır."}], "sohbet": "Evinizde en uzun süredir duran ve hiç vazgeçemediğiniz kitap hangisi?"}, {"n": 51, "kategori": "Sanat", "sahne": "dag", "baslik": "Kaplumbağalara sabırla bakan adam: Osman Hamdi Bey", "okuma": ["Osman Hamdi Bey 1842'de İstanbul'da doğdu. Hukuk okumak için gittiği Paris'te resme yöneldi; Jean-Léon Gérôme ve Gustave Boulanger gibi ressamların yanında çalıştı. 1910'da İstanbul'da öldü.", "Yalnızca bir ressam değildi: 1881'de Müze-i Hümâyun'un, yani bugünkü İstanbul Arkeoloji Müzeleri'nin başına geçti; 1882'de ise Sanayi-i Nefise Mektebi'ni, yani bugünkü Mimar Sinan Güzel Sanatlar Üniversitesi'nin temelini kurdu.", "En ünlü tablosu 1906'da yaptığı \"Kaplumbağa Terbiyecisi\"dir. Tabloda, eski bir yapının üst katında, elinde ney tutan yaşlı bir adam önündeki kaplumbağalara bakar; sırtında ise bir nakkare asılıdır. Mekânın Bursa'daki Yeşil Cami olduğu, adamın da ressamın kendisi olabileceği düşünülür.", "Tablo 2004'te 3,5 milyon dolara satıldı ve bugün İstanbul'daki Pera Müzesi'nde sergileniyor."], "biliyor": "Osman Hamdi Bey, Sayda'da yaptığı kazılarda bulunan ve bugün İstanbul Arkeoloji Müzeleri'nde sergilenen ünlü İskender Lahdi'ni gün ışığına çıkaran ekibin başındaydı.", "sorular": [{"s": "Kaplumbağa Terbiyecisi tablosu bugün hangi müzede sergileniyor?", "c": ["İstanbul Modern", "Pera Müzesi", "Topkapı Sarayı", "Resim ve Heykel Müzesi"], "d": 1, "a": "İstanbul'daki Pera Müzesi'ndedir."}, {"s": "Osman Hamdi Bey'in 1882'de kurduğu okul hangisidir?", "c": ["Darülfünun", "Sanayi-i Nefise Mektebi", "Galatasaray Lisesi", "Mekteb-i Tıbbiye"], "d": 1, "a": "Bugünkü Mimar Sinan Güzel Sanatlar Üniversitesi'nin temelidir."}, {"s": "Tablodaki adamın elinde hangi çalgı vardır?", "c": ["Ud", "Bağlama", "Ney", "Kanun"], "d": 2, "a": "Elinde bir ney tutar."}], "sohbet": "Sabır gerektiren ama yapmaktan keyif aldığınız bir uğraşınız var mı?"}, {"n": 52, "kategori": "Coğrafya", "sahne": "deniz", "baslik": "Gürleyen duman: Victoria Şelalesi", "okuma": ["Afrika'nın güneyinde, Zambezi Nehri bir anda derin bir yarığa dökülür. Burası Zambiya ile Zimbabve'nin sınırında yer alan Victoria Şelalesi'dir.", "Şelale yaklaşık 1,7 kilometre genişliğindedir; suyun en yüksek düştüğü yerde yükseklik 108 metreyi bulur. Bu boyutlarıyla, dünyanın en büyük su perdelerinden biri sayılır. Genişliği, İstanbul Boğazı'nın en dar yerinin iki katından fazladır.", "Yöre halkı ona \"Mosi-oa-Tunya\", yani \"gürleyen duman\" der. Bol sulu mevsimde yükselen su zerrecikleri, 50 kilometreyi aşan uzaklıklardan bir duman bulutu gibi görülebilir.", "İskoç kâşif David Livingstone, 17 Kasım 1855'te şelaleyi gören ilk Avrupalı oldu ve ona Kraliçe Victoria'nın adını verdi. Şelalenin kıyısındaki küçük ada bugün onun adıyla anılır."], "biliyor": "Şelalenin hemen aşağısındaki derin boğazın üzerine 1905'te bir demiryolu köprüsü kuruldu; köprü bugün de iki ülkeyi birbirine bağlar.", "sorular": [{"s": "Victoria Şelalesi hangi nehrin üzerindedir?", "c": ["Nil", "Kongo", "Zambezi", "Nijer"], "d": 2, "a": "Zambezi Nehri üzerindedir."}, {"s": "\"Mosi-oa-Tunya\" ne anlama gelir?", "c": ["Büyük su", "Gürleyen duman", "Gökkuşağı kapısı", "Taş yatak"], "d": 1, "a": "Yerel dilde \"gürleyen duman\" demektir."}, {"s": "Şelaleyi gören ilk Avrupalı kimdir?", "c": ["Henry Morton Stanley", "David Livingstone", "Vasco da Gama", "James Cook"], "d": 1, "a": "İskoç kâşif David Livingstone, 1855'te."}], "sohbet": "Gördüğünüz en etkileyici doğa manzarası hangisiydi, o an neler hissetmiştiniz?"}, {"n": 53, "kategori": "Edebiyat", "sahne": "safak", "baslik": "Bir sözlüğün içindeki dünya: Divânu Lugâti't-Türk", "okuma": ["Kaşgarlı Mahmud, Türkçenin değerini Araplara anlatmak için büyük bir eser hazırladı. Bağdat'ta yazdığı Divânu Lugâti't-Türk'e 25 Ocak 1072'de başladı ve 10 Şubat 1074'te tamamladı.", "Eser yalnızca bir sözlük değildir. Kelimeleri açıklarken Türk boylarının yaşayışından, atasözlerinden ve dörtlüklerinden örnekler verir. Böylece dönemin Türk kültürüne açılan bir pencere olur. Binlerce maddeden oluşan eseri, Abbasi halifesinin oğlu Ebu'l-Kasım Abdullah'a sundu.", "İçinde, merkezine Balasagun'u koyan yuvarlak bir dünya haritası vardır. Bu harita, Türklerin hazırladığı bilinen ilk dünya haritası kabul edilir.", "Eserin günümüze ulaşan tek nüshası yüzyıllarca gözden uzak kaldı. 20. yüzyılın başında Ali Emirî Efendi onu bir sahaftan otuz altına satın aldı. Bugün İstanbul'daki Millet Kütüphanesi'nde korunur."], "biliyor": "Divânu Lugâti't-Türk'ün ilk baskısı, Kilisli Rifat Bilge tarafından üç cilt hâlinde yayımlandı.", "sorular": [{"s": "Kaşgarlı Mahmud eserini hangi şehirde yazdı?", "c": ["Kaşgar", "Bağdat", "Konya", "Semerkant"], "d": 1, "a": "Eseri Bağdat'ta yazdı."}, {"s": "Eserin tek nüshası bugün nerede korunuyor?", "c": ["Topkapı Sarayı", "Süleymaniye Kütüphanesi", "Millet Kütüphanesi", "Milli Kütüphane"], "d": 2, "a": "İstanbul'daki Millet Kütüphanesi'nde."}, {"s": "Eserdeki dünya haritasının merkezinde hangi şehir vardır?", "c": ["Bağdat", "Balasagun", "İstanbul", "Buhara"], "d": 1, "a": "Haritanın merkezinde Balasagun bulunur."}], "sohbet": "Ailenizde kuşaktan kuşağa aktarılan, sizin de çok sevdiğiniz bir söz ya da deyim var mı?"}, {"n": 54, "kategori": "Müzik", "sahne": "vadi", "baslik": "Kalbi Varşova'da kalan piyanist: Chopin", "okuma": ["Fryderyk Chopin 1 Mart 1810'da, Varşova yakınlarındaki Żelazowa Wola köyünde doğdu. Çok küçük yaşta piyano çalmaya ve beste yapmaya başladı.", "Yirmi yaşında Polonya'dan ayrıldı ve hayatının geri kalanını büyük ölçüde Paris'te geçirdi. Eserlerinin neredeyse tamamını piyano için yazdı; noktürnleri, mazurkaları ve polonezleriyle tanındı. Mazurka ve polonezlerde memleketinin halk danslarının izleri duyulur.", "Besteci Robert Schumann, onun ilk eserlerinden biri için yazdığı yazıda \"Şapkalarınızı çıkarın beyler, bir dâhi!\" demişti. Bu sözler, Chopin'in Mozart'ın Don Giovanni operasındaki bir ezgi üzerine yazdığı çeşitlemeler içindi.", "Chopin 17 Ekim 1849'da Paris'te öldü ve Père Lachaise Mezarlığı'na gömüldü. Ama dileği üzerine kalbi, ablası Ludwika tarafından Polonya'ya götürüldü. Bugün Varşova'daki Kutsal Haç Kilisesi'nde bir sütunun içinde durur."], "biliyor": "1927'den beri Varşova'da düzenlenen Uluslararası Chopin Piyano Yarışması'nda yarışmacılar yalnızca Chopin'in eserlerini çalar.", "sorular": [{"s": "Chopin eserlerini en çok hangi çalgı için yazdı?", "c": ["Keman", "Piyano", "Org", "Viyolonsel"], "d": 1, "a": "Neredeyse tüm eserleri piyano içindir."}, {"s": "Chopin hayatının büyük kısmını hangi şehirde geçirdi?", "c": ["Viyana", "Londra", "Paris", "Berlin"], "d": 2, "a": "Yirmi yaşından sonra çoğunlukla Paris'te yaşadı."}, {"s": "Chopin'in kalbi bugün nerede?", "c": ["Paris'te, mezarında", "Varşova'da bir kilisede", "Viyana'da bir müzede", "Krakov'da bir şatoda"], "d": 1, "a": "Varşova'daki Kutsal Haç Kilisesi'nde."}], "sohbet": "Uzakta olsanız bile kalbinizin hep kalacağı yer neresi?"}, {"n": 55, "kategori": "Felsefe", "sahne": "deniz", "baslik": "Gökyüzüne bakıp soru soran ilk filozof: Miletli Thales", "okuma": ["Thales, yaklaşık MÖ 624'te Milet'te doğdu. Bu antik İyon kenti bugün Aydın'ın Didim ilçesi yakınlarındadır. Milet o çağda Ege kıyısında, ticaretle zenginleşmiş bir liman kentiydi. Antik Çağ'ın \"Yedi Bilge\"sinden biri sayılır.", "Thales evreni tanrıların öyküleriyle değil, doğanın kendisiyle açıklamaya çalıştı. Ona göre her şeyin temelinde su vardı. Aristoteles, bütün varlığı tek bir maddeye dayandıran ilk düşünürün Thales olduğunu yazar; bu yüzden ilk filozof diye anılır.", "Onun, MÖ 585'te Lidyalılarla Medler arasındaki bir savaşı durduran güneş tutulmasını önceden bildirdiği aktarılır. Tarihçi Herodot yalnızca yılını bildirdiğini söyler; günümüz bilim insanlarının çoğu bu tahminin kesinliğinden şüphe eder.", "Thales'ten günümüze tek bir yazı kalmadı. Onu tanıdığımız her şey, sonraki yazarların aktardıklarından gelir."], "biliyor": "Thales'in Mısır'daki piramitlerin yüksekliğini gölgelerinden ölçtüğü anlatılır; ancak bu hikâyenin bir efsane olabileceği düşünülür.", "sorular": [{"s": "Thales'e göre her şeyin temelinde ne vardı?", "c": ["Ateş", "Hava", "Su", "Toprak"], "d": 2, "a": "Ona göre her şeyin ilkesi suydu."}, {"s": "Thales'in doğduğu Milet bugün hangi ilimizin sınırlarındadır?", "c": ["İzmir", "Muğla", "Aydın", "Denizli"], "d": 2, "a": "Aydın'ın Didim ilçesi yakınlarındadır."}, {"s": "Thales'in önceden bildirdiği söylenen olay nedir?", "c": ["Bir deprem", "Bir güneş tutulması", "Bir kuyruklu yıldız", "Bir sel"], "d": 1, "a": "MÖ 585'teki güneş tutulmasını bildirdiği aktarılır."}], "sohbet": "Çocukken gökyüzüne bakıp merak ettiğiniz bir soru hatırlıyor musunuz?"}, {"n": 56, "kategori": "Haftanın tekrarı", "sahne": "tepeler", "baslik": "Sekizinci haftanın küçük sınavı", "okuma": ["Bu hafta Gutenberg'in matbaasından Osman Hamdi Bey'in kaplumbağalarına, Victoria Şelalesi'nin dumanından Kaşgarlı Mahmud'un sözlüğüne, Chopin'in piyanosundan Thales'in sorularına uzandınız.", "Sekiz hafta geride kaldı. Aşağıdaki beş soruyla bu haftayı tazeleyin."], "biliyor": "Öğrendiğiniz bir şeyi başka birine anlatmak, onu kendi aklınızda da daha sağlam yerleştirir.", "sorular": [{"s": "Gutenberg İncili sayfalarındaki satır sayısıyla nasıl anılır?", "c": ["36 satırlı", "42 satırlı", "48 satırlı", "50 satırlı"], "d": 1, "a": "Sayfaların çoğunda 42 satır bulunur."}, {"s": "Kaplumbağa Terbiyecisi tablosundaki adamın elinde hangi çalgı vardır?", "c": ["Ud", "Ney", "Kanun", "Bağlama"], "d": 1, "a": "Elinde bir ney tutar."}, {"s": "Victoria Şelalesi hangi iki ülkenin sınırındadır?", "c": ["Kenya ve Tanzanya", "Zambiya ve Zimbabve", "Mısır ve Sudan", "Kongo ve Angola"], "d": 1, "a": "Zambiya ile Zimbabve arasındadır."}, {"s": "Divânu Lugâti't-Türk'ü bir sahaftan satın alan kimdir?", "c": ["Ali Emirî Efendi", "Ahmet Vefik Paşa", "Kilisli Rifat", "Evliya Çelebi"], "d": 0, "a": "Ali Emirî Efendi otuz altına satın aldı."}, {"s": "Chopin hangi ülkede doğdu?", "c": ["Fransa", "Avusturya", "Polonya", "Macaristan"], "d": 2, "a": "Varşova yakınlarındaki Żelazowa Wola'da doğdu."}], "sohbet": "Bu haftanın konularından hangisi sizi en çok şaşırttı?"}, {"n": 57, "kategori": "Bilim tarihi", "sahne": "safak", "baslik": "Adı bir kelimeye dönüşen matematikçi: Harezmî", "okuma": ["Harezmî, yaklaşık 780 ile 850 yılları arasında yaşadı. Adını, Orta Asya'daki Harezm bölgesinden alır. Bağdat'ta, Halife Me'mun döneminde bilim kitaplarının toplanıp çevrildiği Beytü'l-Hikme'de, yani \"Bilgelik Evi\"nde çalıştı.", "En ünlü kitabı, denklemlerin çözümünü düzenli yöntemlerle anlatan \"el-Kitâbü'l-muhtasar fî hisâbi'l-cebr ve'l-mukâbele\"dir. Bu kitabın adındaki \"cebr\" kelimesi, bugün kullandığımız \"cebir\" sözcüğünün kaynağıdır. Kitap 12. yüzyılda Latinceye çevrildi ve Avrupa'da da okundu.", "Hint rakamlarıyla hesap yapmayı anlatan bir eseri 12. yüzyılda Latinceye çevrildi ve bu rakamların Avrupa'da tanınmasına katkı sağladı. Bu eserin Arapça aslı kaybolmuş, yalnızca Latince çevirisi kalmıştır.", "Latince çevirilerde adı \"Algoritmi\" diye yazıldı. Bugün bilgisayarların dilinde sıkça duyduğumuz \"algoritma\" kelimesi buradan gelir."], "biliyor": "Harezmî matematiğin yanında astronomi ve coğrafyayla da uğraştı; dünyadaki şehirlerin konumlarını gösteren bir coğrafya kitabı da yazdı.", "sorular": [{"s": "Harezmî hangi şehirde çalıştı?", "c": ["Kahire", "Bağdat", "Şam", "Kurtuba"], "d": 1, "a": "Bağdat'taki Beytü'l-Hikme'de çalıştı."}, {"s": "\"Algoritma\" kelimesi nereden gelir?", "c": ["Bir Yunan tanrısından", "Harezmî'nin Latince adından", "Bir Arap şehrinden", "Bir Hint rakamından"], "d": 1, "a": "Adının Latince yazılışı \"Algoritmi\"den gelir."}, {"s": "Harezmî'nin kitabının adından hangi kelime türemiştir?", "c": ["Geometri", "Cebir", "Aritmetik", "Trigonometri"], "d": 1, "a": "Kitap adındaki \"cebr\" kelimesinden."}], "sohbet": "Okulda en sevdiğiniz ya da en zorlandığınız ders hangisiydi?"}, {"n": 58, "kategori": "Mimari", "sahne": "dag", "baslik": "Yirmi yıllığına dikilen kule: Eyfel", "okuma": ["Eyfel Kulesi, Fransız Devrimi'nin yüzüncü yılında, 1889'da Paris'te düzenlenen Dünya Fuarı için yapıldı. Tasarımı Gustave Eiffel'in şirketindeki mühendisler Maurice Koechlin ile Émile Nouguier'ye, mimar Stephen Sauvestre'ye aittir.", "Kule 31 Mart 1889'da, iki yıl gibi kısa bir sürede tamamlandı. Yapımında toplam 7.300 ton ağırlığında 18.000 demir parça ve 2,5 milyon perçin kullanıldı. 300 metrelik boyuyla, 1930'a kadar dünyanın en yüksek yapısı oldu.", "Herkes onu sevmedi. Yapımı başlamadan önce 300 kadar sanatçı ve yazar, kuleyi Paris'e yakışmayan bir yapı diye eleştiren bir dilekçe imzaladı.", "Kule yirmi yıl sonra sökülecekti. Ama telsiz yayınlarında işe yaradığı anlaşılınca 1910'da izni uzatıldı. Bugün tepesinde hâlâ radyo ve televizyon antenleri vardır."], "biliyor": "Eyfel Kulesi paslanmaya karşı belirli aralıklarla baştan sona boyanır; her boyamada onlarca ton boya kullanılır.", "sorular": [{"s": "Eyfel Kulesi hangi etkinlik için yapıldı?", "c": ["Olimpiyat Oyunları", "1889 Dünya Fuarı", "Bir kralın taç giyme töreni", "Bir savaşın sonu"], "d": 1, "a": "1889 Paris Dünya Fuarı için yapıldı."}, {"s": "Kule 1930'da hangi yapının tamamlanmasıyla dünyanın en yüksek yapısı olma unvanını kaybetti?", "c": ["Empire State Binası", "Chrysler Binası", "Big Ben", "Galata Kulesi"], "d": 1, "a": "New York'taki Chrysler Binası."}, {"s": "Kulenin sökülmekten kurtulmasında ne etkili oldu?", "c": ["Turistlerin ilgisi", "Telsiz yayınlarındaki yararı", "Bir kralın emri", "Yüksek bir fiyata satılması"], "d": 1, "a": "Telsiz yayınları için yararlı olduğu anlaşıldı."}], "sohbet": "Başta sevmediğiniz ama zamanla çok sevdiğiniz bir şey oldu mu?"}, {"n": 59, "kategori": "Coğrafya", "sahne": "vadi", "baslik": "Anadolu'nun beyaz aynası: Tuz Gölü", "okuma": ["İç Anadolu'nun ortasında, Ankara, Konya ve Aksaray illerinin buluştuğu yerde Türkiye'nin ikinci büyük gölü uzanır: Tuz Gölü.", "Göl çok sığdır; çoğu yerde derinliği yarım metreyi geçmez. Su yüzeyi mevsime ve yağışa göre büyüyüp küçülür; kurak yıllarda belirgin biçimde daralır. Yazın sular çekildiğinde, geride kilometrelerce uzanan bembeyaz bir tuz tabakası kalır.", "Gölün suyu son derece tuzludur; tuz oranının yüzde otuzu aştığı bildirilir. Türkiye'nin tuz ihtiyacının önemli bir bölümü buradan karşılanır. Kıyılarındaki tuzlalarda tuz, güneşte buharlaşan sudan toplanır.", "Tuz Gölü, Türkiye'de flamingoların en önemli kuluçka alanıdır. Gölün çevresi 2000 yılında Özel Çevre Koruma Bölgesi ilan edildi. Burada seksenden fazla kuş türü görülür."], "biliyor": "Tuz Gölü'nün çevresinde, yalnızca bu bölgede yetişen otuzdan fazla endemik bitki türü bulunduğu bildirilir.", "sorular": [{"s": "Tuz Gölü, Türkiye'nin kaçıncı büyük gölüdür?", "c": ["Birinci", "İkinci", "Üçüncü", "Dördüncü"], "d": 1, "a": "Van Gölü'nden sonra ikinci büyük göldür."}, {"s": "Hangi il Tuz Gölü'ne kıyısı olan iller arasında değildir?", "c": ["Ankara", "Konya", "Aksaray", "Kayseri"], "d": 3, "a": "Göl Ankara, Konya ve Aksaray sınırlarındadır."}, {"s": "Tuz Gölü hangi kuşun Türkiye'deki en önemli kuluçka alanıdır?", "c": ["Leylek", "Flamingo", "Pelikan", "Turna"], "d": 1, "a": "Flamingoların en önemli kuluçka alanıdır."}], "sohbet": "Sofranızdan hiç eksik olmayan, size \"ev\" hissi veren bir lezzet hangisi?"}, {"n": 60, "kategori": "Edebiyat", "sahne": "safak", "baslik": "Şehrazat'ın bitmeyen geceleri: Binbir Gece Masalları", "okuma": ["Binbir Gece Masalları, yüzyıllar içinde Hint, İran ve Arap anlatılarından derlenmiş büyük bir hikâye hazinesidir. Masallar bir çerçeve öyküye bağlanır: Şehrazat, her gece hükümdara bir masal anlatır ve hikâyeyi en heyecanlı yerinde yarım bırakır. Devamını merak eden hükümdar, ertesi geceyi bekler.", "Masalları Batı'ya tanıtan, Fransız şarkiyatçı Antoine Galland oldu. Galland'ın Fransızca çevirisi 1704 ile 1717 arasında on iki cilt hâlinde yayımlandı; son ciltler onun 1715'teki ölümünden sonra çıktı.", "Galland çevirisinde büyük ölçüde 14. yüzyıldan kalma Suriye kökenli bir Arapça yazmayı kullandı.", "İlginçtir ki en ünlü iki masal, Alaaddin ile Ali Baba, bilinen eski Arapça yazmalarda yoktur. Galland bunları 1709'da Paris'te tanıştığı Halepli anlatıcı Hanna Diyab'dan dinleyip yazdı."], "biliyor": "Galland'ın günlüğüne göre Hanna Diyab, \"lamba hikâyesi\"ni yani Alaaddin'i anlatmayı 5 Mayıs 1709'da bitirdi.", "sorular": [{"s": "Binbir Gece Masalları'nda her gece masal anlatan kimdir?", "c": ["Şirin", "Şehrazat", "Leyla", "Aslı"], "d": 1, "a": "Şehrazat her gece bir masal anlatır."}, {"s": "Masalları Fransızcaya çeviren kimdir?", "c": ["Victor Hugo", "Antoine Galland", "Jean de La Fontaine", "Charles Perrault"], "d": 1, "a": "Antoine Galland, 1704'ten itibaren."}, {"s": "Hanna Diyab hangi şehirliydi?", "c": ["Bağdat", "Kahire", "Halep", "Şam"], "d": 2, "a": "Halepli bir anlatıcıydı."}], "sohbet": "Çocukken size anlatılan ya da sizin anlattığınız en sevilen masal hangisiydi?"}, {"n": 61, "kategori": "Müzik", "sahne": "deniz", "baslik": "Bozkırın Tezenesi: Neşet Ertaş", "okuma": ["Neşet Ertaş 1938'de Kırşehir'in Çiçekdağı ilçesine bağlı Kırtıllar köyünde doğdu. Babası, halk ozanı Muharrem Ertaş'tı. Önce keman çalmayı öğrendi, sonra bağlamayı eline aldı ve küçük yaşlarda babasıyla birlikte düğünlerde çalmaya başladı.", "Bozkırın sesini türkülerine taşıdığı için \"Bozkırın Tezenesi\" diye anıldı. \"Neden Garip Garip Ötersin Bülbül\" ve \"Hareli Gelin\" en sevilen eserleri arasındadır.", "1970'lerin sonunda Almanya'ya gitti ve yıllarca orada yaşadı. Uzun bir aradan sonra Türkiye'ye dönüp yeniden konserler verdi.", "Kendisine devlet sanatçılığı unvanı önerildiğinde, \"Ben zaten bu devletin sanatçısıyım\" diyerek geri çevirdiği aktarılır. 2011'de İstanbul Teknik Üniversitesi ona fahri doktora verdi. 25 Eylül 2012'de İzmir'de öldü ve vasiyeti üzerine babasının yanına gömüldü."], "biliyor": "Neşet Ertaş, UNESCO'nun \"Yaşayan İnsan Hazineleri\" programı kapsamında Türkiye'de bu unvanla anılan halk sanatçılarından biridir.", "sorular": [{"s": "Neşet Ertaş'a hangi lakap verilmiştir?", "c": ["Âşıkların Sultanı", "Bozkırın Tezenesi", "Sazın Ustası", "Anadolu'nun Sesi"], "d": 1, "a": "\"Bozkırın Tezenesi\" diye anılır."}, {"s": "Neşet Ertaş'ın babası kimdir?", "c": ["Âşık Veysel", "Muharrem Ertaş", "Âşık Mahzunî", "Hacı Taşan"], "d": 1, "a": "Halk ozanı Muharrem Ertaş'tır."}, {"s": "Neşet Ertaş hangi ilde doğdu?", "c": ["Kırşehir", "Yozgat", "Sivas", "Kayseri"], "d": 0, "a": "Kırşehir'in Çiçekdağı ilçesinde doğdu."}], "sohbet": "Size gençliğinizi hatırlatan bir türkü ya da şarkı var mı?"}, {"n": 62, "kategori": "Felsefe", "sahne": "vadi", "baslik": "Komşuların saatini ayarladığı filozof: Kant", "okuma": ["Immanuel Kant 1724'te Königsberg'de, bugün Rusya'ya bağlı Kaliningrad şehrinde doğdu. Hayatını büyük ölçüde bu şehirde geçirdi; 1754'ten sonra doğduğu kentten hiç ayrılmadığı söylenir.", "Uzun yıllar özel ders verip üniversitede okuttu. 1770'te Königsberg Üniversitesi'ne mantık ve metafizik profesörü olarak atandı.", "En ünlü eseri \"Saf Aklın Eleştirisi\" 1781'de yayımlandı. Kitapta insan aklının neyi bilebileceğini, sınırlarının nerede olduğunu sorguladı. Bilgimizin yalnızca dışarıdan gelmediğini, aklımızın dünyayı kendi kalıplarıyla düzenlediğini öne sürdü. Bu fikir, kendisinden sonraki felsefeyi derinden etkiledi. 1784'te yazdığı \"Aydınlanma Nedir?\" adlı kısa yazısı da bugün hâlâ okunur.", "Kant'ın günlük düzeni o kadar şaşmazdı ki komşularının, onun öğleden sonraki yürüyüşüne bakıp saatlerini ayarladığı anlatılır. Sakin, düzenli ve küçük bir dünyada yaşadı; ama düşünceleri dünyanın dört bir yanına yayıldı. 1804'te öldü."], "biliyor": "Kant, en ünlü eseri \"Saf Aklın Eleştirisi\"ni elli yedi yaşında yayımladı; en etkili eserlerini hayatının ikinci yarısında yazdı.", "sorular": [{"s": "Kant hangi şehirde doğdu?", "c": ["Berlin", "Viyana", "Königsberg", "Leipzig"], "d": 2, "a": "Bugün Kaliningrad adını taşıyan Königsberg'de doğdu."}, {"s": "\"Saf Aklın Eleştirisi\" hangi yıl yayımlandı?", "c": ["1781", "1724", "1804", "1754"], "d": 0, "a": "1781'de, Kant elli yedi yaşındayken yayımlandı."}, {"s": "Komşularının saatlerini neye göre ayarladığı anlatılır?", "c": ["Kilise çanına", "Kant'ın yürüyüşüne", "Güneş saatine", "Postacının gelişine"], "d": 1, "a": "Kant'ın şaşmaz öğleden sonra yürüyüşüne göre."}], "sohbet": "Sizin de hiç bozmadığınız, size iyi gelen küçük bir günlük alışkanlığınız var mı?"}, {"n": 63, "kategori": "Haftanın tekrarı", "sahne": "tepeler", "baslik": "Dokuzuncu haftanın küçük sınavı", "okuma": ["Bu hafta Harezmî'nin cebirinden Eyfel Kulesi'nin perçinlerine, Tuz Gölü'nün beyaz kıyılarından Şehrazat'ın gecelerine, Neşet Ertaş'ın bağlamasından Kant'ın yürüyüşlerine uzandınız.", "Dokuz hafta geride kaldı. Aşağıdaki beş soruyla bu haftayı tazeleyin."], "biliyor": "Bir bilgiyi birkaç gün arayla yeniden hatırlamaya çalışmak, onu tek seferde uzun uzun okumaktan daha kalıcı kılar.", "sorular": [{"s": "\"Algoritma\" kelimesi kimin adından gelir?", "c": ["İbn Sina", "Harezmî", "Bîrûnî", "Uluğ Bey"], "d": 1, "a": "Harezmî'nin adı Latincede \"Algoritmi\" diye yazıldı."}, {"s": "Eyfel Kulesi hangi etkinlik için yapıldı?", "c": ["1889 Paris Dünya Fuarı", "1900 Olimpiyatları", "Bir kralın taç giyme töreni", "Napolyon'un zafer kutlaması"], "d": 0, "a": "1889'da Paris'te düzenlenen Dünya Fuarı için yapıldı."}, {"s": "Tuz Gölü, Türkiye'de hangi kuşun en önemli kuluçka alanıdır?", "c": ["Leylek", "Pelikan", "Flamingo", "Turna"], "d": 2, "a": "Türkiye'de flamingoların en önemli kuluçka alanıdır."}, {"s": "Alaaddin ile Ali Baba masallarını Galland'a kim anlattı?", "c": ["Şehrazat", "Hanna Diyab", "Evliya Çelebi", "Kaşgarlı Mahmud"], "d": 1, "a": "Halepli anlatıcı Hanna Diyab, 1709'da Paris'te anlattı."}, {"s": "Neşet Ertaş'ın lakabı nedir?", "c": ["Bozkırın Tezenesi", "Âşıkların Sultanı", "Anadolu'nun Sesi", "Sazın Şahı"], "d": 0, "a": "\"Bozkırın Tezenesi\" diye anılır."}], "sohbet": "Bu haftanın konularından hangisini bir arkadaşınıza anlatmak isterdiniz?"}, {"n": 64, "kategori": "Bilim tarihi", "sahne": "safak", "baslik": "Yıldızları sayan hükümdar: Uluğ Bey", "okuma": ["Uluğ Bey 1394'te doğdu; büyük hükümdar Timur'un torunudur. Gençliğinden itibaren Semerkant'ı yönetti ama asıl tutkusu gökyüzüydü. Sarayına matematikçileri ve gökbilimcileri topladı.", "1420'lerin başında Semerkant'ta bir gözlemevi kurdurdu. Yapının en dikkat çekici bölümü, toprağın içine doğru uzanan, kırk metreyi aşan dev bir ölçüm yayıydı. Bu büyüklük, yıldızların konumunu çok hassas ölçmeyi sağlıyordu.", "Burada yapılan gözlemler \"Zîc-i Sultânî\" adlı eserde toplandı. Eserdeki yıldız kataloğunda 1.018 sabit yıldızın konumu yer alır. Bu katalog, teleskop icat edilmeden önce yapılmış en kapsamlı yıldız listelerinden biri olarak anılır.", "Ünlü matematikçi Ali Kuşçu da onun öğrencilerindendi. Bilim, Uluğ Bey'in sarayında bir devlet işi kadar ciddiye alınıyordu. Uluğ Bey 1447'de tahta geçti, iki yıl sonra, 1449'da hayatını kaybetti."], "biliyor": "Uluğ Bey'in güneş yılının uzunluğunu, kendisinden sonra gelen Kopernik ve Tycho Brahe'den daha doğru hesapladığı kabul edilir.", "sorular": [{"s": "Uluğ Bey kimin torunudur?", "c": ["Cengiz Han", "Timur", "Alparslan", "Babür Şah"], "d": 1, "a": "Büyük hükümdar Timur'un torunudur."}, {"s": "Uluğ Bey'in gözlemevi hangi şehirdedir?", "c": ["Buhara", "Herat", "Semerkant", "Bağdat"], "d": 2, "a": "Gözlemevini Semerkant'ta kurdurdu."}, {"s": "Zîc-i Sultânî'deki katalogda yaklaşık kaç yıldız vardır?", "c": ["108", "518", "1.018", "5.000"], "d": 2, "a": "1.018 sabit yıldızın konumu yer alır."}], "sohbet": "Şehir ışıklarından uzakta, yıldızlarla dolu bir gökyüzü gördüğünüz bir gece hatırlıyor musunuz?"}, {"n": 65, "kategori": "Mimari", "sahne": "vadi", "baslik": "Taşa işlenmiş dantel: Divriği Ulu Camii ve Darüşşifası", "okuma": ["Sivas'ın Divriği ilçesinde, sade bir dış görünüşün ardında Anadolu'nun en şaşırtıcı taş işçiliklerinden biri saklıdır. Dağların arasındaki bu küçük ilçeye gelen ziyaretçiler, kapıların önünde uzun süre durup bakakalır.", "Yapı 1228–1229 yıllarında, Mengücekli beyi Ahmet Şah ve eşi Turan Melek tarafından yaptırıldı. Caminin bitişiğindeki darüşşifa, yani hastane, Turan Melek'in eseridir. Böylece bir cami ile bir şifa yurdu aynı çatı altında birleşir.", "Mimarı Hürrem Şah'tır. Taçkapılardaki bitki, yıldız ve geometrik süslemeler o kadar derin oyulmuştur ki taş, yer yer bir dantel ya da işleme gibi görünür. Kapıların her biri farklı bir üslupla bezenmiştir. Her ayrıntının ayrı bir özenle işlendiği görülür.", "Divriği Ulu Camii ve Darüşşifası bugün UNESCO Dünya Mirası Listesi'nde yer alır. Sekiz yüz yılı aşkın süredir ayakta duran yapı, Anadolu'daki taş ustalığının en güzel tanıklarından biridir."], "biliyor": "Caminin kuzey taçkapısında, günün belirli saatlerinde güneş ışığının oluşturduğu gölgenin namaz kılan bir insan silüetine benzediği anlatılır.", "sorular": [{"s": "Divriği Ulu Camii hangi ildedir?", "c": ["Sivas", "Erzincan", "Malatya", "Kayseri"], "d": 0, "a": "Sivas'ın Divriği ilçesindedir."}, {"s": "Darüşşifayı kim yaptırdı?", "c": ["Ahmet Şah", "Hürrem Şah", "Turan Melek", "Alaeddin Keykubad"], "d": 2, "a": "Hastane bölümü Ahmet Şah'ın eşi Turan Melek'in eseridir."}, {"s": "Darüşşifa ne demektir?", "c": ["Kütüphane", "Hastane", "Medrese", "Kervansaray"], "d": 1, "a": "Darüşşifa, şifa yurdu yani hastane demektir."}], "sohbet": "Gördüğünüz yapılar içinde sizi en çok etkileyen hangisi oldu?"}, {"n": 66, "kategori": "Coğrafya", "sahne": "dag", "baslik": "Gökyüzüne en yakın yer: Everest", "okuma": ["Dünyanın en yüksek dağı Everest, Himalayalar'da Nepal ile Çin'in sınırında yükselir. Tibetliler ona \"Çomolungma\", Nepalliler \"Sagarmatha\" der.", "Dağın yüksekliği yıllar boyunca farklı ölçümlerle tartışıldı. Aralık 2020'de Nepal ile Çin, ortak bir açıklamayla zirvenin deniz seviyesinden 8.848,86 metre yüksekte olduğunu duyurdu.", "Zirveye ilk kez 29 Mayıs 1953'te ulaşıldı. Yeni Zelandalı dağcı Edmund Hillary ile Şerpa dağcı Tenzing Norgay, sabah erkenden yola çıkıp öğleden önce zirveye vardılar. Bu başarı, yıllardır süren denemelerin ve büyük bir ekip çalışmasının sonucuydu.", "Bu yükseklikte hava o kadar incedir ki dağcıların çoğu ek oksijenle tırmanır. Soğuk, rüzgâr ve yorgunluk her adımı zorlaştırır. Bu yüzden Everest, insan dayanıklılığının ve sabrının simgelerinden biri sayılır."], "biliyor": "Hillary ile Tenzing Norgay, 29 Mayıs 1953 sabahı yola çıktıktan sonra saat 11.30 civarında zirveye ulaştılar.", "sorular": [{"s": "Everest hangi iki ülkenin sınırındadır?", "c": ["Hindistan ve Pakistan", "Nepal ve Çin", "Butan ve Nepal", "Çin ve Moğolistan"], "d": 1, "a": "Nepal ile Çin'in sınırında yükselir."}, {"s": "2020'de açıklanan yükseklik kaç metredir?", "c": ["8.611", "8.848,86", "8.586", "9.012,5"], "d": 1, "a": "Nepal ve Çin 8.848,86 metre olarak duyurdu."}, {"s": "Everest'e ilk tırmanış hangi yıl gerçekleşti?", "c": ["1924", "1938", "1953", "1965"], "d": 2, "a": "29 Mayıs 1953'te Hillary ve Tenzing Norgay zirveye ulaştı."}], "sohbet": "Hayatınızda \"bir gün mutlaka görmek istiyorum\" dediğiniz bir doğa harikası var mı?"}, {"n": 67, "kategori": "Edebiyat", "sahne": "safak", "baslik": "Kil tabletlerdeki ölümsüzlük arayışı: Gılgamış Destanı", "okuma": ["Gılgamış Destanı, insanlığın bilinen en eski edebi eserlerinden biridir. Kahramanı Gılgamış, Mezopotamya'daki Uruk şehrinin kralıdır.", "Destanın en eksiksiz metni, on iki kil tablete Akadca yazılmıştır. Bu tabletler Ninova'da, Asur kralı Asurbanipal'in kütüphanesinde bulundu.", "Bu tabletler binlerce yıl toprağın altında kaldı. Hikâyede Gılgamış, önce rakibi sonra en yakın dostu olan Enkidu ile maceralara atılır. Enkidu'nun ölümü onu derinden sarsar ve ölümsüzlüğün sırrını aramaya koyulur. Sonunda gençlik veren bir bitkiyi bulur, ama bir yılan bitkiyi kapıp yer.", "1872'de British Museum'da çalışan George Smith, tabletlerden birinde büyük bir tufan anlatısını çözdü. Bu hikâyede tufandan kurtulan kişinin adı Utnapiştim'dir. Dostluk, kayıp ve ölümlülük üzerine sorular soran destan, bugün de okurlarını düşündürür."], "biliyor": "Gılgamış Destanı yüzyıllarca unutuldu; kil tabletler ancak 19. yüzyılda yeniden okunabildi.", "sorular": [{"s": "Gılgamış hangi şehrin kralıdır?", "c": ["Babil", "Ninova", "Uruk", "Ur"], "d": 2, "a": "Mezopotamya'daki Uruk şehrinin kralıdır."}, {"s": "Gılgamış'ın en yakın dostu kimdir?", "c": ["Enkidu", "Utnapiştim", "Asurbanipal", "Humbaba"], "d": 0, "a": "Önce rakibi, sonra dostu olan Enkidu'dur."}, {"s": "Gılgamış'ın bulduğu bitkiyi kim alıp götürür?", "c": ["Bir aslan", "Bir kartal", "Bir yılan", "Bir tanrı"], "d": 2, "a": "Bir yılan bitkiyi kapıp yer."}], "sohbet": "Sizin için \"gerçek dost\" kimdir, aklınıza gelen biri var mı?"}, {"n": 68, "kategori": "Müzik", "sahne": "deniz", "baslik": "Yunus'un şiirlerini orkestraya taşıyan besteci: Adnan Saygun", "okuma": ["Ahmet Adnan Saygun 7 Eylül 1907'de İzmir'de doğdu. Müziğe küçük yaşta ilgi duydu. 1928'de devlet bursuyla Paris'e gitti ve Vincent d'Indy'nin öğrencisi oldu.", "Cumhuriyet'in ilk yıllarında Türk müziğine yeni bir ses arayan ve \"Türk Beşleri\" diye anılan beş besteciden biridir. 19 Haziran 1934'te sahnelenen \"Özsoy\" ilk Türk operası olarak kabul edilir.", "1936'da ünlü Macar besteci Béla Bartók Türkiye'ye geldiğinde, Saygun ona eşlik etti. İkisi birlikte, özellikle Osmaniye çevresinde halk ezgilerini derleyip notaya aldılar.", "En tanınmış eseri, Yunus Emre'nin şiirleri üzerine yazdığı \"Yunus Emre Oratoryosu\"dur. 1942'de tamamlanan eser, 1958'de New York'ta Leopold Stokowski yönetiminde seslendirildi. Saygun 6 Ocak 1991'de öldü. Bugün Türkiye'de çağdaş müziğin öncülerinden biri olarak anılır."], "biliyor": "Yunus Emre Oratoryosu'nun ilk seslendirilişi 25 Mayıs 1946'da Ankara'da yapıldı.", "sorular": [{"s": "Adnan Saygun hangi şehirde doğdu?", "c": ["İstanbul", "İzmir", "Ankara", "Bursa"], "d": 1, "a": "7 Eylül 1907'de İzmir'de doğdu."}, {"s": "Saygun 1936'da hangi besteciye halk ezgisi derlerken eşlik etti?", "c": ["Paul Hindemith", "Béla Bartók", "Igor Stravinski", "Maurice Ravel"], "d": 1, "a": "Macar besteci Béla Bartók'a eşlik etti."}, {"s": "İlk Türk operası kabul edilen eser hangisidir?", "c": ["Kerem", "Özsoy", "Taşbebek", "Keloğlan"], "d": 1, "a": "1934'te sahnelenen \"Özsoy\" ilk Türk operası kabul edilir."}], "sohbet": "Bir şiiri ya da şarkıyı dinlerken içinizin titrediği bir an hatırlıyor musunuz?"}, {"n": 69, "kategori": "Felsefe", "sahne": "vadi", "baslik": "Mutluluk veren bilgi: Kutadgu Bilig", "okuma": ["Kutadgu Bilig, Balasagunlu Yusuf Has Hacib'in 1069–1070 yıllarında yazdığı uzun bir eserdir. Kaşgar'da tamamlanıp Karahanlı hükümdarı Tabgaç Buğra Han'a sunuldu. Adı \"mutlu olma bilgisi\" anlamına gelir.", "Eser, iyi bir ülkenin nasıl yönetileceğini ve iyi bir insanın nasıl yaşayacağını anlatır. Bunu kuru öğütlerle değil, dört kişi arasındaki konuşmalarla yapar: hükümdar Kün Toğdı adaleti, vezir Ay Toldı talihi, Ögdülmiş aklı, Odgurmış ise hayatın sonunu, yani âkıbeti temsil eder.", "Eserin son beyti 6.645'inci beyittir. Bugüne üç yazma nüshası ulaşmıştır: Viyana, Kahire ve Fergana nüshaları. Yaklaşık bin yıl önce yazılan öğütlerin pek çoğu adalet, ölçülülük ve bilginin değeri üzerine olduğu için bugün de taze görünür."], "biliyor": "Kutadgu Bilig'in Viyana'da bulunan nüshası, Herat'ta yazıldığı için \"Herat nüshası\" diye de bilinir.", "sorular": [{"s": "Kutadgu Bilig'i kim yazdı?", "c": ["Kaşgarlı Mahmud", "Yusuf Has Hacib", "Edip Ahmet", "Ahmet Yesevi"], "d": 1, "a": "Balasagunlu Yusuf Has Hacib yazdı."}, {"s": "Eserde adaleti hangi karakter temsil eder?", "c": ["Ay Toldı", "Ögdülmiş", "Kün Toğdı", "Odgurmış"], "d": 2, "a": "Hükümdar Kün Toğdı adaleti temsil eder."}, {"s": "\"Kutadgu Bilig\" adı ne anlama gelir?", "c": ["Yol gösteren kitap", "Mutlu olma bilgisi", "Hükümdarın sözleri", "Türklerin dili"], "d": 1, "a": "\"Mutlu olma bilgisi\" anlamına gelir."}], "sohbet": "Size göre mutlu bir hayatın en önemli parçası nedir?"}, {"n": 70, "kategori": "Haftanın tekrarı", "sahne": "tepeler", "baslik": "Onuncu haftanın küçük sınavı", "okuma": ["Bu hafta Uluğ Bey'in yıldızlarından Divriği'nin taş dantellerine, Everest'in zirvesinden Gılgamış'ın kil tabletlerine, Adnan Saygun'un oratoryosundan Kutadgu Bilig'in öğütlerine uzandınız.", "On hafta geride kaldı. Aşağıdaki beş soruyla bu haftayı tazeleyin."], "biliyor": "Öğrendiğiniz şeyleri birbirine bağlamak, örneğin bir yeri bir kişiyle eşleştirmek, onları hatırlamayı kolaylaştırır.", "sorular": [{"s": "Uluğ Bey gözlemevini hangi şehirde kurdurdu?", "c": ["Semerkant", "Buhara", "Tebriz", "Merv"], "d": 0, "a": "Semerkant'ta kurdurdu."}, {"s": "Divriği Darüşşifası'nın banisi kimdir?", "c": ["Ahmet Şah", "Turan Melek", "Hürrem Şah", "Mimar Sinan"], "d": 1, "a": "Ahmet Şah'ın eşi Turan Melek yaptırdı."}, {"s": "Everest'e ilk tırmananlardan Tenzing Norgay hangi halktandır?", "c": ["Tibetli bir keşiş", "Şerpa", "Moğol", "Yeni Zelandalı"], "d": 1, "a": "Tenzing Norgay bir Şerpa dağcıdır."}, {"s": "Gılgamış tabletleri hangi kralın kütüphanesinde bulundu?", "c": ["Hammurabi", "Asurbanipal", "Nabukadnezar", "Sargon"], "d": 1, "a": "Ninova'da Asurbanipal'in kütüphanesinde bulundu."}, {"s": "Yunus Emre Oratoryosu 1958'de nerede seslendirildi?", "c": ["Paris", "Londra", "New York", "Viyana"], "d": 2, "a": "New York'ta Leopold Stokowski yönetiminde seslendirildi."}], "sohbet": "Bu haftanın konularından hangisi size bir anınızı hatırlattı?"}, {"n": 71, "kategori": "Bilim tarihi", "sahne": "deniz", "baslik": "Hamamdan \"Buldum!\" diye fırlayan bilgin: Arşimet", "okuma": ["Arşimet MÖ 287 civarında Sicilya'daki Siraküza şehrinde doğdu. Matematikçi, mühendis ve mucit olarak çağının en parlak akıllarından biriydi. Daire, küre ve silindir gibi şekiller üzerine yaptığı hesaplar, yüzyıllar boyunca matematikçilere yol gösterdi.", "Romalı mimar Vitruvius, ünlü bir hikâye aktarır: Kral II. Hieron, yaptırdığı tacın saf altından olup olmadığını merak eder ve işi Arşimet'e verir. Arşimet hamama girdiğinde suyun taştığını fark eder. Bir cismin yerini değiştirdiği su miktarıyla tacı sınayabileceğini anlar ve sevinçle \"Eureka!\", yani \"Buldum!\" diye bağırır.", "Bu hikâyenin gerçekten böyle yaşanıp yaşanmadığı bilinmez, ama bilim tarihinin en sevilen anlatılarından biri olmuştur. Arşimet MÖ 212'de, Romalılar Siraküza'yı ele geçirdiğinde hayatını kaybetti. Ardında yüzyıllarca okunacak eserler bıraktı."], "biliyor": "Arşimet'in bazı eserleri, 13. yüzyılda yazısı kazınıp üzerine dua metni yazılmış bir parşömen kitapta saklı kaldı ve yüzyıllar sonra yeniden okunabildi.", "sorular": [{"s": "Arşimet hangi şehirde doğdu?", "c": ["Atina", "İskenderiye", "Siraküza", "Roma"], "d": 2, "a": "Sicilya'daki Siraküza'da doğdu."}, {"s": "\"Eureka\" ne anlama gelir?", "c": ["Buldum", "Kurtuldum", "Başardım", "Bitti"], "d": 0, "a": "\"Buldum!\" demektir."}, {"s": "Taç hikâyesini aktaran Romalı yazar kimdir?", "c": ["Plinius", "Vitruvius", "Cicero", "Seneca"], "d": 1, "a": "Romalı mimar Vitruvius aktarır."}], "sohbet": "Aklınıza en güzel fikirlerin geldiği yer neresi: duşta mı, yürürken mi, yatmadan önce mi?"}, {"n": 72, "kategori": "Mimari", "sahne": "safak", "baslik": "Beş yılda yükselen kubbe: Ayasofya", "okuma": ["532 yılında İstanbul'da çıkan Nika ayaklanmasında eski kilise yandı. İmparator I. Justinianus, yerine çok daha büyük bir yapı yaptırmaya karar verdi. İşi iki bilgin üstlendi: Trallesli Anthemios ve Miletli İsidoros. İkisi de mimardan çok matematikçi ve mühendis olarak tanınıyordu.", "Yapı şaşırtıcı bir hızla, yalnızca beş yılda tamamlandı ve 27 Aralık 537'de açıldı. Ortadaki kubbe 31 metreyi aşan çapı ve yaklaşık 48 metrelik yüksekliğiyle, sanki gökten asılı duruyormuş izlenimi verir. Kubbenin eteğindeki pencere dizisi bu hafiflik duygusunu güçlendirir.", "1453'ten sonra camiye dönüştürülen Ayasofya, yaklaşık bin beş yüz yıldır İstanbul'un siluetinde yerini koruyor. Sonraki yüzyılların pek çok mimarı, bu kubbeyi aşmayı kendine hedef bildi."], "biliyor": "Ayasofya'nın ilk kubbesi 558'deki depremlerin ardından çöktü; 562'de eskisinden daha yüksek olarak yeniden yapıldı.", "sorular": [{"s": "Ayasofya hangi imparator döneminde yapıldı?", "c": ["Konstantin", "I. Justinianus", "Theodosius", "Herakleios"], "d": 1, "a": "I. Justinianus döneminde, 532–537 yılları arasında yapıldı."}, {"s": "Ayasofya'nın mimarlarından biri hangisidir?", "c": ["Vitruvius", "Mimar Sinan", "Trallesli Anthemios", "Apollodoros"], "d": 2, "a": "Trallesli Anthemios ve Miletli İsidoros birlikte tasarladı."}, {"s": "Ayasofya hangi yıl açıldı?", "c": ["537", "453", "1037", "1453"], "d": 0, "a": "27 Aralık 537'de açıldı."}], "sohbet": "İstanbul'da ilk kez gördüğünüzde sizi en çok etkileyen yapı hangisiydi?"}, {"n": 73, "kategori": "Coğrafya", "sahne": "vadi", "baslik": "Denize bir okyanus kadar su taşıyan nehir: Amazon", "okuma": ["Amazon, Güney Amerika'da And Dağları'ndan doğar ve kıtayı batıdan doğuya geçerek Atlas Okyanusu'na dökülür. Yolu boyunca binlerce kolu toplar. Uzunluk bakımından Nil ile birinciliği tartışır, ama taşıdığı su miktarında rakipsizdir.", "Saniyede ortalama 200 bin metreküpü aşan bir su taşıdığı hesaplanır. Bu, Kongo Nehri'nin yaklaşık beş, Mississippi'nin ise yaklaşık on iki katıdır. Dünyadaki nehirlerden okyanuslara akan suyun yaklaşık yüzde 15 ile 20'si arasında bir bölümünün Amazon'dan geldiği kabul edilir.", "Nehrin çevresindeki yağmur ormanı, dünyanın en zengin canlı çeşitliliğine ev sahipliği yapar. Yağmur mevsiminde nehir taşar, ormanın geniş bölümleri aylarca su altında kalır ve balıklar ağaçların arasında yüzer. Bu döngü, bölgede yaşayan insanların ve hayvanların hayatını yüzyıllardır belirler."], "biliyor": "Amazon'un denize taşıdığı su, kendisinden sonra gelen en büyük dokuz nehrin toplamından daha fazladır.", "sorular": [{"s": "Amazon Nehri hangi okyanusa dökülür?", "c": ["Büyük Okyanus", "Hint Okyanusu", "Atlas Okyanusu", "Arktik Okyanusu"], "d": 2, "a": "Atlas Okyanusu'na dökülür."}, {"s": "Amazon hangi dağlardan doğar?", "c": ["Alpler", "And Dağları", "Kayalık Dağlar", "Himalayalar"], "d": 1, "a": "And Dağları'ndan doğar."}, {"s": "Amazon uzunluk bakımından hangi nehirle birinciliği tartışır?", "c": ["Nil", "Yangtze", "Mississippi", "Tuna"], "d": 0, "a": "Nil ile birinciliği tartışır."}], "sohbet": "Gördüğünüz en etkileyici nehir ya da su kenarı hangisiydi?"}, {"n": 74, "kategori": "Edebiyat", "sahne": "dag", "baslik": "Bağdat'tan yükselen aşk şiiri: Fuzûlî", "okuma": ["Fuzûlî 15. yüzyılın sonlarında, bugünkü Irak topraklarında doğdu; doğum yılı kaynaklarda farklı verilir. Hayatının çoğunu Kerbela ve Bağdat çevresinde geçirdi. Türkçe, Farsça ve Arapça şiir yazdı; Türkçe şiirleri ise onu yüzyıllar boyunca sevilen bir şair yaptı.", "En tanınmış eseri, 1535 ya da 1536'da tamamladığı Leylâ vü Mecnûn mesnevisidir. Bu eski Arap hikâyesini pek çok şair yazmıştı, ama Fuzûlî onu derin bir iç dünyayla işledi. Onun Mecnun'u, sevdiğini ararken aslında kendini ve hakikati arar.", "Kanuni Sultan Süleyman Bağdat'ı aldıktan sonra Fuzûlî'ye günlük dokuz akçe maaş bağlandı. Ama memurlar bu parayı bir türlü ödemedi. Şair de bu durumu ince bir mizahla anlatan Şikâyetnâme'yi yazdı."], "biliyor": "Fuzûlî adı \"gereksiz, boşboğaz\" gibi anlamlara da gelir; şairin bu mahlası, başkaları almasın diye bilerek seçtiği aktarılır.", "sorular": [{"s": "Fuzûlî'nin en tanınmış mesnevisi hangisidir?", "c": ["Hüsn ü Aşk", "Leylâ vü Mecnûn", "Hüsrev ü Şirin", "Mesnevî"], "d": 1, "a": "Leylâ vü Mecnûn, 1535–1536'da tamamlandı."}, {"s": "Fuzûlî'ye bağlanan günlük maaş kaç akçeydi?", "c": ["Bir", "Beş", "Dokuz", "Yüz"], "d": 2, "a" const NOTIFY_TOPIC = "";

const AUTO_ON = () => TOPIC_OK && family;

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },

};

let outbox = store.get("merak.outbox", []);
async function flushOutbox(){
  if(!AUTO_ON() || !outbox.length) return true;
  const rest = [];
  for(const m of outbox){
    try{ const r = await fetch("https://ntfy.sh/", {method:"POST", body:JSON.stringify(Object.assign({topic:NOTIFY_TOPIC}, m))}); if(!r.ok) throw 0; }
    catch(e){ rest.push(m); }
  }
  outbox = rest; store.set("merak.outbox", outbox); return rest.length === 0;
}
function notify(title, message, tags){ if(!AUTO_ON()) return; outbox.push({title, message, tags:tags||[], priority:3}); store.set("merak.outbox", outbox); flushOutbox(); }
addEventListener("online", flushOutbox);

/* ---------- tarih ve günlük açılış ---------- */
const dayStr = d => new Intl.DateTimeFormat("en-CA", {timeZone:TZ, year:"numeric", month:"2-digit", day:"2-digit"}).format(d);
async function serverNow(){
  try{
    const r = await fetch("manifest.webmanifest?zaman=" + Date.now(), {cache:"no-store"});
    const h = r.headers.get("Date");
    if(h){ const d = new Date(h); if(!isNaN(d)){ clockSkew = d - Date.now(); return d; } }
  }catch(e){}
  return null;
}
/* Günde iki merak: sabah 06:00, akşam 18:00 (İstanbul). Bir "dilim" = "YYYY-AA-GG-0" (sabah) ya da "-1" (akşam). */
const istHour = d => +new Intl.DateTimeFormat("en-GB", {timeZone:TZ, hour:"2-digit", hourCycle:"h23"}).format(d);
const slotOf = d => { const x = new Date(d.getTime() - 6*3600e3); return dayStr(x) + (istHour(x) < 12 ? "-0" : "-1"); };
const SLOT_ADI = {"0":"Sabah", "1":"Akşam"};
async function schedule(){
  const now = await serverNow(); netOk = !!now;
  const slot = slotOf(now || new Date());
  let fresh = 0;
  if(plan && plan.last && plan.last.length === 10) plan.last += "-0";   // eski (günde bir) kayıttan geçiş
  if(!plan){ plan = {count:1, last:slot, slots:{1: slot.slice(-1)}}; fresh = 1; }
  else if(now && slot > plan.last && plan.count < GUNLER.length){
    plan.count++; plan.last = slot; plan.slots = plan.slots || {}; plan.slots[plan.count] = slot.slice(-1); fresh = plan.count;
  }
  store.set("merak.plan", plan);
  open = GUNLER.slice(0, plan.count);
  return fresh;
}
function nextSlot(){
  const parts = new Intl.DateTimeFormat("en-GB", {timeZone:TZ, hour:"2-digit", minute:"2-digit", second:"2-digit", hourCycle:"h23"}).formatToParts(new Date(Date.now() + clockSkew));
  const g = t => +parts.find(x => x.type === t).value;
  const sec = g("hour")*3600 + g("minute")*60 + g("second");
  const evening = sec >= 6*3600 && sec < 18*3600;
  const target = sec < 6*3600 ? 6*3600 : sec < 18*3600 ? 18*3600 : 30*3600;
  const left = target - sec;
  return {ad: evening ? "Akşam merakı" : "Sabah merakı", saat: evening ? "18:00" : "06:00", kalan: Math.floor(left/3600) + " sa " + Math.floor((left%3600)/60) + " dk"};
}
function greet(){
  const h = +new Intl.DateTimeFormat("en-GB", {timeZone:TZ, hour:"2-digit", hourCycle:"h23"}).format(new Date(Date.now() + clockSkew));
  const w = h < 5 ? "İyi geceler" : h < 12 ? "Günaydın" : h < 18 ? "İyi günler" : "İyi akşamlar";
  $("greet").textContent = name ? w + ", " + name : "Günün Merakı";
  $("today-date").textContent = new Intl.DateTimeFormat("tr-TR", {timeZone:TZ, weekday:"long", day:"numeric", month:"long"}).format(new Date(Date.now() + clockSkew));
  $("whoami").textContent = name ? name + " olarak okuyorsunuz" : "";
}

function renderQuiz(d){
  const a = answers[d.n] || [];
  const doneAll = a.length === d.sorular.length && a.every(x => x !== null && x !== undefined);
  const right = d.sorular.filter((q, i) => a[i] === q.d).length;
  let html = "<h3>Üç soruda pekiştirin</h3><p class=\"sub\">Bir seçeneğe dokunun; doğru cevap ve kısa açıklaması hemen görünür.</p>";
  d.sorular.forEach((q, i) => {
    const picked = a[i];
    const answered = picked !== undefined && picked !== null;
    html += '<div class="q"><p class="qs"><span>' + (i+1) + ".</span>" + esc(q.s) + '</p><div class="opts">' +
      q.c.map((c, j) => {
        let cls = "opt";
        if(answered){ cls += j === q.d ? " right" : (j === picked ? " wrong" : " dim"); }
        return '<button type="button" class="' + cls + '" data-q="' + i + '" data-c="' + j + '"' + (answered ? " disabled" : "") + ">" + esc(c) + "</button>";
      }).join("") + "</div>" +
      (answered ? '<p class="expl"><b>' + (picked === q.d ? "Doğru. " : "Doğru cevap: " + esc(q.c[q.d]) + ". ") + "</b>" + esc(q.a) + "</p>" : "") +
      "</div>";
  });
  if(doneAll){
    html += '<div class="result"><span class="score">' + right + " / " + d.sorular.length + "</span><span class=\"note\">" +
      (right === d.sorular.length ? "Hepsi doğru. Bu merak tamam." : "Güzel bir okuma. Yanlışlar da öğrenmenin parçası.") + "</span></div>";
  }
  $("quiz").innerHTML = html;
  $("quiz").querySelectorAll(".opt:not([disabled])").forEach(b => b.addEventListener("click", () => pick(d, +b.dataset.q, +b.dataset.c)));
  const talk = $("talk");
  talk.hidden = !doneAll;
  talk.innerHTML = "<b>Bu akşam konuşun</b><p>" + esc(d.sohbet) + "</p>";
}

function pick(d, qi, ci){
  const a = answers[d.n] || new Array(d.sorular.length).fill(null);
  if(a[qi] !== null && a[qi] !== undefined) return;
  a[qi] = ci; answers[d.n] = a; store.set("merak.cevap", answers);
  const doneAll = a.every(x => x !== null && x !== undefined);
  if(doneAll){
    const right = d.sorular.filter((q, i) => a[i] === q.d).length;
    const today = plan.last.slice(0, 10);
    if(streak.last !== today){
      const y = new Date(today + "T12:00:00Z"); y.setUTCDate(y.getUTCDate() - 1);
      streak.n = streak.last === y.toISOString().slice(0,10) ? streak.n + 1 : 1; streak.last = today; store.set("merak.seri", streak);
    }
    notify((name || "Biri") + " Merak " + d.n + "'i bitirdi · " + right + "/" + d.sorular.length, d.baslik + "\n\nBu akşamın sorusu: " + d.sohbet, right === d.sorular.length ? ["sparkles"] : ["books"]);
  }
  render();
  if(doneAll) setTimeout(() => $("talk").scrollIntoView({behavior:"smooth", block:"center"}), 250);
}

function renderTomorrow(){

    (ready ? "Her gün iki merak açılır: sabah 06:00'da ve akşam 18:00'de. " + ns.ad + " " + ns.saat + "'de kendiliğinden açılacak. Kalan süre: <b id=\"cd\">" + ns.kalan + "</b>" : "Yakında yeni meraklar eklenecek.") +
    (netOk ? "" : "<br>Yeni merakın açılması için internete bağlı olun.") + "</p></div></div>";
}

function renderPast(){
  if(open.length < 2){ $("past").innerHTML = ""; return; }
  $("past").innerHTML = "<h3>Geçmiş meraklar</h3><div class=\"plist\">" + open.slice().reverse().map(d => {
    const a = answers[d.n] || [];
    const done = a.length === d.sorular.length && a.every(x => x !== null && x !== undefined);
    const right = d.sorular.filter((q, i) => a[i] === q.d).length;
    return '<button type="button" class="prow" data-n="' + d.n + '" aria-current="' + (d.n === selected) + '"><span class="dn">' + d.n + '</span><span class="pt"><small>' + esc(d.kategori) + "</small><span>" + esc(d.baslik) + '</span></span><span class="ps">' + (done ? right + "/" + d.sorular.length : "okunmadı") + "</span></button>";
  }).join("") + "</div>";
  $("past").querySelectorAll(".prow").forEach(b => b.addEventListener("click", () => { selected = +b.dataset.n; render(); window.scrollTo({top:0, behavior:"smooth"}); }));
}

/* ---------- uçuşan ışık zerreleri ---------- */
(function motes(){
  const host = document.querySelector(".motes"); let h = "";
  for(let i=0;i<14;i++){ h += '<i style="left:' + (Math.random()*100).toFixed(1) + "%;animation-duration:" + (14 + Math.random()*16).toFixed(1) + "s;animation-delay:-" + (Math.random()*20).toFixed(1) + "s;width:" + (3 + Math.random()*5).toFixed(1) + "px;height:" + (3 + Math.random()*5).toFixed(1) + 'px"></i>'; }
  host.innerHTML = h;
})();

/* ---------- sakin ambiyans müziği (tarayıcıda canlı üretilir) ---------- */
const Ambient = (() => {
  let ctx, master, verb, keepAlive, timers = [], on = false;
  function silentWav(){
    // 1 saniyelik sessiz WAV: iPhone'un sesi "medya" olarak çalmasını sağlar
    const rate = 8000, n = rate, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
    const w = (o, t) => { for(let i=0;i<t.length;i++) v.setUint8(o+i, t.charCodeAt(i)); };
    w(0,"RIFF"); v.setUint32(4, 36 + n, true); w(8,"WAVE"); w(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24, rate, true); v.setUint32(28, rate, true); v.setUint16(32,1,true); v.setUint16(34,8,true); w(36,"data"); v.setUint32(40, n, true);
    for(let i=0;i<n;i++) v.setUint8(44+i, 128);
    return URL.createObjectURL(new Blob([buf], {type:"audio/wav"}));
  }
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const CHORDS = [[48,55,64,71],[45,52,60,67],[41,48,57,64],[43,50,59,62]];
  const BELLS = [72,74,76,79,81,84,86,88];
  function impulse(sec){
    const len = ctx.sampleRate * sec, b = ctx.createBuffer(2, len, ctx.sampleRate);
    for(let c=0;c<2;c++){ const d = b.getChannelData(c); for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.6); }
    return b;
  }
  function pad(notes, t){
    notes.forEach(m => {
      ["sine","triangle"].forEach((type, k) => {
        const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
        o.type = type; o.frequency.value = hz(m); o.detune.value = k ? 5 : -4;
        f.type = "lowpass"; f.frequency.value = 900;
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(k ? .038 : .06, t + 3.5); g.gain.setValueAtTime(k ? .038 : .06, t + 7); g.gain.linearRampToValueAtTime(0, t + 12);
        o.connect(f).connect(g); g.connect(master); g.connect(verb);
        o.start(t); o.stop(t + 12.2);
      });
    });
  }
  function bell(t){
    const m = BELLS[Math.floor(Math.random()*BELLS.length)];
    const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine"; o.frequency.value = hz(m); o2.type = "sine"; o2.frequency.value = hz(m) * 2.01;
    const g2 = ctx.createGain(); g2.gain.value = .25;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.085, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + 4);
    o.connect(g); o2.connect(g2).connect(g); g.connect(verb); g.connect(master);
    o.start(t); o2.start(t); o.stop(t + 4.1); o2.stop(t + 4.1);
  }
  function waves(){
    const len = ctx.sampleRate * 4, b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0);
    let last = 0; for(let i=0;i<len;i++){ last = (last + .02*(Math.random()*2-1)) / 1.02; d[i] = last * 3.5; }
    const s = ctx.createBufferSource(); s.buffer = b; s.loop = true;
    const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 500;
    const g = ctx.createGain(); g.gain.value = .05;
    const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = .08; lg.gain.value = .04;
    lfo.connect(lg).connect(g.gain);
    s.connect(f).connect(g).connect(master); s.start(); lfo.start();
  }
  function loop(){
    let i = 0;
    const chord = () => { if(!on) return; pad(CHORDS[i++ % CHORDS.length], ctx.currentTime + .05); timers.push(setTimeout(chord, 9000)); };
    const ring = () => { if(!on) return; bell(ctx.currentTime + .05); timers.push(setTimeout(ring, 2200 + Math.random()*4200)); };
    chord(); timers.push(setTimeout(ring, 1500));
  }
  return {
    async start(){
      // iPhone sessiz moddayken de çalsın: ses oturumunu "müzik çalma" olarak işaretle
      try{ if(navigator.audioSession) navigator.audioSession.type = "playback"; }catch(e){}
      if(!keepAlive){ keepAlive = new Audio(silentWav()); keepAlive.loop = true; keepAlive.setAttribute("playsinline", ""); }
      try{ await keepAlive.play(); }catch(e){}
      if(!ctx){
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 3; comp.connect(ctx.destination);
        master = ctx.createGain(); master.gain.value = 0; master.connect(comp);
        verb = ctx.createConvolver(); verb.buffer = impulse(5); const vg = ctx.createGain(); vg.gain.value = .55; verb.connect(vg).connect(master);
        waves();
      }
      await ctx.resume(); on = true;
      master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setTargetAtTime(1, ctx.currentTime, 1.5);
      loop();
    },
    stop(){
      on = false; timers.forEach(clearTimeout); timers = [];
      if(keepAlive) keepAlive.pause();
      if(ctx){ master.gain.setTargetAtTime(0, ctx.currentTime, .6); setTimeout(() => { if(!on) ctx.suspend(); }, 2500); }
    },
    get on(){ return on; }
  };
})();
$("music").addEventListener("click", async () => {
  const b = $("music");
  if(Ambient.on){ Ambient.stop(); b.setAttribute("aria-pressed","false"); $("musiclbl").textContent = "Müzik"; store.set("merak.muzik", false); }
  else { try{ await Ambient.start(); b.setAttribute("aria-pressed","true"); $("musiclbl").textContent = "Müzik açık"; store.set("merak.muzik", true); }catch(e){ $("musiclbl").textContent = "Müzik çalmadı"; } }
});
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden" && Ambient.on){ Ambient.stop(); $("music").setAttribute("aria-pressed","false"); $("musiclbl").textContent = "Müzik"; } });

const normCode = c => c.toUpperCase().replace(/İ/g,"I").replace(/[^A-Z0-9]/g, "");
async function sha(t){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,"0")).join(""); }
function askName(){

  $("whoform").onsubmit = async e => {

/* ---------- başlangıç ---------- */
async function check(first){
  const fresh = await schedule();
  if(fresh || first){ selected = open[open.length-1].n; render(); }
  return fresh;
}
(async function start(){
  await check(true);
  if(!name) askName();
  flushOutbox();
  setInterval(() => { const c = $("cd"); if(c) c.textContent = nextSlot().kalan; if(plan && slotOf(new Date(Date.now() + clockSkew)) > plan.last) check(false); }, 30000);
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") check(false); });
})();
